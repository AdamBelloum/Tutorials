</style></head><body><div class="bespoke-marp-osc"><button data-bespoke-marp-osc="prev" tabindex="-1" title="Previous slide">Previous slide</button><span data-bespoke-marp-osc="page"></span><button data-bespoke-marp-osc="next" tabindex="-1" title="Next slide">Next slide</button><button data-bespoke-marp-osc="fullscreen" tabindex="-1" title="Toggle fullscreen (f)">Toggle fullscreen</button><button data-bespoke-marp-osc="overview" tabindex="-1" title="Toggle overview view (o)">Toggle overview view</button><button data-bespoke-marp-osc="presenter" tabindex="-1" title="Open presenter view (p)">Open presenter view</button></div><div id=":$p"><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="1" data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="1" style="--paginate:true;--header:Module: Foundations of Machine Learning;--theme:default;" data-marpit-pagination-total="72">
<header>Module: Foundations of Machine Learning</header>

<h1 id="module-foundations-of-machine-learning">Module: Foundations of Machine Learning</h1>
<p><strong>Audience:</strong> 1st-year undergraduates<br />
<strong>Time:</strong> ~120 minutes</p>
<ul>
<li>From <strong>rules</strong> to <strong>learning from data</strong></li>
<li>Core <strong>ML concepts</strong> and <strong>workflow</strong></li>
<li>Types of models: <strong>linear / non-linear</strong>, <strong>parametric / non-parametric</strong></li>
<li>How models <strong>learn</strong> (loss, optimization)</li>
<li><strong>Evaluation</strong>, overfitting, and <strong>data / ethics</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="2" style="--paginate:true;--header:Module: Foundations of Machine Learning;--theme:default;" data-marpit-pagination-total="72">
<header>Module: Foundations of Machine Learning</header>
<h1 id="plan-for-today">Plan for Today</h1>
<ol>
<li>Why Machine Learning? (from rules to learning)</li>
<li>Core ML concepts &amp; workflow</li>
<li>Models and data: linear vs non-linear, parametric vs non-parametric</li>
<li>How models learn: loss, gradient descent</li>
<li>Evaluating models &amp; avoiding traps</li>
<li>Real-world issues: data quality &amp; bias</li>
<li>Wrap-up &amp; questions</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="3" style="--paginate:true;--header:Module: Foundations of Machine Learning;--theme:default;" data-marpit-pagination-total="72">
<header>Module: Foundations of Machine Learning</header>
<h1 id="1-why-machine-learning">1. Why Machine Learning?</h1>
<p><strong>Before ML (Rule-based world)</strong></p>
<ul>
<li>Symbolic AI: humans write <strong>If–Then</strong> rules</li>
<li>Works well when:
<ul>
<li>Rules are clear</li>
<li>Data is clean and structured</li>
</ul>
</li>
<li>Fails when:
<ul>
<li>Data is noisy, messy, ambiguous</li>
<li>Patterns are too complex to write down</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="4" style="--paginate:true;--header:Module: Foundations of Machine Learning;--theme:default;" data-marpit-pagination-total="72">
<header>Module: Foundations of Machine Learning</header>
<h1 id="the-new-way-machine-learning">The New Way: Machine Learning</h1>
<ul>
<li><strong>Goal:</strong> Build <strong>learners</strong>, not hand-written rules</li>
<li>We provide <strong>data</strong> (examples), not logic</li>
<li>The computer <strong>learns patterns</strong> from data</li>
<li>We design:
<ul>
<li>The <strong>model form</strong> (architecture)</li>
<li>The <strong>learning algorithm</strong></li>
</ul>
</li>
</ul>
<p><strong>Key idea:</strong><br />
Instead of programming every rule, we <strong>optimize a model</strong> to fit the data.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="5" style="--paginate:true;--header:Module: Foundations of Machine Learning;--theme:default;" data-marpit-pagination-total="72">
<header>Module: Foundations of Machine Learning</header>
<h1 id="discussion-2%E2%80%933-min">Discussion (2–3 min)</h1>
<p>With a neighbor:</p>
<ul>
<li>Name one app or service you use (search, maps, recommendations, spam filter…).</li>
<li>Which parts could be <strong>fixed rules</strong>?</li>
<li>Which parts are likely <strong>learned from data</strong>?</li>
</ul>
<p>We’ll collect 2–3 examples.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="6" style="--paginate:true;--header:Module: Foundations of Machine Learning;--theme:default;" data-marpit-pagination-total="72">
<header>Module: Foundations of Machine Learning</header>
<h1 id="2-core-machine-learning-concepts">2. Core Machine Learning Concepts</h1>
<p>We’ll use these terms all</p>
<ul>
<li><strong>Data set</strong>: collection of examples</li>
<li><strong>Features</strong>: input variables (x)</li>
<li><strong>Labels / targets</strong>: what we want to predict (y)</li>
<li><strong>Model</strong>: mathematical function mapping x → y</li>
<li><strong>Training</strong>: fitting the model to known data</li>
<li><strong>Testing</strong>: checking performance on unseen data</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="7" style="--paginate:true;--header:Module: Foundations of Machine Learning;--theme:default;" data-marpit-pagination-total="72">
<header>Module: Foundations of Machine Learning</header>
<h1 id="what-is-machine-learning">What is Machine Learning?</h1>
<blockquote>
<p>“ML is a scientific discipline that deals with the construction and study of algorithms that can learn from data. Such algorithms operate in two steps:</p>
<ol>
<li>Building a model based on the data</li>
<li>Using the model to make predictions and decisions rather than following explicitly programmed instructions.”</li>
</ol>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--header:Module: Foundations of Machine Learning;--theme:default;" data-marpit-pagination-total="72">
<header>Module: Foundations of Machine Learning</header>
<h1 id="types-of-machine-learning-overview">Types of Machine Learning (Overview)</h1>
<ul>
<li>
<p><strong>Supervised learning</strong></p>
<ul>
<li>Inputs <strong>and</strong> labels</li>
<li>E.g., spam vs not-spam, disease vs no disease, house prices</li>
</ul>
</li>
<li>
<p><strong>Unsupervised learning</strong></p>
<ul>
<li>Only inputs (no labels)</li>
<li>E.g., clustering customers, discovering groups</li>
</ul>
</li>
<li>
<p><strong>Reinforcement learning</strong></p>
<ul>
<li>Agent interacts with environment, receives <strong>rewards</strong></li>
<li>E.g., game-playing, robot control</li>
</ul>
</li>
</ul>
<p>In this module we focus on <strong>supervised learning</strong>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="9" style="--paginate:true;--header:Module: Foundations of Machine Learning;--theme:default;" data-marpit-pagination-total="72">
<header>Module: Foundations of Machine Learning</header>
<h1 id="ml-workflow-big-picture">ML Workflow: Big Picture</h1>
<p>Typical <strong>modelling lifecycle</strong>:</p>
<ol>
<li><strong>Define the problem</strong><br />
(classification / regression / other)</li>
<li><strong>Collect &amp; explore data</strong></li>
<li><strong>Pre-process</strong> and clean data</li>
<li><strong>Choose a model</strong> (algorithm)</li>
<li><strong>Train</strong> the model on training data</li>
<li><strong>Validate / tune</strong> the model</li>
<li><strong>Test</strong> the model on unseen data</li>
<li><strong>Deploy</strong> and <strong>monitor</strong> in the real world</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="10" style="--paginate:true;--header:Module: Foundations of Machine Learning;--theme:default;" data-marpit-pagination-total="72">
<header>Module: Foundations of Machine Learning</header>
<h1 id="the-machine-learning-work-flow-simplified">The Machine Learning Work-Flow (Simplified)</h1>
<ol>
<li><strong>Input data</strong></li>
<li><strong>Feature extraction / engineering</strong></li>
<li><strong>Choose model + train</strong></li>
<li><strong>Evaluate</strong></li>
<li><strong>Deploy &amp; use</strong></li>
</ol>
<p>(We’ll walk through each part at a high level.)</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="11" style="--paginate:true;--header:Module: Foundations of Machine Learning;--theme:default;" data-marpit-pagination-total="72">
<header>Module: Foundations of Machine Learning</header>
<h1 id="is-the-data-ready">Is the Data Ready?</h1>
<p>Often: <strong>No</strong></p>
<ul>
<li>Wrong format (images, voice, text, logs)</li>
<li><strong>Missing values</strong> (e.g., unknown age)</li>
<li><strong>Noise</strong> and errors</li>
</ul>
<p>We need:</p>
<ul>
<li><strong>Pre-processing</strong> (cleaning, normalizing, encoding)</li>
<li><strong>Feature selection</strong> (which variables matter?)</li>
<li><strong>Feature engineering</strong> (creating new useful features)</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="12" style="--paginate:true;--header:Module: Foundations of Machine Learning;--theme:default;" data-marpit-pagination-total="72">
<header>Module: Foundations of Machine Learning</header>
<h1 id="datasets-train-validation-test">Datasets: Train, Validation, Test</h1>
<p>We don’t use all data at once:</p>
<ul>
<li><strong>Training set</strong>
<ul>
<li>Used to <strong>fit</strong> the model</li>
</ul>
</li>
<li><strong>Validation set</strong>
<ul>
<li>Used to tune <strong>hyperparameters</strong> (settings)</li>
</ul>
</li>
<li><strong>Test set</strong>
<ul>
<li>Used once, at the end, to estimate <strong>generalization</strong></li>
</ul>
</li>
</ul>
<p>Typical simple split:</p>
<ul>
<li>70–80% train</li>
<li>20–30% test<br />
(or train / validation / test).</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="13" style="--paginate:true;--header:Module: Foundations of Machine Learning;--theme:default;" data-marpit-pagination-total="72">
<header>Module: Foundations of Machine Learning</header>
<h1 id="how-to-split-data-concept">How to Split Data (Concept)</h1>
<p>Ways to split:</p>
<ul>
<li>Simple <strong>train/test split</strong></li>
<li><strong>Train / validation / test</strong></li>
<li><strong>Cross-validation</strong> (CV):
<ul>
<li>Use multiple folds; each fold gets a chance to be test data</li>
<li>More stable estimate, but slower</li>
</ul>
</li>
<li>Special strategies:
<ul>
<li><strong>Stratified</strong> splits (keep class proportions)</li>
<li><strong>TimeSeriesSplit</strong> for time-ordered data</li>
</ul>
</li>
</ul>
<p>We won’t go into code details, but the <strong>idea</strong> is important.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--header:Module: Foundations of Machine Learning;--theme:default;" data-marpit-pagination-total="72">
<header>Module: Foundations of Machine Learning</header>
<h1 id="3-what-is-a-model">3. What Is a Model?</h1>
<p><strong>Formal view</strong></p>
<ul>
<li>A model is a function<p><mjx-container class="MathJax" jax="SVG" display="true" style="margin: 0;"><svg style="vertical-align: -0.566ex; display: block; width: 100%; height: auto; max-height: 2.262ex;" xmlns="http://www.w3.org/2000/svg" width="8.927ex" height="2.262ex" role="img" focusable="false" viewBox="0 -750 3945.6 1000"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D453" d="M118 -162Q120 -162 124 -164T135 -167T147 -168Q160 -168 171 -155T187 -126Q197 -99 221 27T267 267T289 382V385H242Q195 385 192 387Q188 390 188 397L195 425Q197 430 203 430T250 431Q298 431 298 432Q298 434 307 482T319 540Q356 705 465 705Q502 703 526 683T550 630Q550 594 529 578T487 561Q443 561 443 603Q443 622 454 636T478 657L487 662Q471 668 457 668Q445 668 434 658T419 630Q412 601 403 552T387 469T380 433Q380 431 435 431Q480 431 487 430T498 424Q499 420 496 407T491 391Q489 386 482 386T428 385H372L349 263Q301 15 282 -47Q255 -132 212 -173Q175 -205 139 -205Q107 -205 81 -186T55 -132Q55 -95 76 -78T118 -61Q162 -61 162 -103Q162 -122 151 -136T127 -157L118 -162Z"></path></g><g data-mml-node="mo" transform="translate(550,0)"><path data-c="28" d="M94 250Q94 319 104 381T127 488T164 576T202 643T244 695T277 729T302 750H315H319Q333 750 333 741Q333 738 316 720T275 667T226 581T184 443T167 250T184 58T225 -81T274 -167T316 -220T333 -241Q333 -250 318 -250H315H302L274 -226Q180 -141 137 -14T94 250Z"></path></g><g data-mml-node="mi" transform="translate(939,0)"><path data-c="1D465" d="M52 289Q59 331 106 386T222 442Q257 442 286 424T329 379Q371 442 430 442Q467 442 494 420T522 361Q522 332 508 314T481 292T458 288Q439 288 427 299T415 328Q415 374 465 391Q454 404 425 404Q412 404 406 402Q368 386 350 336Q290 115 290 78Q290 50 306 38T341 26Q378 26 414 59T463 140Q466 150 469 151T485 153H489Q504 153 504 145Q504 144 502 134Q486 77 440 33T333 -11Q263 -11 227 52Q186 -10 133 -10H127Q78 -10 57 16T35 71Q35 103 54 123T99 143Q142 143 142 10 <li>It has <strong>parameters</strong> (weights) that we learn</li>
</ul>
<p><strong>Intuition</strong></p>
<ul>
<li>Model = <strong>recipe</strong>
<ul>
<li>Inputs = ingredients</li>
<li>Weights = how much of each ingredient</li>
<li>Output = final dish</li>
</ul>
</li>
<li>Training adjusts the recipe until dishes taste “correct” on average.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="15" style="--paginate:true;--header:Module: Foundations of Machine Learning;--theme:default;" data-marpit-pagination-total="72">
<header>Module: Foundations of Machine Learning</header>
<h1 id="linear-vs-non-linear-models-idea">Linear vs Non-Linear Models (Idea)</h1>
<ul>
<li>
<p><strong>Linear model</strong></p>
<ul>
<li>Assumes a <strong>straight-line</strong> relationship</li>
<li>Example form:<p><mjx-container class="MathJax" jax="SVG" display="true" style="margin: 0;"><svg style="vertical-align: -0.464ex; display: block; width: 100%; height: auto; max-height: 2.034ex;" xmlns="http://www.w3.org/2000/svg" width="25.824ex" height="2.034ex" role="img" focusable="false" viewBox="0 -694 11414.1 899"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D466" d="M21 287Q21 301 36 335T84 406T158 442Q199 442 224 419T250 355Q248 336 247 334Q247 331 231 288T198 191T182 105Q182 62 196 45T238 27Q261 27 281 38T312 61T339 94Q339 95 344 114T358 173T377 247Q415 397 419 404Q432 431 462 431Q475 431 483 424T494 412T496 403Q496 390 447 193T391 -23Q363 -106 294 -155T156 -205Q111 -205 77 -183T43 -117Q43 -95 50 -80T69 -58T89 -48T106 -45Q150 -45 150 -87Q150 -107 138 -122T115 -142T102 -147L99 -148Q101 -153 118 -160T152 -167H160Q177 -167 186 -165Q219 -156 247 -127T290 -65T313 -9T321 21L315 17Q309 13 296 6T270 -6Q250 -11 231 -11Q185 -11 150 11T104 82Q103 89 103 113Q103 170 138 262T173 379Q173 380 173 381Q173 390 173 393T169 400T158 404H154Q131 404 112 385T82 344T65 302T57 280Q55 278 41 278H27Q21 284 21 287Z"></path></g><g data-mml-node="mo" transform="translate(767.8,0)"><path data-c="3D" d="M56 347Q56 360 70 367H707Q722 359 722 347Q722 336 708 328L390 327H72Q56 332 56 347ZM56 153Q56 168 72 173H708Q722 163 722 153Q722 140 707 133H70Q56 140 56 153Z"></path></g><g data-mml-node="msub" transform="translate(1823.6,0)"><g data-mml-node="mi"><path data-c="1D464" d="M580 385Q580 406 599 424T641 443Q659 443 674 425T690 368Q690 339 671 253Q656 197 644 161T609 80T554 12T482 -11Q438 -11 404 5T355 48Q354 47 352 44Q311 -11 252 -11Q226 -11 202 -5T155 14T118 53T104 116Q104 170 138 262T173 379Q173 380 173 381Q173 390 173 393T169 400T158 404H154Q131 404 112 385T82 344T65 302T57 280Q55 278 41 278H27Q21 284 21 287Q21 293 29 315T52 366T96 418T161 441Q204 441 227 416T250 358Q250 340 217 250T18 <li>Decision boundaries are lines / planes</li>
</ul>
</li>
<li>
<p><strong>Non-linear model</strong></p>
<ul>
<li>Can bend and curve</li>
<li>Captures complex patterns (circles, waves, etc.)</li>
</ul>
</li>
</ul>
<p>Examples we’ll name (no math details):</p>
<ul>
<li>Linear: Linear Regression, Logistic Regression, Linear SVM</li>
<li>Non-linear: Decision Trees, k-NN, Kernel SVM, Neural Networks</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="16" style="--paginate:true;--header:Module: Foundations of Machine Learning;--theme:default;" data-marpit-pagination-total="72">
<header>Module: Foundations of Machine Learning</header>
<h1 id="parametric-vs-non-parametric-models">Parametric vs Non-parametric Models</h1>
<p><strong>Parametric models</strong>[2]</p>
<ul>
<li>Number of parameters is <strong>fixed</strong>, independent of dataset size</li>
<li>Examples:
<ul>
<li>Linear models</li>
<li>Centroid-based models</li>
</ul>
</li>
<li>Pros: Simple, fast, less memory</li>
</ul>
<p><strong>Non-parametric models</strong></p>
<ul>
<li>Number of parameters can <strong>grow with the data</strong></li>
<li>Examples:
<ul>
<li>k-Nearest Neighbors</li>
<li>Many non-linear SVMs</li>
<li>Decision Trees</li>
</ul>
</li>
<li>Pros: Very flexible, can fit complex patterns</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="17" style="--paginate:true;--header:Module: Foundations of Machine Learning;--theme:default;" data-marpit-pagination-total="72">
<header>Module: Foundations of Machine Learning</header>
<h1 id="example-a-linear-model">Example: A Linear Model</h1>
<p>Predict exam score (y) from hours studied (x):</p>
<ul>
<li>Plot points (hours, score)</li>
<li>Try to draw the <strong>best straight line</strong> through them</li>
<li>Use this line to predict scores for new students</li>
</ul>
<p>This is <strong>linear regression</strong>: a classic parametric, linear model.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--header:Module: Foundations of Machine Learning;--theme:default;" data-marpit-pagination-total="72">
<header>Module: Foundations of Machine Learning</header>
<h1 id="example-a-non-linear-model">Example: A Non-Linear Model</h1>
<p>What if the relationship is not a straight line?</p>
<ul>
<li>Example: Performance increases with study time up to a point, then drops (over-study).</li>
<li>A linear model struggles with this pattern.</li>
<li>A <strong>non-linear model</strong> (like a decision tree or neural network) can bend the boundary to fit such shapes.</li>
</ul>
<p><strong>Lesson:</strong> choose model complexity to match <strong>data complexity</strong>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="19" style="--paginate:true;--header:Module: Foundations of Machine Learning;--theme:default;" data-marpit-pagination-total="72">
<header>Module: Foundations of Machine Learning</header>
<h1 id="early-and-common-ml-problem-types">Early and Common ML Problem Types</h1>
<p>Early ML and modern ML solved:</p>
<ol>
<li><strong>Game playing</strong>
<ul>
<li>Strategy and search (checkers, tic-tac-toe, backgammon)</li>
</ul>
</li>
<li><strong>Pattern classification</strong>
<ul>
<li>Handwritten digit recognition, signal classification</li>
</ul>
</li>
<li><strong>Regression</strong>
<ul>
<li>Predicting continuous values (trend forecasting)</li>
</ul>
</li>
<li><strong>Diagnostic support</strong>
<ul>
<li>Early “expert systems” using data (e.g., medical support)</li>
</ul>
</li>
</ol>
<p>Common pattern:<br />
<strong>input → transformation → output</strong><br />
learning the right transformation from data.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="20" style="--paginate:true;--header:Module: Foundations of Machine Learning;--theme:default;" data-marpit-pagination-total="72">
<header>Module: Foundations of Machine Learning</header>
<h1 id="4-models-as-transformations-matrices">4. Models as Transformations (Matrices)</h1>
<p>We often represent:</p>
<ul>
<li>Input data as <strong>vectors</strong> (lists of numbers)</li>
<li>Model parameters as <strong>matrices</strong> (tables of numbers)</li>
</ul>
<p><strong>Matrix transformation:</strong></p>
<ul>
<li>Input vector × matrix → output vector</li>
<li>Geometric view: rotates and stretches the space</li>
</ul>
<p>Learning = finding matrix values that make classes <strong>separable</strong>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="21" style="--paginate:true;--header:Module: Foundations of Machine Learning;--theme:default;" data-marpit-pagination-total="72">
<header>Module: Foundations of Machine Learning</header>
<h1 id="visual-intuition-space-as-data">Visual Intuition: Space as Data</h1>
<p>Imagine:</p>
<ul>
<li>Each example (image, email, etc.) is a point in a huge <strong>room</strong></li>
<li>Initially, points from different classes (cats/dogs) are mixed</li>
</ul>
<p>A model (matrix):</p>
<ul>
<li><strong>Reshapes</strong> the room (rotations, stretches)</li>
<li>Tries to move cats to one side, dogs to the other</li>
<li>So we can draw a <strong>simple boundary</strong> between them</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="22" style="--paginate:true;--header:Module: Foundations of Machine Learning;--theme:default;" data-marpit-pagination-total="72">
<header>Module: Foundations of Machine Learning</header>
<h1 id="optional-insight-instructor-note">Optional Insight (Instructor Note)</h1>
<p>For you (not necessarily for students):</p>
<ul>
<li>Most directions (vectors) in space are rotated and scaled by a matrix.</li>
<li><strong>Eigenvectors</strong> are special: they keep their direction, only scale changes.</li>
<li>In complex models, stable directions can correspond to important latent features.</li>
</ul>
<p>You can mention “some directions in the data are more stable and important than others” without the word “eigenvector”.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="23" style="--paginate:true;--header:Module: Foundations of Machine Learning;--theme:default;" data-marpit-pagination-total="72">
<header>Module: Foundations of Machine Learning</header>
<h1 id="from-rigid-maps-to-dynamic-transformations">From Rigid Maps to Dynamic Transformations</h1>
<p><strong>Symbolic AI (Rigid Map)</strong></p>
<ul>
<li>Knowledge = fixed rules</li>
<li>If data doesn’t match rules → failure</li>
<li>Hard to maintain/update</li>
</ul>
<p><strong>Machine Learning (Dynamic Transformation)</strong></p>
<ul>
<li>Knowledge = flexible parameters (weights in matrices)</li>
<li>Model adapts to data</li>
<li>We <strong>optimize</strong> the transformation, rather than writing rules</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="24" style="--paginate:true;--header:Module: Foundations of Machine Learning;--theme:default;" data-marpit-pagination-total="72">
<header>Module: Foundations of Machine Learning</header>
<h1 id="analogy-funnels-and-water">Analogy: Funnels and Water</h1>
<ul>
<li><strong>Symbolic AI</strong>
<ul>
<li>Rigid metal funnel</li>
<li>If water (data) comes from wrong angle, it spills</li>
</ul>
</li>
<li><strong>Machine Learning</strong>
<ul>
<li>Flexible funnel</li>
<li>Changes shape/angle to catch water from many directions</li>
</ul>
</li>
</ul>
<p><strong>Takeaway:</strong> ML changes the <strong>model</strong> to fit messy data.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="25" style="--paginate:true;--header:Module: Foundations of Machine Learning;--theme:default;" data-marpit-pagination-total="72">
<header>Module: Foundations of Machine Learning</header>
<h1 id="5-how-models-learn-training">5. How Models Learn: Training</h1>
<p>We don’t know good weights upfront.</p>
<p>Training loop (conceptual):</p>
<ol>
<li>Start with <strong>random</strong> weights (bad model)</li>
<li>Use model to make predictions on training data</li>
<li>Measure how <strong>wrong</strong> we are (loss function)</li>
<li>Adjust weights to reduce loss (optimization)</li>
<li>Repeat many times until performance stabilizes</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="26" style="--paginate:true;--header:Module: Foundations of Machine Learning;--theme:default;" data-marpit-pagination-total="72">
<header>Module: Foundations of Machine Learning</header>
<h1 id="the-loss-function-measuring-wrongness">The Loss Function: Measuring Wrongness</h1>
<ul>
<li>Loss function = <strong>error score</strong></li>
<li>Compares model prediction vs true label</li>
<li>Larger loss → worse performance</li>
</ul>
<p>Examples:</p>
<ul>
<li><strong>Mean Squared Error</strong> (regression)</li>
<li><strong>Cross-Entropy Loss</strong> (classification)</li>
</ul>
<p>We choose a loss function appropriate to the <strong>task</strong>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="27" style="--paginate:true;--header:Module: Foundations of Machine Learning;--theme:default;" data-marpit-pagination-total="72">
<header>Module: Foundations of Machine Learning</header>
<h1 id="gradient-descent-improving-the-model">Gradient Descent: Improving the Model</h1>
<p>Imagine loss as a <strong>mountain landscape</strong>:</p>
<ul>
<li>Height = error</li>
<li>We want to reach the <strong>lowest valley</strong></li>
</ul>
<p><strong>Gradient descent</strong>:</p>
<ul>
<li>At the current point, compute the <strong>slope</strong> (gradient)</li>
<li>Move a small step in the direction of <strong>steepest descent</strong></li>
<li>Repeat → gradually go downhill towards lower loss</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="28" style="--paginate:true;--header:Module: Foundations of Machine Learning;--theme:default;" data-marpit-pagination-total="72">
<header>Module: Foundations of Machine Learning</header>
<h1 id="learning-rate-step-size">Learning Rate: Step Size</h1>
<p><strong>Learning rate</strong> = how big each step is:</p>
<ul>
<li>Too large:
<ul>
<li>Jump over the valley</li>
<li>Training becomes unstable</li>
</ul>
</li>
<li>Too small:
<ul>
<li>Training is very slow</li>
<li>Can get stuck</li>
</ul>
</li>
</ul>
<p>Analogy: Hiking in the fog:</p>
<ul>
<li>You feel slope, but you don’t see the whole mountain.</li>
<li>Step size matters.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="29" style="--paginate:true;--header:Module: Foundations of Machine Learning;--theme:default;" data-marpit-pagination-total="72">
<header>Module: Foundations of Machine Learning</header>
<h1 id="weights-as-dials">Weights as Dials</h1>
<p>Think of each weight as a <strong>dial</strong>:</p>
<ul>
<li>The model has <strong>many dials</strong> controlling how features affect output.</li>
<li>Loss function = judge shouting louder when the output is wrong.</li>
<li>Training:
<ul>
<li>Turn each dial a little.</li>
<li>If the judge shouts less → keep turning that way.</li>
<li>Repeat until the shouts are minimized (loss is small).</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="30" style="--paginate:true;--header:Module: Foundations of Machine Learning;--theme:default;" data-marpit-pagination-total="72">
<header>Module: Foundations of Machine Learning</header>
<h1 id="quick-check-3%E2%80%934-min-pair-discussion">Quick Check (3–4 min, pair discussion)</h1>
<p>In pairs:</p>
<ol>
<li>What does the <strong>loss function</strong> tell us?</li>
<li>What does <strong>gradient descent</strong> change?</li>
<li>Why is <strong>learning rate</strong> important?</li>
</ol>
<p>We’ll collect a few answers.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="31" style="--paginate:true;--header:Module: Foundations of Machine Learning;--theme:default;" data-marpit-pagination-total="72">
<header>Module: Foundations of Machine Learning</header>
<h1 id="6-choosing-algorithms-a-glimpse">6. Choosing Algorithms: A Glimpse</h1>
<p>There are many models with different properties:</p>
<ul>
<li><strong>Basic models</strong>
<ul>
<li>Nearest Neighbours</li>
<li>Nearest Centroid</li>
<li>Linear Classification &amp; Regression</li>
<li>Logistic Regression</li>
</ul>
</li>
<li><strong>Non-linear models</strong>
<ul>
<li>Support Vector Machines (SVMs) &amp; kernels</li>
<li>Decision Trees</li>
<li>Random Forests</li>
<li>Gradient Boosting</li>
</ul>
</li>
</ul>
<p>Choice depends on:</p>
<ul>
<li>Data size and type</li>
<li>Interpretability needs</li>
<li>Computational limits</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="32" style="--paginate:true;--header:Module: Foundations of Machine Learning;--theme:default;" data-marpit-pagination-total="72">
<header>Module: Foundations of Machine Learning</header>
<h1 id="underfitting-vs-overfitting">Underfitting vs Overfitting</h1>
<p>When training models:</p>
<ul>
<li>
<p><strong>Underfitting</strong></p>
<ul>
<li>Model too simple</li>
<li>Misses important patterns</li>
<li>Bad on both train and test data</li>
</ul>
</li>
<li>
<p><strong>Overfitting</strong></p>
<ul>
<li>Model too complex</li>
<li>Memorizes noise in training data</li>
<li>Good on train, bad on test</li>
</ul>
</li>
</ul>
<p>There is a <strong>“sweet spot”</strong> in model complexity[2].</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="33" style="--paginate:true;--header:Module: Foundations of Machine Learning;--theme:default;" data-marpit-pagination-total="72">
<header>Module: Foundations of Machine Learning</header>
<h1 id="visual-intuition-model-complexity">Visual Intuition: Model Complexity</h1>
<ul>
<li>Simple model: almost straight line → <strong>underfits</strong></li>
<li>Very complex model: wiggles through every point → <strong>overfits</strong></li>
<li>Good model: captures main trend without chasing every outlier → <strong>sweet spot</strong>[2]</li>
</ul>
<p>Goal: <strong>generalization</strong> → good performance on <strong>unseen</strong> data.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="34" style="--paginate:true;--header:Module: Foundations of Machine Learning;--theme:default;" data-marpit-pagination-total="72">
<header>Module: Foundations of Machine Learning</header>
<h1 id="train--validation--test--cross-validation">Train / Validation / Test &amp; Cross-Validation</h1>
<p>To find the sweet spot:</p>
<ul>
<li>Use <strong>validation data</strong> to tune hyperparameters (e.g., tree depth, #neighbors)[3][4]</li>
<li>Use <strong>cross-validation</strong> for more reliable estimates:
<ul>
<li>Split data into k folds</li>
<li>Train on k−1 folds, test on remaining fold</li>
<li>Repeat k times, average performance</li>
</ul>
</li>
<li>Then finally evaluate once on the <strong>test set</strong>.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="35" style="--paginate:true;--header:Module: Foundations of Machine Learning;--theme:default;" data-marpit-pagination-total="72">
<header>Module: Foundations of Machine Learning</header>
<h1 id="model-families-names-only">Model Families (Names Only)</h1>
<p>Just to recognize names:</p>
<ul>
<li><strong>Linear models</strong>:
<ul>
<li>Linear Regression, Logistic Regression</li>
</ul>
</li>
<li><strong>Distance-based</strong>:
<ul>
<li>k-Nearest Neighbors, Nearest Centroid</li>
</ul>
</li>
<li><strong>Tree-based</strong>:
<ul>
<li>Decision Trees, Random Forests, Gradient Boosting</li>
</ul>
</li>
<li><strong>Margin-based</strong>:
<ul>
<li>Support Vector Machines (linear &amp; kernel)</li>
</ul>
</li>
<li><strong>Neural Networks</strong>:
<ul>
<li>From shallow networks to Deep Learning</li>
</ul>
</li>
</ul>
<p>Details will come later in the course.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="36" style="--paginate:true;--header:Module: Foundations of Machine Learning;--theme:default;" data-marpit-pagination-total="72">
<header>Module: Foundations of Machine Learning</header>
<h1 id="7-evaluation-metrics-beyond-accuracy">7. Evaluation Metrics: Beyond Accuracy</h1>
<p>Example: fraud detection</p>
<ul>
<li>Fraud = 0.015% of transactions</li>
<li>Model that always predicts “not fraud”:
<ul>
<li>Accuracy ≈ 99.985%</li>
<li>Catches <strong>zero</strong> fraud cases</li>
</ul>
</li>
</ul>
<p>Accuracy alone can be <strong>misleading</strong>.</p>
<p>Important metrics:</p>
<ul>
<li><strong>Precision</strong>: of predicted positives, how many are truly positive?</li>
<li><strong>Recall</strong>: of true positives, how many did we catch?</li>
</ul>
<p>Metric choice must match <strong>real-world costs</strong>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="37" style="--paginate:true;--header:Module: Foundations of Machine Learning;--theme:default;" data-marpit-pagination-total="72">
<header>Module: Foundations of Machine Learning</header>
<h1 id="8-the-reality-of-data-garbage-in-garbage-out">8. The Reality of Data: &quot;Garbage In, Garbage Out&quot;</h1>
<p>Models learn whatever is in the data:</p>
<ul>
<li><strong>Incomplete</strong> training data → models fail in new situations</li>
<li><strong>Noisy</strong> data → unstable predictions</li>
<li><strong>Biased</strong> data → biased models</li>
</ul>
<p>Most ML effort in practice:</p>
<ul>
<li>Data collection</li>
<li>Cleaning &amp; preprocessing</li>
<li>Careful evaluation</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="38" style="--paginate:true;--header:Module: Foundations of Machine Learning;--theme:default;" data-marpit-pagination-total="72">
<header>Module: Foundations of Machine Learning</header>
<h1 id="ethics-example-biased-hiring">Ethics Example: Biased Hiring</h1>
<p>Simplified real case:</p>
<ul>
<li>Company trains model on 10 years of past hiring data.</li>
<li>Historical hires are mostly from one group (e.g., men).</li>
<li>Model learns to favor:
<ul>
<li>Certain keywords</li>
<li>Certain schools</li>
<li>Certain CV patterns</li>
</ul>
</li>
<li>It down-ranks others (e.g., women’s colleges, “women’s club”).</li>
</ul>
<p><strong>Lesson:</strong><br />
Models reflect <strong>historical bias</strong> unless we actively detect and correct it.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="39" style="--paginate:true;--header:Module: Foundations of Machine Learning;--theme:default;" data-marpit-pagination-total="72">
<header>Module: Foundations of Machine Learning</header>
<h1 id="discussion-5%E2%80%937-min">Discussion (5–7 min)</h1>
<p>In groups:</p>
<ol>
<li>Why is biased data dangerous in ML?</li>
<li>Can a technically “good” algorithm still be unfair?</li>
<li>Who should be responsible for monitoring ML systems in society?</li>
</ol>
<p>Share 1–2 key points with the class.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="40" style="--paginate:true;--header:Module: Foundations of Machine Learning;--theme:default;" data-marpit-pagination-total="72">
<header>Module: Foundations of Machine Learning</header>
<h1 id="9-historical-engines-optional-brief-story">9. Historical Engines (Optional Brief Story)</h1>
<p>Post-symbolic key developments:</p>
<ul>
<li><strong>1980s–1990s:</strong> Neural networks + <strong>Backpropagation</strong>
<ul>
<li>Enabled training of multi-layer networks</li>
</ul>
</li>
<li><strong>1990s–2000s:</strong> Statistical learning
<ul>
<li><strong>SVMs</strong>, <strong>Random Forests</strong>, <strong>Bayesian networks</strong></li>
<li>Focus on probability and optimal boundaries</li>
</ul>
</li>
<li><strong>2010s–now:</strong> Deep Learning
<ul>
<li>Big data + GPUs → hierarchical feature learning</li>
</ul>
</li>
<li><strong>2020s–now:</strong> Transformers / Generative AI
<ul>
<li>Context-aware transformations, large language models</li>
</ul>
</li>
</ul>
<p>Give students a sense of <strong>evolution</strong>, not only tools.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="41" style="--paginate:true;--header:Module: Foundations of Machine Learning;--theme:default;" data-marpit-pagination-total="72">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="44" style="--paginate:true;--header:Module: Foundations of Machine Learning;--theme:default;" data-marpit-pagination-total="72">
<header>Module: Foundations of Machine Learning</header>
<h1 id="from-rules-to-optimization">From Rules to Optimization</h1>
<ul>
<li>Core question:<br />
<strong>How do we get machines to do what we want?</strong></li>
</ul>
<p><img src="./images/picture4.png" alt="" /></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="45" style="--paginate:true;--header:Module: Foundations of Machine Learning;--theme:default;" data-marpit-pagination-total="72">
<header>Module: Foundations of Machine Learning</header>
<h1 id="from-rules-to-optimization-1">From Rules to Optimization</h1>
<ul>
<li>Core question:<br />
<strong>How do we get machines to do what we want?</strong></li>
<li>Old paradigm:<br />
Humans <strong>write explicit rules</strong> the machine follows.</li>
<li>New paradigm:<br />
Machines <strong>learn rules</strong> via <strong>mathematical optimization</strong> on data.</li>
<li>Enabler:<br />
Big Data + large‑scale compute (data centers, clusters, GPUs).</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="46" style="--paginate:true;--header:Module: Foundations of Machine Learning;--theme:default;--marpit-advanced-background-split:40%;" data-marpit-pagination-total="72" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;./images/picture24.png&quot;);background-size:100%;"></figure></div></section></foreignObject><foreignObject width="60%" height="720"><section id="46" data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="46" style="--paginate:true;--header:Module: Foundations of Machine Learning;--theme:default;--marpit-advanced-background-split:40%;" data-marpit-pagination-total="72" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<header>Module: Foundations of Machine Learning</header>
<h1 id="the-traditional-approach-explicit-programming">The Traditional Approach: Explicit Programming</h1>
<p><strong>Workflow</strong></p>
<ul>
<li>Humans design and script fixed <strong>rules</strong>.</li>
<li>Rules + input <strong>data</strong> are executed by the computer.</li>
<li>System outputs an <strong>answer</strong>.</li>
</ul>
<p><strong>Design profile</strong></p>
<blockquote>
<p>[Rules] + [Data] → <strong>Program</strong> → [Answers]</p>
</blockquote>
<p><strong>Limitation</strong></p>
<ul>
<li>
<p>Works only when humans can <strong>precisely specify</strong> the rules<br />
(e.g. sorting numbers, tax calculations, chess search).</p>
</li>
</ul>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="46" style="" data-marpit-pagination-total="72" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="47" style="--paginate:true;--header:Module: Foundations of Machine Learning;--theme:default;--marpit-advanced-background-split:35%;" data-marpit-pagination-total="72" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;./images/picture24.png&quot;);background-size:80%;"></figure></div></section></foreignObject><foreignObject width="65%" height="720"><section id="47" data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="47" style="--paginate:true;--header:Module: Foundations of Machine Learning;--theme:default;--marpit-advanced-background-split:35%;" data-marpit-pagination-total="72" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<header>Module: Foundations of Machine Learning</header>
<h1 id="the-machine-learning-approach">The Machine Learning Approach</h1>
<p><strong>Inversion of control</strong></p>
<ul>
<li>Instead of coding rules:
<ul>
<li>Provide <strong>data</strong> + <strong>target answers</strong> (labels).</li>
</ul>
</li>
<li>A learning algorithm:
<ul>
<li>Adjusts internal parameters via iterative <strong>training</strong>.</li>
</ul>
</li>
<li>Result:
<ul>
<li>Learned <strong>rules / model</strong>.</li>
</ul>
</li>
</ul>
<p><strong>Design profile</strong></p>
<blockquote>
<p>[Data] + [Answers] → <strong>ML Training</strong> → [Rules / Model]</p>
</blockquote>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="47" style="" data-marpit-pagination-total="72" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="48" style="--paginate:true;--header:Module: Foundations of Machine Learning;--theme:default;--marpit-advanced-background-split:35%;" data-marpit-pagination-total="72" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;./images/picture24.png&quot;);background-size:80%;"></figure></div></section></foreignObject><foreignObject width="65%" height="720"><section id="48" data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="48" style="--paginate:true;--header:Module: Foundations of Machine Learning;--theme:default;--marpit-advanced-background-split:35%;" data-marpit-pagination-total="72" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<header>Module: Foundations of Machine Learning</header>
<h1 id="the-dual-fuel-of-modern-ai">The Dual Fuel of Modern AI</h1>
<p>To discover useful rules <strong>without explicit programming</strong>, we need:</p>
<ul>
<li><strong>Massive datasets (Big Data)</strong>
<ul>
<li>Many diverse examples → better generalization</li>
</ul>
</li>
<li><strong>Massive processing power (Data Centers)</strong>
<ul>
<li>Billions of matrix operations</li>
<li>Highly parallel hardware (GPUs, TPUs, clusters)</li>
</ul>
</li>
</ul>
<p>Without enough <strong>data</strong> or <strong>compute</strong>, many ML methods fail in practice.</p>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="48" style="" data-marpit-pagination-total="72" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="49" style="--paginate:true;--header:Module: Foundations of Machine Learning;--theme:default;--marpit-advanced-background-split:40%;" data-marpit-pagination-total="72" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;./images/picture23.png&quot;);background-size:50%;"></figure></div></section></foreignObject><foreignObject width="60%" height="720"><section id="49" data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="49" style="--paginate:true;--header:Module: Foundations of Machine Learning;--theme:default;--marpit-advanced-background-split:40%;" data-marpit-pagination-total="72" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<header>Module: Foundations of Machine Learning</header>
<h1 id="taxonomy-of-machine-learning">Taxonomy of Machine Learning</h1>
<p>Three broad families:</p>
<ul>
<li><strong>Supervised Learning</strong>
<ul>
<li>Learn from labeled examples (input → known output).</li>
</ul>
</li>
<li><strong>Unsupervised Learning</strong>
<ul>
<li>Discover structure in unlabeled data.</li>
</ul>
</li>
<li><strong>Reinforcement Learning</strong>
<ul>
<li>Learn to act via rewards and penalties over time.</li>
</ul>
</li>
</ul>
<p>We’ll briefly illustrate each.</p>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="49" style="" data-marpit-pagination-total="72" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="50" style="--paginate:true;--header:Module: Foundations of Machine Learning;--theme:default;--marpit-advanced-background-split:40%;" data-marpit-pagination-total="72" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;./images/picture23.png&quot;);background-size:50%;"></figure></div></section></foreignObject><foreignObject width="60%" height="720"><section id="50" data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="50" style="--paginate:true;--header:Module: Foundations of Machine Learning;--theme:default;--marpit-advanced-background-split:40%;" data-marpit-pagination-total="72" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<header>Module: Foundations of Machine Learning</header>
<h1 id="supervised-learning">Supervised Learning</h1>
<p><strong>Goal</strong></p>
<ul>
<li>Learn a mapping from inputs to outputs<br />
using labeled example pairs.</li>
</ul>
<p><strong>Data</strong></p>
<ul>
<li>Requires <strong>human‑labeled</strong> or otherwise verified targets.</li>
</ul>
<p><strong>Common tasks</strong></p>
<ul>
<li><strong>Classification</strong>
<ul>
<li>Fraud detection, image labeling, medical diagnosis.</li>
</ul>
</li>
<li><strong>Regression</strong>
<ul>
<li>Predicting prices, demand, or continuous trends.</li>
</ul>
</li>
</ul>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="50" style="" data-marpit-pagination-total="72" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="51" style="--paginate:true;--header:Module: Foundations of Machine Learning;--theme:default;--marpit-advanced-background-split:40%;" data-marpit-pagination-total="72" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;./images/picture23.png&quot;);background-size:50%;"></figure></div></section></foreignObject><foreignObject width="60%" height="720"><section id="51" data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="51" style="--paginate:true;--header:Module: Foundations of Machine Learning;--theme:default;--marpit-advanced-background-split:40%;" data-marpit-pagination-total="72" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<header>Module: Foundations of Machine Learning</header>
<h1 id="unsupervised-learning">Unsupervised Learning</h1>
<p><strong>Goal</strong></p>
<ul>
<li>Find <strong>hidden structure</strong> or distributions in unlabeled data.</li>
</ul>
<p><strong>Data</strong></p>
<ul>
<li>Only raw inputs; no explicit labels.</li>
</ul>
<p><strong>Common tasks</strong></p>
<ul>
<li><strong>Clustering</strong>
<ul>
<li>Group customers by behavior patterns.</li>
</ul>
</li>
<li><strong>Dimensionality reduction</strong>
<ul>
<li>Compress high‑dimensional data into fewer, informative features.</li>
</ul>
</li>
</ul>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="51" style="" data-marpit-pagination-total="72" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="52" style="--paginate:true;--header:Module: Foundations of Machine Learning;--theme:default;--marpit-advanced-background-split:40%;" data-marpit-pagination-total="72" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;./images/picture23.png&quot;);background-size:50%;"></figure></div></section></foreignObject><foreignObject width="60%" height="720"><section id="52" data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="52" style="--paginate:true;--header:Module: Foundations of Machine Learning;--theme:default;--marpit-advanced-background-split:40%;" data-marpit-pagination-total="72" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<header>Module: Foundations of Machine Learning</header>
<h1 id="reinforcement-learning">Reinforcement Learning</h1>
<p><strong>Goal</strong></p>
<ul>
<li>Train an <strong>agent</strong> to choose actions that maximize long‑term reward.</li>
</ul>
<p><strong>Mechanism</strong></p>
<ul>
<li>Trial‑and‑error interaction with an <strong>environment</strong>.</li>
<li>Receives <strong>rewards / penalties</strong> rather than labeled examples.</li>
</ul>
<p><strong>Key ideas</strong></p>
<ul>
<li>Agent–environment loop</li>
<li>Value functions: estimated future reward</li>
</ul>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="52" style="" data-marpit-pagination-total="72" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="53" style="--paginate:true;--header:Module: Foundations of Machine Learning;--theme:default;" data-marpit-pagination-total="72">
<header>Module: Foundations of Machine Learning</header>
<h1 id="what-is-machine-learning-1">What Is Machine Learning?</h1>
<blockquote>
<p>“Machine Learning is the scientific discipline concerned with algorithms that can <strong>learn from data</strong>.”</p>
</blockquote>
<p>Two phases:</p>
<ol>
<li><strong>Model building (training)</strong>
<ul>
<li>Use historical data to fit an empirical model.</li>
</ul>
</li>
<li><strong>Inference (deployment)</strong>
<ul>
<li>Use the model to make predictions on <strong>new</strong> data<br />
instead of following fixed, hand‑coded logic.</li>
</ul>
</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="54" style="--paginate:true;--header:Module: Foundations of Machine Learning;--theme:default;" data-marpit-pagination-total="72">

<ul>

</ul>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="56" style="--paginate:true;--header:Module: Foundations of Machine Learning;--theme:default;--marpit-advanced-background-split:40%;" data-marpit-pagination-total="72" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;./images/picture6.png&quot;);background-size:80%;"></figure></div></section></foreignObject><foreignObject width="60%" height="720"><section id="56" data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="56" style="--paginate:true;--header:Module: Foundations of Machine Learning;--theme:default;--marpit-advanced-background-split:40%;" data-marpit-pagination-total="72" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<header>Module: Foundations of Machine Learning</header>
<h1 id="the-reality-of-data">The Reality of Data</h1>
<p>Raw data is <strong>not</strong> ready for ML:</p>
<ul>
<li><strong>Heterogeneous formats</strong>
<ul>
<li>Images, audio, text, logs, tables</li>
</ul>
</li>
<li><strong>Missing values</strong>
<ul>
<li>Gaps in records, broken rows</li>
</ul>
</li>
<li><strong>Noise</strong>
<ul>
<li>Sensor errors, outliers, typos</li>
</ul>
</li>
<li><strong>Feature transformation</strong>
<ul>
<li>Encoding categories, scaling, normalizing, engineering features</li>
</ul>
</li>
</ul>
<p>Much of ML practice = <strong>data cleaning and preparation</strong>.</p>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="56" style="" data-marpit-pagination-total="72" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="57" style="--paginate:true;--header:Module: Foundations of Machine Learning;--theme:default;--marpit-advanced-background-split:40%;" data-marpit-pagination-total="72" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;./images/picture27.png&quot;);background-size:100%;"></figure></div></section></foreignObject><foreignObject width="60%" height="720"><section id="57" data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="57" style="--paginate:true;--header:Module: Foundations of Machine Learning;--theme:default;--marpit-advanced-background-split:40%;" data-marpit-pagination-total="72" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<header>Module: Foundations of Machine Learning</header>
<h1 id="the-end%E2%80%91to%E2%80%91end-ml-workflow">The End‑to‑End ML Workflow</h1>
<p>High‑level pipeline:</p>
<ol>
<li><strong>Input training data</strong></li>
<li><strong>Feature extraction / preprocessing</strong></li>
<li><strong>Train / fit model</strong></li>
<li><strong>Create trained model</strong></li>
</ol>
<p>Then:</p>
<ol>
<li><strong>Input test (or new) data</strong></li>
<li>Same <strong>feature extraction</strong></li>
<li><strong>Evaluate / score</strong> with the model</li>
</ol>
<blockquote>
<p>Goal: good performance on <strong>unseen</strong> data, not only training data.</p>
</blockquote>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="57" style="" data-marpit-pagination-total="72" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="58" style="--paginate:true;--header:Module: Foundations of Machine Learning;--theme:default;--marpit-advanced-background-split:40%;" data-marpit-pagination-total="72" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;./images/Picture25.png&quot;);background-size:90%;"></figure></div></section></foreignObject><foreignObject width="60%" height="720"><section id="58" data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="58" style="--paginate:true;--header:Module: Foundations of Machine Learning;--theme:default;--marpit-advanced-background-split:40%;" data-marpit-pagination-total="72" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<header>Module: Foundations of Machine Learning</header>
<h1 id="generalization-underfitting-vs-overfitting">Generalization: Underfitting vs Overfitting</h1>
<p><strong>Underfitting (High Bias)</strong></p>
<ul>
<li>Model too simple → misses important patterns.</li>
<li>Example: straight line fitted to a highly curved relationship.</li>
</ul>
<p><strong>Overfitting (High Variance)</strong></p>
<ul>
<li>Model too complex → memorizes noise and outliers.</li>
<li>Example: high‑degree polynomial that hits every training point but fails on new data.</li>
</ul>
<p>Good models strike a <strong>balance</strong>.</p>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="58" style="" data-marpit-pagination-total="72" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="59" style="--paginate:true;--header:Module: Foundations of Machine Learning;--theme:default;--marpit-advanced-background-split:40%;" data-marpit-pagination-total="72" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;./images/Picture29.png&quot;);background-size:100%;"></figure></div></section></foreignObject><foreignObject width="60%" height="720"><section id="59" data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="59" style="--paginate:true;--header:Module: Foundations of Machine Learning;--theme:default;--marpit-advanced-background-split:40%;" data-marpit-pagination-total="72" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<header>Module: Foundations of Machine Learning</header>
<h1 id="validation-strategies">Validation Strategies</h1>
<p>To measure generalization properly:</p>
<ul>
<li><strong>Train / Test split</strong>
<ul>
<li>Simple: e.g. 75% train, 25% test.</li>
</ul>
</li>
<li><strong>Train / Validation / Test</strong>
<ul>
<li>Train: fit parameters</li>
<li>Validation: tune hyperparameters</li>
<li>Test: final unbiased evaluation</li>
</ul>
</li>
<li><strong>Cross‑validation (e.g. K‑fold)</strong>
<ul>
<li>Rotate which subset acts as validation.</li>
</ul>
</li>
<li>Variants:
<ul>
<li>Stratified CV, nested CV, time‑series splits.</li>
</ul>
</li>
</ul>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="59" style="" data-marpit-pagination-total="72" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="60" data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="60" style="--paginate:true;--header:Module: Foundations of Machine Learning;--theme:default;" data-marpit-pagination-total="72">
<header>Module: Foundations of Machine Learning</header>
<h1 id="algorithm-choice-and-complexity-overview">Algorithm Choice and Complexity (Overview)</h1>
<p>Different models have different costs:</p>
<ul>
<li><strong>Linear models</strong>
<ul>
<li>Fast to train and predict; low memory footprint.</li>
</ul>
</li>
<li><strong>Instance‑based methods (e.g. KNN)</strong>
<ul>
<li>Almost no training cost; slow prediction; high memory.</li>
</ul>
</li>
<li><strong>Tree‑based models (e.g. decision trees)</strong>
<ul>
<li>Training cost grows with number of samples and features.</li>
<li>Prediction cost grows with tree depth.</li>
</ul>
</li>
</ul>
<p>Choosing an algorithm means balancing:</p>
<ul>
<li>Data size and dimensionality</li>
<li>Memory and latency constraints</li>
<li>Required accuracy and interpretability</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="61" data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="61" style="--paginate:true;--header:Module: Foundations of Machine Learning;--theme:default;" data-marpit-pagination-total="72">
<header>Module: Foundations of Machine Learning</header>
<h1 id="beyond-superficial-ai-skills">Beyond Superficial AI Skills</h1>
<p><strong>Superficial use</strong></p>
<ul>
<li>Treats AI as a black box.</li>
<li>Knows how to call <code>.fit()</code> and <code>.predict()</code> on standard libraries.</li>
</ul>
<p><strong>Engineering reality</strong></p>
<ul>
<li>When models fail in production, we must:
<ul>
<li>Diagnose data issues and pipeline bugs.</li>
<li>Understand model behavior (e.g., bias/variance tradeoff, feature effects).</li>
</ul>
</li>
<li>For advanced systems (deep learning, Transformers), this includes:
<ul>
<li>Backprop dynamics, vanishing/exploding gradients</li>
<li>Embeddings, attention, and model architecture choices.</li>
</ul>
</li>
</ul>
<p>Deep understanding turns AI from a <strong>gadget</strong> into a <strong>reliable tool</strong>.</p>
</section>

<ul>
<li>Data grows from <strong>kilobytes</strong> to <strong>yottabytes</strong></li>

</ul>
