</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="64" style="" data-marpit-pagination-total="72" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="65" style="--paginate:true;--header:Module: Foundations of Machine Learning;--theme:default;--marpit-advanced-background-split:40%;" data-marpit-pagination-total="72" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;./images/Picture8.png&quot;);background-size:50%;"></figure></div></section></foreignObject><foreignObject width="60%" height="720"><section id="65" data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="65" style="--paginate:true;--header:Module: Foundations of Machine Learning;--theme:default;--marpit-advanced-background-split:40%;" data-marpit-pagination-total="72" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<header>Module: Foundations of Machine Learning</header>
<h1 id="what-does-1-tb-look-like">What Does 1 TB Look Like?</h1>
<p>Approximate capacity of a <strong>1 TB drive</strong>:</p>
<ul>
<li>≈ <strong>200,000</strong> high‑quality audio files
<ul>
<li>~17,000 hours of music</li>
</ul>
</li>
<li>≈ <strong>256</strong> standard‑definition 2‑hour movies
<ul>
<li>~500 hours of video</li>
</ul>
</li>
<li>≈ <strong>310,000</strong> standard‑resolution photos</li>
</ul>
<p>Even a <strong>single TB</strong> is a lot of real‑world content.</p>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="65" style="" data-marpit-pagination-total="72" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="66" data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="66" style="--paginate:true;--header:Module: Foundations of Machine Learning;--theme:default;" data-marpit-pagination-total="72">
<header>Module: Foundations of Machine Learning</header>
<h1 id="global-data-ingestion-examples">Global Data Ingestion (Examples)</h1>
<p>Why scalable infrastructure matters:</p>
<ul>
<li><strong>Google</strong>:
<ul>
<li>
<blockquote>
<p>20 <strong>Petabytes/day</strong> processed in distributed systems</p>
</blockquote>
</li>
</ul>
</li>
<li><strong>Facebook</strong> (Meta):
<ul>
<li>
<blockquote>
<p>2.5 <strong>PB/day</strong> of user activity in data lakes</p>
</blockquote>
</li>
</ul>
</li>
<li><strong>CERN – Large Hadron Collider</strong>:
<ul>
<li>~15 <strong>PB/year</strong> of raw detector data</li>
</ul>
</li>
</ul>
<p>Modern AI is tied to this scale of data flow.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="67" data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="67" style="--paginate:true;--header:Module: Foundations of Machine Learning;--theme:default;" data-marpit-pagination-total="72">
<header>Module: Foundations of Machine Learning</header>
<h1 id="the-sneakernet-bandwidth-paradox">The “Sneakernet” Bandwidth Paradox</h1>
<p>Moving huge datasets over networks is hard:</p>
<ul>
<li>Transferring <strong>hundreds of TB</strong> over typical links hits hard bandwidth limits</li>
<li>2013 perspective:
<ul>
<li>Shipping physical <strong>hard drives by plane</strong> could be <strong>faster</strong> than the internet</li>
</ul>
</li>
</ul>
<p>Example:</p>
<ul>
<li>A 1 TB SSD ≈ 78 g</li>
<li>A plane full of drives → effective rate ≈ <strong>150 EB/day</strong>
<ul>
<li>≈ <strong>14 Pb/s</strong>, about <strong>100×</strong> average internet throughput (2013)</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="68" data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="68" style="--paginate:true;--header:Module: Foundations of Machine Learning;--theme:default;" data-marpit-pagination-total="72">
<header>Module: Foundations of Machine Learning</header>
<h1 id="network-transfer-latency-%E2%80%93-thought-experiments">Network Transfer Latency – Thought Experiments</h1>
<p><strong>Case 1: 18 TB (≈ 60 human genomes)</strong></p>
<ul>
<li>Over a <strong>1 Gbps</strong> line:
<ul>
<li>Transfer takes <strong>days</strong>, even with perfect utilization</li>
</ul>
</li>
</ul>
<p><strong>Case 2: 1 Exabyte (EB = <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.05ex;" xmlns="http://www.w3.org/2000/svg" width="3.25ex" height="2.005ex" role="img" focusable="false" viewBox="0 -864 1436.6 886"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msup"><g data-mml-node="mn"><path data-c="31" d="M213 578L200 573Q186 568 160 563T102 556H83V602H102Q149 604 189 617T245 641T273 663Q275 666 285 666Q294 666 302 660V361L303 61Q310 54 315 52T339 48T401 46H427V0H416Q395 3 257 3Q121 3 100 0H88V46H114Q136 46 152 46T177 47T193 50T201 52T207 57T213 61V578Z"></path><path data-c="30" d="M96 585Q152 666 249 666Q297 666 345 640T423 548Q460 465 460 320Q460 165 417 83Q397 41 362 16T301 -15T250 -22Q224 -22 198 -16T137 16T82 83Q39 165 39 320Q39 494 96 585ZM321 597Q291 629 250 629Q208 629 178 597Q153 571 145 525T137 333Q137 175 145 125T181 46Q209 16 250 16Q290 16 318 46Q347 76 354 130T362 333Q362 478 354 524T321 597Z" transform="translate(500,0)"></path></g><g data-mml-node="mn" transform="translate(1033,393.1) scale(0.707)"><path data-c="36" d="M42 313Q42 476 123 571T303 666Q372 666 402 630T432 550Q432 525 418 510T379 495Q356 495 341 509T326 548Q326 592 373 601Q351 623 311 626Q240 626 194 566Q147 500 147 364L148 360Q153 366 156 373Q197 433 263 433H267Q313 433 348 414Q372 400 396 374T435 317Q456 268 456 210V192Q456 169 451 149Q440 90 387 34T253 -22Q225 -22 199 -14T143 16T92 75T56 172T42 313ZM257 397Q227 397 205 380T171 335T154 278T148 216Q148 133 160 97T198 39Q222 21 251 21Q302 21 329 59Q342 77 347 104T352 209Q352 289 347 316T329 361Q302 397 257 397Z"></path></g></g></g></g></svg></mjx-container> TB)</strong></p>
<ul>
<li>Over a dedicated <strong>10 Gbps</strong> link:
<ul>
<li>≈ <strong>26 years</strong> of continuous upload</li>
</ul>
</li>
</ul>
<p><strong>Reality:</strong><br />
Cloud providers use <strong>physical transfer</strong> tools (e.g. AWS Snowmobile trucks) to move EB‑scale data in <strong>weeks</strong>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="69" data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="69" style="--paginate:true;--header:Module: Foundations of Machine Learning;--theme:default;" data-marpit-pagination-total="72">
<header>Module: Foundations of Machine Learning</header>
<h1 id="processing-latency-the-terabyte-sort">Processing Latency: The Terabyte Sort</h1>
<p>How long to sort <strong>1 TB</strong> of data?</p>
<ul>
<li>
<p><strong>Single machine</strong></p>
<ul>
<li>Disk read/write ≈ 100 MB/s</li>
<li>Idealized processing: ≈ <strong>341 minutes</strong> (~5.6 hours)</li>
</ul>
</li>
<li>
<p><strong>Large distributed cluster</strong></p>
<ul>
<li>2008 benchmark (MapReduce on 910 nodes):</li>
<li>1 TB sort in <strong>68 seconds</strong></li>
</ul>
</li>
</ul>
<p>Parallelism can turn <strong>hours into seconds</strong>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="70" data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="70" style="--paginate:true;--header:Module: Foundations of Machine Learning;--theme:default;" data-marpit-pagination-total="72">
<header>Module: Foundations of Machine Learning</header>
<h1 id="does-adding-cpus-always-help">Does Adding CPUs Always Help?</h1>
<p>Computational scaling behaviors:</p>
<ul>
<li><strong>Linear scaling</strong>
<ul>
<li>2× cores → ~2× speedup</li>
</ul>
</li>
<li><strong>Super‑linear scaling</strong>
<ul>
<li>Better than linear (e.g. data now fits in caches across nodes)</li>
</ul>
</li>
<li><strong>Sub‑linear scaling (Amdahl’s Law)</strong>
<ul>
<li>Diminishing returns:
<ul>
<li>Sequential parts of the code</li>
<li>Network communication overhead</li>
<li>Synchronization costs</li>
</ul>
</li>
</ul>
</li>
</ul>
<p>More hardware ≠ unlimited speedup.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="71" data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="71" style="--paginate:true;--header:Module: Foundations of Machine Learning;--theme:default;" data-marpit-pagination-total="72">
<header>Module: Foundations of Machine Learning</header>
<h1 id="hardware-acceleration-gpus--tpus">Hardware Acceleration: GPUs &amp; TPUs</h1>
<p><strong>CPUs</strong></p>
<ul>
<li>Optimized for <strong>sequential</strong>, diverse tasks</li>
<li>Great for control logic, but slow for massive matrix math</li>
</ul>
<p><strong>GPUs / TPUs</strong></p>
<ul>
<li>Thousands of simple arithmetic units</li>
<li>Designed for <strong>parallel</strong> operations:
<ul>
<li>Millions of multiply‑adds in parallel</li>
</ul>
</li>
<li>Essential for:
<ul>
<li>Deep learning training</li>
<li>Large‑scale simulations</li>
</ul>
</li>
</ul>
<p>Example:</p>
<ul>
<li>Complex biomedical simulations that take hours on a CPU<br />
can be sped up dramatically using OpenCL/CUDA on GPUs.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="72" data-paginate="true" data-header="Module: Foundations of Machine Learning" data-theme="default" lang="en-US" data-marpit-pagination="72" style="--paginate:true;--header:Module: Foundations of Machine Learning;--theme:default;" data-marpit-pagination-total="72">
