<header>Navigating GenAI in Higher Education</header>
<h1 id="1-why-genai-forces-us-to-rethink-education--assessment">1. Why GenAI forces us to rethink education &amp; assessment</h1>
<footer>The UvA Experience (2023–2026 and Beyond)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-header="Navigating GenAI in Higher Education" data-footer="The UvA Experience (2023–2026 and Beyond)" data-theme="default" lang="C" data-marpit-pagination="5" style="--paginate:true;--header:Navigating GenAI in Higher Education;--footer:The UvA Experience (2023–2026 and Beyond);--theme:default;" data-marpit-pagination-total="81">
<header>Navigating GenAI in Higher Education</header>
<h1 id="assessment-in-the-ai-era">Assessment in the AI era</h1>
<ul>
<li>
<p><strong>GenAI tools</strong> can:</p>
<ul>
<li><code>Draft</code> essays and reports</li>
<li><code>Solve</code> exercises and programming tasks</li>
<li><code>Summarise</code> readings and generate (sometimes fabricated) references</li>
</ul>
</li>
<li>
<p><strong>Assessment &amp; integrity</strong></p>
<ul>
<li>Homework and essays: now solvable or heavily supported by GenAI.</li>
<li><strong>Risk</strong>: certifying students whose learning outcomes we cannot confidently verify.</li>
</ul>
</li>
</ul>
<footer>The UvA Experience (2023–2026 and Beyond)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-header="Navigating GenAI in Higher Education" data-footer="The UvA Experience (2023–2026 and Beyond)" data-theme="default" lang="C" data-marpit-pagination="6" style="--paginate:true;--header:Navigating GenAI in Higher Education;--footer:The UvA Experience (2023–2026 and Beyond);--theme:default;" data-marpit-pagination-total="81">
<header>Navigating GenAI in Higher Education</header>
<h1 id="assessment-in-the-ai-era-1">Assessment in the AI era</h1>
<h2 id="are-we-assessing-students-or-their-tools">Are we assessing students or their tools?</h2>
<ul>
<li>
<p>High‑risk assessment formats:</p>
<ul>
<li>Essays and take‑home assignments</li>
<li>Unsupervised homework</li>
<li>Online exams</li>
</ul>
</li>
<li>
<p>Challenges:</p>
<ul>
<li>Proving GenAI‑assisted fraud is difficult.</li>
<li>Detection tools are unreliable and may be unfair.</li>
</ul>
</li>
</ul>
<footer>The UvA Experience (2023–2026 and Beyond)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-header="Navigating GenAI in Higher Education" data-footer="The UvA Experience (2023–2026 and Beyond)" data-theme="default" lang="C" data-marpit-pagination="7" style="--paginate:true;--header:Navigating GenAI in Higher Education;--footer:The UvA Experience (2023–2026 and Beyond);--theme:default;" data-marpit-pagination-total="81">
<header>Navigating GenAI in Higher Education</header>
<h1 id="genai-as-a-systemic-challenge">GenAI as a systemic challenge</h1>
<ul>
<li>
<p>GenAI challenges core <strong>assumptions</strong>:</p>
<ul>
<li>Are we still teaching the <strong>right content and skills</strong>?</li>
<li>Are we assessing <strong>students or their AI tools</strong>?</li>
<li>Do we need <strong>small adjustments</strong> or <strong>radical redesign</strong> of learning objectives?</li>
</ul>
</li>
<li>
<p><strong>Governance &amp; workload</strong></p>
<ul>
<li>Exam committees face a growing “grey area” around AI‑related fraud.</li>
<li>Workload and juridification of assessment decisions are increasing.</li>
</ul>
</li>
</ul>
<footer>The UvA Experience (2023–2026 and Beyond)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-header="Navigating GenAI in Higher Education" data-footer="The UvA Experience (2023–2026 and Beyond)" data-theme="default" lang="C" data-marpit-pagination="8" style="--paginate:true;--header:Navigating GenAI in Higher Education;--footer:The UvA Experience (2023–2026 and Beyond);--theme:default;" data-marpit-pagination-total="81">
<header>Navigating GenAI in Higher Education</header>
<h1 id="2-whats-at-stake">2. What’s at stake?</h1>
<footer>The UvA Experience (2023–2026 and Beyond)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-header="Navigating GenAI in Higher Education" data-footer="The UvA Experience (2023–2026 and Beyond)" data-theme="default" lang="C" data-marpit-pagination="9" style="--paginate:true;--header:Navigating GenAI in Higher Education;--footer:The UvA Experience (2023–2026 and Beyond);--theme:default;" data-marpit-pagination-total="81">
<header>Navigating GenAI in Higher Education</header>
<h1 id="are-we-assessing-the-right-skills">Are we assessing the right skills?</h1>
<ul>
<li>
<p>GenAI changes:</p>
<ul>
<li>What we consider <strong>baseline skills</strong> (e.g. routine writing vs critical review of AI‑generated text).</li>
<li>How disciplines like Software Engineering, Security &amp; Network Engineering, Mathematics, and Computer Science fields operate.</li>
</ul>
</li>
<li>
<p><strong>Content &amp; curriculum</strong></p>
<ul>
<li>Many professions are becoming “AI‑first”: graduates must be able to <strong>work with GenAI</strong> responsibly.</li>
<li>New competencies: AI literacy, critical evaluation of AI output, ethical and legal awareness.</li>
</ul>
</li>
</ul>
<footer>The UvA Experience (2023–2026 and Beyond)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-header="Navigating GenAI in Higher Education" data-footer="The UvA Experience (2023–2026 and Beyond)" data-theme="default" lang="C" data-marpit-pagination="10" style="--paginate:true;--header:Navigating GenAI in Higher Education;--footer:The UvA Experience (2023–2026 and Beyond);--theme:default;" data-marpit-pagination-total="81">
<header>Navigating GenAI in Higher Education</header>
<h1 id="are-we-assessing-the-right-skills-continue">Are we assessing the right skills? (continue)</h1>
<ul>
<li>
<p>When we grade a thesis or project, are we grading:</p>
<ul>
<li>The student’s knowledge and skills, or</li>
<li>The output of AI tools used behind the scenes?</li>
</ul>
</li>
<li>
<p>Decisions needed at programme and exam‑committee level:</p>
<ul>
<li><strong>Which</strong> learning objectives must be achieved <strong>without GenAI</strong> (core foundations).</li>
<li><strong>Where</strong> GenAI use is <strong>allowed</strong>, and how it should be documented and assessed.</li>
</ul>
</li>
<li>
<p>Assessment must be redesigned so that <strong>key competences are verifiably demonstrated by the student</strong>.</p>
</li>
</ul>
<footer>The UvA Experience (2023–2026 and Beyond)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-header="Navigating GenAI in Higher Education" data-footer="The UvA Experience (2023–2026 and Beyond)" data-theme="default" lang="C" data-marpit-pagination="11" style="--paginate:true;--header:Navigating GenAI in Higher Education;--footer:The UvA Experience (2023–2026 and Beyond);--theme:default;" data-marpit-pagination-total="81">
<header>Navigating GenAI in Higher Education</header>
<h1 id="constructive-alignment-under-genai">Constructive alignment under GenAI</h1>
<footer>The UvA Experience (2023–2026 and Beyond)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-header="Navigating GenAI in Higher Education" data-footer="The UvA Experience (2023–2026 and Beyond)" data-theme="default" lang="C" data-marpit-pagination="12" style="--paginate:true;--header:Navigating GenAI in Higher Education;--footer:The UvA Experience (2023–2026 and Beyond);--theme:default;" data-marpit-pagination-total="81">
<header>Navigating GenAI in Higher Education</header>
<h2 id="constructive-alignment-basic-idea">Constructive alignment: basic idea</h2>
<p>Exit qualifications → learning objectives → learning activities → assessment formats</p>
<p>Under GenAI, programmes should:</p>
<ul>
<li>Make explicit decisions about where GenAI:
<ul>
<li>Can be used as a <strong>tool</strong> in learning and assessment.</li>
<li><strong>Must not</strong> be used in demonstrating competence.</li>
</ul>
</li>
</ul>
<footer>The UvA Experience (2023–2026 and Beyond)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-header="Navigating GenAI in Higher Education" data-footer="The UvA Experience (2023–2026 and Beyond)" data-theme="default" lang="C" data-marpit-pagination="13" style="--paginate:true;--header:Navigating GenAI in Higher Education;--footer:The UvA Experience (2023–2026 and Beyond);--theme:default;" data-marpit-pagination-total="81">
<header>Navigating GenAI in Higher Education</header>
<h2 id="constructive-alignment-under-genai-continue">Constructive alignment under GenAI (continue)</h2>
<p>Exit qualifications → learning objectives → learning activities → assessment formats</p>
<p>Under GenAI, programmes should:</p>
<ul>
<li>
<p>Adapt:</p>
<ul>
<li>Learning activities (e.g. more in‑class practice vs unsupervised homework).</li>
<li>Assessment formats (e.g. oral exams, supervised tasks, process‑oriented assignments).</li>
</ul>
</li>
<li>
<p>Ensure that assessment and AI rules are part of <strong>programme‑level design</strong>, not just course‑level “fine print”.</p>
</li>
</ul>
<footer>The UvA Experience (2023–2026 and Beyond)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-header="Navigating GenAI in Higher Education" data-footer="The UvA Experience (2023–2026 and Beyond)" data-theme="default" lang="C" data-marpit-pagination="14" style="--paginate:true;--header:Navigating GenAI in Higher Education;--footer:The UvA Experience (2023–2026 and Beyond);--theme:default;" data-marpit-pagination-total="81">
<header>Navigating GenAI in Higher Education</header>
<h1 id="3-uvas-policy-evolution-2022%E2%80%932026">3. UvA’s policy evolution (2022–2026)</h1>
<footer>The UvA Experience (2023–2026 and Beyond)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-header="Navigating GenAI in Higher Education" data-footer="The UvA Experience (2023–2026 and Beyond)" data-theme="default" lang="C" data-marpit-pagination="15" style="--paginate:true;--header:Navigating GenAI in Higher Education;--footer:The UvA Experience (2023–2026 and Beyond);--theme:default;" data-marpit-pagination-total="81">
<header>Navigating GenAI in Higher Education</header>
<h1 id="baseline-assessment-policy-framework-2022">Baseline: Assessment Policy Framework (2022)</h1>
<ul>
<li>
<p>Provides UvA‑wide principles for:</p>
<ul>
<li>Valid and reliable assessment</li>
<li>Programme‑level assessment planning</li>
<li>Constructive alignment</li>
</ul>
</li>
<li>
<p>Becomes the <strong>baseline</strong> when GenAI appears:</p>
<ul>
<li>GenAI raises new issues around independent work, fraud, and evidence of learning.</li>
</ul>
</li>
</ul>
<footer>The UvA Experience (2023–2026 and Beyond)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-header="Navigating GenAI in Higher Education" data-footer="The UvA Experience (2023–2026 and Beyond)" data-theme="default" lang="C" data-marpit-pagination="16" style="--paginate:true;--header:Navigating GenAI in Higher Education;--footer:The UvA Experience (2023–2026 and Beyond);--theme:default;" data-marpit-pagination-total="81">
<header>Navigating GenAI in Higher Education</header>
<h1 id="early-response-ai-in-education-memo-2023">Early response: AI in Education memo (2023)</h1>
<ul>
<li>First UvA‑wide memo on AI in education (June 2023).</li>
<li>Recognises <strong>AI as integral</strong> to society and university teaching.</li>
<li>Acts as a <strong>starting point</strong> but is later revised as GenAI tools (and risks) evolve.</li>
</ul>
<footer>The UvA Experience (2023–2026 and Beyond)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-header="Navigating GenAI in Higher Education" data-footer="The UvA Experience (2023–2026 and Beyond)" data-theme="default" lang="C" data-marpit-pagination="17" style="--paginate:true;--header:Navigating GenAI in Higher Education;--footer:The UvA Experience (2023–2026 and Beyond);--theme:default;" data-marpit-pagination-total="81">
<header>Navigating GenAI in Higher Education</header>
<h1 id="consolidation-navigating-the-ocean-of-ai-project-2025">Consolidation: “Navigating the Ocean of AI” project (2025)</h1>
<ul>
<li>UvA launches a central project on AI and GenAI in 2025:
<ul>
<li>Revises the 2023 memo into a <strong>GenAI education policy framework</strong>.</li>
<li>Develops a <strong>secure institutional GenAI tool (UvA AI Chat)</strong>.</li>
<li>Designs <strong>AI literacy programmes</strong> for students and staff.</li>
<li>Initiates <strong>pilots</strong> across faculties on AI‑supported teaching and assessment.</li>
</ul>
</li>
</ul>
<footer>The UvA Experience (2023–2026 and Beyond)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-header="Navigating GenAI in Higher Education" data-footer="The UvA Experience (2023–2026 and Beyond)" data-theme="default" lang="C" data-marpit-pagination="18" style="--paginate:true;--header:Navigating GenAI in Higher Education;--footer:The UvA Experience (2023–2026 and Beyond);--theme:default;--marpit-advanced-background-split:30%;" data-marpit-pagination-total="81" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;./images/UVA-GenAI-policy.png&quot;);background-size:100%;"></figure></div></section></foreignObject><foreignObject width="70%" height="720"><section id="18" data-paginate="true" data-header="Navigating GenAI in Higher Education" data-footer="The UvA Experience (2023–2026 and Beyond)" data-theme="default" lang="C" data-marpit-pagination="18" style="--paginate:true;--header:Navigating GenAI in Higher Education;--footer:The UvA Experience (2023–2026 and Beyond);--theme:default;--marpit-advanced-background-split:30%;" data-marpit-pagination-total="81" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<header>Navigating GenAI in Higher Education</header>
<h1 id="central-framework-genai-in-education">Central framework: GenAI in education</h1>
<ul>
<li>
<p>UvA’s overall view on opportunities and risks of GenAI.</p>
</li>
<li>
<p>General guidelines for responsible use in teaching and assessment.</p>
</li>
<li>
<p>Specific guidance on:</p>
<ul>
<li>AI literacy</li>
<li>Assessment formats</li>
<li>Curriculum design (GenAI as exit qualification / subject / didactic tool)</li>
</ul>
</li>
<li>
<p>Roles and responsibilities:</p>
<ul>
<li>Executive Board, deans, programme directors, exam committees, lecturers, students.</li>
</ul>
</li>
<li>
<p><a href="https://www.uva.nl/over-de-uva/beleid-en-regelingen/onderwijs/beleidskader-en-richtlijnen-genai-in-het-onderwijs.html">GenAI policy framework (central)</a></p>
</li>
</ul>
<footer>The UvA Experience (2023–2026 and Beyond)</footer>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-header="Navigating GenAI in Higher Education" data-footer="The UvA Experience (2023–2026 and Beyond)" data-theme="default" lang="C" data-marpit-pagination="18" style="" data-marpit-pagination-total="81" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-header="Navigating GenAI in Higher Education" data-footer="The UvA Experience (2023–2026 and Beyond)" data-theme="default" lang="C" data-marpit-pagination="19" style="--paginate:true;--header:Navigating GenAI in Higher Education;--footer:The UvA Experience (2023–2026 and Beyond);--theme:default;--marpit-advanced-background-split:30%;" data-marpit-pagination-total="81" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;./images/UVA-GenAI-policy.png&quot;);background-size:100%;"></figure></div></section></foreignObject><foreignObject width="70%" height="720"><section id="19" data-paginate="true" data-header="Navigating GenAI in Higher Education" data-footer="The UvA Experience (2023–2026 and Beyond)" data-theme="default" lang="C" data-marpit-pagination="19" style="--paginate:true;--header:Navigating GenAI in Higher Education;--footer:The UvA Experience (2023–2026 and Beyond);--theme:default;--marpit-advanced-background-split:30%;" data-marpit-pagination-total="81" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<header>Navigating GenAI in Higher Education</header>
<h1 id="assessment-addendum-genai-in-assessment">Assessment addendum: GenAI in assessment</h1>
<ul>
<li>Focuses specifically on <strong>GenAI in assessment</strong>.</li>
<li>Transitional document bridging existing assessment policy and future educational vision.</li>
<li>Encourages programmes to:
<ul>
<li>Decide which learning outcomes can involve GenAI and which cannot.</li>
<li>Review whole assessment programmes for GenAI‑related risks.</li>
</ul>
</li>
<li>Highlights:
<ul>
<li>Limitations of AI detection tools.</li>
<li>Importance of <strong>format redesign</strong> and <strong>oral validation</strong> when fraud is suspected.</li>
</ul>
</li>
</ul>
<footer>The UvA Experience (2023–2026 and Beyond)</footer>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-header="Navigating GenAI in Higher Education" data-footer="The UvA Experience (2023–2026 and Beyond)" data-theme="default" lang="C" data-marpit-pagination="19" style="" data-marpit-pagination-total="81" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-header="Navigating GenAI in Higher Education" data-footer="The UvA Experience (2023–2026 and Beyond)" data-theme="default" lang="C" data-marpit-pagination="20" style="--paginate:true;--header:Navigating GenAI in Higher Education;--footer:The UvA Experience (2023–2026 and Beyond);--theme:default;" data-marpit-pagination-total="81">
<header>Navigating GenAI in Higher Education</header>
<h1 id="4-uvas-central-view-on-genai-in-education">4. UvA’s central view on GenAI in education</h1>
<footer>The UvA Experience (2023–2026 and Beyond)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-header="Navigating GenAI in Higher Education" data-footer="The UvA Experience (2023–2026 and Beyond)" data-theme="default" lang="C" data-marpit-pagination="21" style="--paginate:true;--header:Navigating GenAI in Higher Education;--footer:The UvA Experience (2023–2026 and Beyond);--theme:default;" data-marpit-pagination-total="81">
<header>Navigating GenAI in Higher Education</header>
<h1 id="genai-embraced-but-bounded">GenAI: embraced but bounded</h1>
<ul>
<li>
<p>GenAI is seen as:</p>
<ul>
<li>A powerful tool to <strong>support learning and teaching</strong> (practice questions, feedback, content generation).</li>
<li>A source of new possibilities (personalised learning, simulations).</li>
</ul>
</li>
<li>
<p>But not as a new educational “principle”:</p>
<ul>
<li>Educational goals and didactics must lead; GenAI is an instrument, not the driver.</li>
</ul>
</li>
</ul>
<footer>The UvA Experience (2023–2026 and Beyond)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-header="Navigating GenAI in Higher Education" data-footer="The UvA Experience (2023–2026 and Beyond)" data-theme="default" lang="C" data-marpit-pagination="22" style="--paginate:true;--header:Navigating GenAI in Higher Education;--footer:The UvA Experience (2023–2026 and Beyond);--theme:default;" data-marpit-pagination-total="81">
<header>Navigating GenAI in Higher Education</header>
<h1 id="core-principles-1">Core principles (1)</h1>
<ul>
<li>
<p><strong>Human in the lead</strong></p>
<ul>
<li>Students and staff remain fully responsible for work they submit.</li>
<li>Assessment must be performed by appointed examiners; grading cannot be outsourced to GenAI.</li>
</ul>
</li>
<li>
<p><strong>Transparency</strong></p>
<ul>
<li>Students must be explicit about if and how they used GenAI.</li>
<li>Lecturers must clearly define allowed uses and how to document them.</li>
</ul>
</li>
</ul>
<footer>The UvA Experience (2023–2026 and Beyond)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-header="Navigating GenAI in Higher Education" data-footer="The UvA Experience (2023–2026 and Beyond)" data-theme="default" lang="C" data-marpit-pagination="23" style="--paginate:true;--header:Navigating GenAI in Higher Education;--footer:The UvA Experience (2023–2026 and Beyond);--theme:default;" data-marpit-pagination-total="81">
<header>Navigating GenAI in Higher Education</header>
<h1 id="core-principles-2">Core principles (2)</h1>
<ul>
<li>
<p><strong>Critical stance towards AI output</strong></p>
<ul>
<li>GenAI is not a reliable scientific source: hallucinations, fabricated references, biased output.</li>
<li>AI literacy includes recognising limitations and checking AI‑generated material.</li>
</ul>
</li>
<li>
<p><strong>Licensed, non‑compulsory use</strong></p>
<ul>
<li>Only UvA‑approved tools may be used in teaching and assessment.</li>
<li>Students cannot be forced to create accounts on external AI services.</li>
<li>UvA AI Chat is developed as a managed, education‑oriented GenAI environment.</li>
</ul>
</li>
</ul>
<footer>The UvA Experience (2023–2026 and Beyond)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-header="Navigating GenAI in Higher Education" data-footer="The UvA Experience (2023–2026 and Beyond)" data-theme="default" lang="C" data-marpit-pagination="24" style="--paginate:true;--header:Navigating GenAI in Higher Education;--footer:The UvA Experience (2023–2026 and Beyond);--theme:default;" data-marpit-pagination-total="81">
<header>Navigating GenAI in Higher Education</header>
<h1 id="core-principles-3">Core principles (3)</h1>
<ul>
<li>
<p><strong>Privacy and data protection</strong></p>
<ul>
<li>No sensitive personal, corporate, or research data in public/commercial GenAI tools.</li>
<li>Use must comply with GDPR and other regulations.</li>
</ul>
</li>
<li>
<p><strong>Dynamic framework</strong></p>
<ul>
<li>Policy is explicitly designed to be updated as AI tools and regulations evolve.</li>
<li>Regular revisions are expected, not exceptional.</li>
</ul>
</li>
</ul>
<footer>The UvA Experience (2023–2026 and Beyond)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-header="Navigating GenAI in Higher Education" data-footer="The UvA Experience (2023–2026 and Beyond)" data-theme="default" lang="C" data-marpit-pagination="25" style="--paginate:true;--header:Navigating GenAI in Higher Education;--footer:The UvA Experience (2023–2026 and Beyond);--theme:default;" data-marpit-pagination-total="81">
<header>Navigating GenAI in Higher Education</header>
<h1 id="uvas-approach">UvA’s approach:</h1>
<h2 id="are-we-assessing-students-or-their-tools-1">Are we assessing students or their tools?</h2>
<footer>The UvA Experience (2023–2026 and Beyond)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-header="Navigating GenAI in Higher Education" data-footer="The UvA Experience (2023–2026 and Beyond)" data-theme="default" lang="C" data-marpit-pagination="26" style="--paginate:true;--header:Navigating GenAI in Higher Education;--footer:The UvA Experience (2023–2026 and Beyond);--theme:default;" data-marpit-pagination-total="81">
<header>Navigating GenAI in Higher Education</header>
<h1 id="uvas-direction">UvA’s direction</h1>
<ul>
<li>Shift focus from detection to <strong>design</strong>:
<ul>
<li>Use assessment formats where actual student competence is observable.</li>
<li>Combine written work with oral or in‑person elements.</li>
</ul>
</li>
</ul>
<footer>The UvA Experience (2023–2026 and Beyond)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-header="Navigating GenAI in Higher Education" data-footer="The UvA Experience (2023–2026 and Beyond)" data-theme="default" lang="C" data-marpit-pagination="27" style="--paginate:true;--header:Navigating GenAI in Higher Education;--footer:The UvA Experience (2023–2026 and Beyond);--theme:default;" data-marpit-pagination-total="81">
<header>Navigating GenAI in Higher Education</header>
<h1 id="the-assessment-cycle-under-genai">The assessment cycle under GenAI</h1>
<ul>
<li>
<p><strong>Design</strong></p>
<ul>
<li>Choose assessment formats with GenAI risks in mind.</li>
<li>Avoid heavy reliance on unsupervised written work for high‑stakes decisions.</li>
</ul>
</li>
<li>
<p><strong>Construction</strong></p>
<ul>
<li>GenAI can help generate questions or cases, but output must be checked carefully.</li>
<li>Ensure alignment with intended learning objectives and level.</li>
</ul>
</li>
</ul>
<footer>The UvA Experience (2023–2026 and Beyond)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-header="Navigating GenAI in Higher Education" data-footer="The UvA Experience (2023–2026 and Beyond)" data-theme="default" lang="C" data-marpit-pagination="28" style="--paginate:true;--header:Navigating GenAI in Higher Education;--footer:The UvA Experience (2023–2026 and Beyond);--theme:default;" data-marpit-pagination-total="81">
<header>Navigating GenAI in Higher Education</header>
<h1 id="the-assessment-cycle-under-genai-continue">The assessment cycle under GenAI (continue)</h1>
<ul>
<li>
<p><strong>Marking</strong></p>
<ul>
<li>GenAI can assist with model answers, rubrics, or feedback, but <strong>final judgment remains human</strong>.</li>
</ul>
</li>
<li>
<p><strong>Assurance &amp; fraud handling</strong></p>
<ul>
<li>If fraud is suspected, exam committees can use oral checks or additional tasks.</li>
<li>Exams can be invalidated if students cannot demonstrate the required competence.</li>
</ul>
</li>
</ul>
<footer>The UvA Experience (2023–2026 and Beyond)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-header="Navigating GenAI in Higher Education" data-footer="The UvA Experience (2023–2026 and Beyond)" data-theme="default" lang="C" data-marpit-pagination="29" style="--paginate:true;--header:Navigating GenAI in Higher Education;--footer:The UvA Experience (2023–2026 and Beyond);--theme:default;" data-marpit-pagination-total="81">
<header>Navigating GenAI in Higher Education</header>
<h1 id="top%E2%80%91down-governance-management--examination-committees">Top‑down governance: management &amp; examination committees</h1>
<footer>The UvA Experience (2023–2026 and Beyond)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-header="Navigating GenAI in Higher Education" data-footer="The UvA Experience (2023–2026 and Beyond)" data-theme="default" lang="C" data-marpit-pagination="30" style="--paginate:true;--header:Navigating GenAI in Higher Education;--footer:The UvA Experience (2023–2026 and Beyond);--theme:default;" data-marpit-pagination-total="81">
<header>Navigating GenAI in Higher Education</header>
<h1 id="top%E2%80%91down-central-governance-1">Top‑down: central governance (1)</h1>
<ul>
<li>
<p><strong>Executive Board</strong></p>
<ul>
<li>Sets the overall vision for GenAI in education.</li>
<li>Provides licensed GenAI infrastructure (UvA AI Chat).</li>
<li>Funds AI literacy programmes and pilots.</li>
</ul>
</li>
<li>
<p><strong>Deans &amp; programme management</strong></p>
<ul>
<li>Adapt curricula and assessment programmes.</li>
<li>Ensure staff and students develop AI literacy.</li>
<li>Coordinate faculty‑level policy and communication.</li>
</ul>
</li>
</ul>
<footer>The UvA Experience (2023–2026 and Beyond)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-header="Navigating GenAI in Higher Education" data-footer="The UvA Experience (2023–2026 and Beyond)" data-theme="default" lang="C" data-marpit-pagination="31" style="--paginate:true;--header:Navigating GenAI in Higher Education;--footer:The UvA Experience (2023–2026 and Beyond);--theme:default;" data-marpit-pagination-total="81">
<header>Navigating GenAI in Higher Education</header>
<h1 id="top%E2%80%91down-central-governance-2">Top‑down: central governance (2)</h1>
<ul>
<li><strong>Examination committees</strong>
<ul>
<li>Safeguard assessment quality and integrity.</li>
<li>Interpret and adapt fraud regulations for GenAI.</li>
<li>Cooperate with programme directors on assessment policies.</li>
</ul>
</li>
</ul>
<footer>The UvA Experience (2023–2026 and Beyond)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-header="Navigating GenAI in Higher Education" data-footer="The UvA Experience (2023–2026 and Beyond)" data-theme="default" lang="C" data-marpit-pagination="32" style="--paginate:true;--header:Navigating GenAI in Higher Education;--footer:The UvA Experience (2023–2026 and Beyond);--theme:default;" data-marpit-pagination-total="81">
<header>Navigating GenAI in Higher Education</header>
<h1 id="6-faculty%E2%80%91level-responses-fnwi">6. Faculty‑level responses (FNWI)</h1>
<footer>The UvA Experience (2023–2026 and Beyond)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-header="Navigating GenAI in Higher Education" data-footer="The UvA Experience (2023–2026 and Beyond)" data-theme="default" lang="C" data-marpit-pagination="33" style="--paginate:true;--header:Navigating GenAI in Higher Education;--footer:The UvA Experience (2023–2026 and Beyond);--theme:default;" data-marpit-pagination-total="81">
<header>Navigating GenAI in Higher Education</header>
<h1 id="faculty%E2%80%91level-implementation-fnwi-2026">Faculty‑level implementation: FNWI (2026)</h1>
<ul>
<li>FNWI exam committees hold thematic meetings on “GenAI and assessment”:
<ul>
<li>Distinguish <strong>defensive</strong> (fraud prevention) and <strong>offensive</strong> (curriculum innovation) uses of GenAI.</li>
<li>Identify high‑risk formats (theses, written assignments, take‑home exams).</li>
<li>Discuss measures:
<ul>
<li>Oral presentations and short oral exams</li>
<li>Access to edit histories (e.g. git, Overleaf)</li>
<li>Spot checks to discuss ongoing work.</li>
</ul>
</li>
<li>Work with TLC FNWI to share examples and good practices across programmes.</li>
</ul>
</li>
</ul>
<footer>The UvA Experience (2023–2026 and Beyond)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-header="Navigating GenAI in Higher Education" data-footer="The UvA Experience (2023–2026 and Beyond)" data-theme="default" lang="C" data-marpit-pagination="34" style="--paginate:true;--header:Navigating GenAI in Higher Education;--footer:The UvA Experience (2023–2026 and Beyond);--theme:default;" data-marpit-pagination-total="81">
<header>Navigating GenAI in Higher Education</header>
<h1 id="bottom%E2%80%91up-local-initiatives-overview">Bottom‑up: local initiatives (overview)</h1>
<ul>
<li>
<p><strong>Faculty of Science (FNWI)</strong></p>
<ul>
<li>Thematic meetings on “GenAI and assessment” with exam committees and programme directors.</li>
<li>Shared examples from programmes (e.g. Mathematics &amp; SFM, SE/SNE) on GenAI‑resilient assessment.</li>
</ul>
</li>
<li>
<p><strong>Programmes and departments</strong></p>
<ul>
<li>Software Engineering &amp; SNE: discussions on “AI‑first” workflows and AI‑resilient assessment.</li>
<li>Mathematics &amp; SFM: verifiable/non‑verifiable grading rules and thesis defense redesign.</li>
</ul>
</li>
<li>
<p><strong>Teaching &amp; Learning Centres (TLCs)</strong></p>
<ul>
<li>AI literacy e‑learning and workshops (“AI &amp; Assessment”).</li>
<li>Advice on course‑ and programme‑level changes.</li>
<li>Support for pilots and an assessment network where staff share experiences.</li>
</ul>
</li>
</ul>
<footer>The UvA Experience (2023–2026 and Beyond)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-header="Navigating GenAI in Higher Education" data-footer="The UvA Experience (2023–2026 and Beyond)" data-theme="default" lang="C" data-marpit-pagination="35" style="--paginate:true;--header:Navigating GenAI in Higher Education;--footer:The UvA Experience (2023–2026 and Beyond);--theme:default;" data-marpit-pagination-total="81">
<header>Navigating GenAI in Higher Education</header>
<h1 id="7-programme%E2%80%91level-concerns-and-directions">7. Programme‑level concerns and directions</h1>
<footer>The UvA Experience (2023–2026 and Beyond)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-header="Navigating GenAI in Higher Education" data-footer="The UvA Experience (2023–2026 and Beyond)" data-theme="default" lang="C" data-marpit-pagination="36" style="--paginate:true;--header:Navigating GenAI in Higher Education;--footer:The UvA Experience (2023–2026 and Beyond);--theme:default;" data-marpit-pagination-total="81">
<header>Navigating GenAI in Higher Education</header>
<h1 id="are-we-teaching-the-right-content-%E2%80%93-se--sne">Are we teaching the right content? – SE &amp; SNE</h1>
<ul>
<li><strong>Software Engineering (SE) &amp; Security and Network Engineering (SNE)</strong>
<ul>
<li>Staff and exam‑committee discussions highlight questions such as:
<ul>
<li>How should an SE/SNE curriculum look in an <strong>“AI‑first” industry</strong>?</li>
<li>Which skills should students practise <em>with</em> GenAI support, and which must they still master <em>without</em> it?</li>
</ul>
</li>
</ul>
</li>
</ul>
<footer>The UvA Experience (2023–2026 and Beyond)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-header="Navigating GenAI in Higher Education" data-footer="The UvA Experience (2023–2026 and Beyond)" data-theme="default" lang="C" data-marpit-pagination="37" style="--paginate:true;--header:Navigating GenAI in Higher Education;--footer:The UvA Experience (2023–2026 and Beyond);--theme:default;" data-marpit-pagination-total="81">
<header>Navigating GenAI in Higher Education</header>
<h1 id="se--sne-concerns-and-potential-directions">SE &amp; SNE: concerns and potential directions</h1>
<ul>
<li>
<p><strong>Observed challenge</strong></p>
<ul>
<li>SE and SNE operate in an environment where AI tools are rapidly becoming part of standard workflows.</li>
<li>Staff are asking how to keep education relevant and robust in an <strong>AI‑intensive</strong> context.</li>
</ul>
</li>
<li>
<p><strong>Concerns raised in meetings</strong></p>
<ul>
<li>Some existing assignments and exams can now be partially or largely solved using GenAI.</li>
<li>There is a risk that assessments measure <strong>tool use</strong> rather than <strong>student understanding</strong>.</li>
</ul>
</li>
</ul>
<footer>The UvA Experience (2023–2026 and Beyond)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-header="Navigating GenAI in Higher Education" data-footer="The UvA Experience (2023–2026 and Beyond)" data-theme="default" lang="C" data-marpit-pagination="38" style="--paginate:true;--header:Navigating GenAI in Higher Education;--footer:The UvA Experience (2023–2026 and Beyond);--theme:default;" data-marpit-pagination-total="81">
<header>Navigating GenAI in Higher Education</header>
<h1 id="se--sne-concerns-and-potential-directions-continue">SE &amp; SNE: concerns and potential directions (continue)</h1>
<ul>
<li>
<p><strong>Directions being considered</strong></p>
<ul>
<li>Reviewing key SE/SNE courses to see:
<ul>
<li>Where more <strong>in‑class, supervised work</strong> is needed.</li>
<li>Where unsupervised assignments need redesign or different weighting.</li>
</ul>
</li>
<li>Exploring the idea of an experimental <strong>“AI‑first” course</strong> where:
<ul>
<li>Students explicitly use AI tools in SE workflows.</li>
<li>Assessment focuses on how they work with AI and how well they understand the results.</li>
</ul>
</li>
</ul>
</li>
<li>
<p>These are <strong>active discussions</strong>, intended to guide future course and assessment design.</p>
</li>
</ul>
<footer>The UvA Experience (2023–2026 and Beyond)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-header="Navigating GenAI in Higher Education" data-footer="The UvA Experience (2023–2026 and Beyond)" data-theme="default" lang="C" data-marpit-pagination="39" style="--paginate:true;--header:Navigating GenAI in Higher Education;--footer:The UvA Experience (2023–2026 and Beyond);--theme:default;" data-marpit-pagination-total="81">
<header>Navigating GenAI in Higher Education</header>
<h1 id="are-we-teaching-the-right-content-%E2%80%93-bsc-informatics--ai">Are we teaching the right content? – BSc Informatics / AI</h1>
<ul>
<li><strong>BSc Informatics / AI (BAINF)</strong>
<ul>
<li>There is concern that students may rely heavily on GenAI tools.</li>
<li>A key question is how to keep emphasis on:
<ul>
<li>Conceptual foundations and mathematical insight</li>
<li>Critical evaluation of AI systems</li>
<li>Responsible and ethical AI use</li>
</ul>
</li>
</ul>
</li>
</ul>
<footer>The UvA Experience (2023–2026 and Beyond)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-header="Navigating GenAI in Higher Education" data-footer="The UvA Experience (2023–2026 and Beyond)" data-theme="default" lang="C" data-marpit-pagination="40" style="--paginate:true;--header:Navigating GenAI in Higher Education;--footer:The UvA Experience (2023–2026 and Beyond);--theme:default;" data-marpit-pagination-total="81">
<header>Navigating GenAI in Higher Education</header>
<h1 id="bsc-informatics--ai-concerns-and-potential-approaches">BSc Informatics / AI: concerns and potential approaches</h1>
<ul>
<li>
<p><strong>Context</strong></p>
<ul>
<li>Informatics and AI students are early adopters of GenAI; many already use such tools informally.</li>
<li>This raises questions about how to ensure <strong>deep conceptual learning</strong>.</li>
</ul>
</li>
<li>
<p><strong>Concerns discussed</strong></p>
<ul>
<li>To what extent can we trust unsupervised code or text submitted by these students?</li>
<li>How do we make sure they understand algorithms and models beyond what AI tools generate?</li>
</ul>
</li>
</ul>
<footer>The UvA Experience (2023–2026 and Beyond)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-header="Navigating GenAI in Higher Education" data-footer="The UvA Experience (2023–2026 and Beyond)" data-theme="default" lang="C" data-marpit-pagination="41" style="--paginate:true;--header:Navigating GenAI in Higher Education;--footer:The UvA Experience (2023–2026 and Beyond);--theme:default;" data-marpit-pagination-total="81">
<header>Navigating GenAI in Higher Education</header>
<h1 id="bsc-informatics--ai-concerns-and-potential-approaches-continue">BSc Informatics / AI: concerns and potential approaches (continue)</h1>
<ul>
<li>
<p><strong>Possible directions</strong></p>
<ul>
<li>Increase the role of <strong>supervised components</strong> (e.g. live demos, oral explanations of code, whiteboard derivations).</li>
<li>Combine written or coded work with <strong>short oral checks</strong> to confirm understanding.</li>
<li>Encourage thesis and project topics that critically analyse AI in education and GenAI tools themselves.</li>
</ul>
</li>
<li>
<p>The aim is to keep these programmes places where students <strong>both develop and critically examine AI</strong>, including GenAI.</p>
</li>
</ul>
<footer>The UvA Experience (2023–2026 and Beyond)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-header="Navigating GenAI in Higher Education" data-footer="The UvA Experience (2023–2026 and Beyond)" data-theme="default" lang="C" data-marpit-pagination="42" style="--paginate:true;--header:Navigating GenAI in Higher Education;--footer:The UvA Experience (2023–2026 and Beyond);--theme:default;" data-marpit-pagination-total="81">
<header>Navigating GenAI in Higher Education</header>
<h1 id="mathematics--sfm-are-we-teaching-the-right-content">Mathematics &amp; SFM: Are we teaching the right content?</h1>
<ul>
<li>
<p><strong>Mathematics &amp; Stochastics and Financial Mathematics (SFM)</strong></p>
<ul>
<li>Lecturers and exam committees worry that GenAI can solve many homework problems.</li>
<li>This raises the issue:
<ul>
<li>How do we preserve <strong>deep engagement with problem solving</strong>?</li>
<li>How much of the grade can still be based on unsupervised work?</li>
</ul>
</li>
</ul>
</li>
<li>
<p>Across programmes, these are <strong>active concerns and discussion points</strong>, not finished answers.</p>
</li>
</ul>
<footer>The UvA Experience (2023–2026 and Beyond)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-header="Navigating GenAI in Higher Education" data-footer="The UvA Experience (2023–2026 and Beyond)" data-theme="default" lang="C" data-marpit-pagination="43" style="--paginate:true;--header:Navigating GenAI in Higher Education;--footer:The UvA Experience (2023–2026 and Beyond);--theme:default;" data-marpit-pagination-total="81">
<header>Navigating GenAI in Higher Education</header>
<h1 id="mathematics--sfm-programme%E2%80%91level-implementation">Mathematics &amp; SFM: Programme‑level implementation</h1>
<ul>
<li>
<p>“Testing and AI” proposals for Mathematics and SFM programmes:</p>
<ul>
<li>Introduce <strong>verifiably vs non‑verifiably individual components</strong>.</li>
<li>Require a <strong>minimum grade</strong> on verifiable components to pass a course.</li>
<li>Cap non‑verifiable components (homework, reports, take‑home exams) at a small fraction of the total grade.</li>
<li>Add <strong>oral defenses</strong> to thesis courses to verify ownership and understanding.</li>
</ul>
</li>
<li>
<p>Homework shifts from being mainly a <strong>grading tool</strong> to being primarily a <strong>learning tool</strong>.</p>
</li>
</ul>
<footer>The UvA Experience (2023–2026 and Beyond)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-header="Navigating GenAI in Higher Education" data-footer="The UvA Experience (2023–2026 and Beyond)" data-theme="default" lang="C" data-marpit-pagination="44" style="--paginate:true;--header:Navigating GenAI in Higher Education;--footer:The UvA Experience (2023–2026 and Beyond);--theme:default;" data-marpit-pagination-total="81">
<header>Navigating GenAI in Higher Education</header>
<h1 id="mathematics--sfm-concerns-and-potential-avenues">Mathematics &amp; SFM: concerns and potential avenues</h1>
<ul>
<li>
<p><strong>Core concern</strong></p>
<ul>
<li>Generative AI can provide solutions for many standard exercises.</li>
<li>Homework risks becoming a weak indicator of <strong>individual mastery</strong>, while remaining essential for learning.</li>
</ul>
</li>
<li>
<p><strong>Questions under discussion</strong></p>
<ul>
<li>How much of the final grade should rely on <strong>verifiably individual</strong> components (exams, in‑class tests, presentations)?</li>
<li>Should unsupervised components (homework, take‑home exams, reports) have only a <strong>limited impact</strong> on grades?</li>
<li>How can we safeguard the thesis as evidence of the student’s own work?</li>
</ul>
</li>
</ul>
<footer>The UvA Experience (2023–2026 and Beyond)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-header="Navigating GenAI in Higher Education" data-footer="The UvA Experience (2023–2026 and Beyond)" data-theme="default" lang="C" data-marpit-pagination="45" style="--paginate:true;--header:Navigating GenAI in Higher Education;--footer:The UvA Experience (2023–2026 and Beyond);--theme:default;" data-marpit-pagination-total="81">
<header>Navigating GenAI in Higher Education</header>
<h1 id="mathematics--sfm-concerns-and-potential-avenues-continue">Mathematics &amp; SFM: concerns and potential avenues (continue)</h1>
<ul>
<li>
<p><strong>Potential avenues being explored</strong></p>
<ul>
<li>Shifting homework more towards a <strong>learning tool</strong> (practice, feedback) rather than a major grading tool.</li>
<li>Strengthening oral elements (e.g. presentations, short defenses) to verify understanding.</li>
<li>Making the <strong>project process</strong> more visible (interim feedback moments, documentation of progress).</li>
</ul>
</li>
<li>
<p>These directions are being <strong>discussed and piloted</strong>, and may evolve in coming years.</p>
</li>
</ul>
<footer>The UvA Experience (2023–2026 and Beyond)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-header="Navigating GenAI in Higher Education" data-footer="The UvA Experience (2023–2026 and Beyond)" data-theme="default" lang="C" data-marpit-pagination="46" style="--paginate:true;--header:Navigating GenAI in Higher Education;--footer:The UvA Experience (2023–2026 and Beyond);--theme:default;" data-marpit-pagination-total="81">
<header>Navigating GenAI in Higher Education</header>
<h1 id="course%E2%80%91level-assessment-and-thesis-discussions">Course‑level assessment and thesis discussions</h1>
<h2 id="mathematics--sfm-beforeafter-genai">Mathematics &amp; SFM (before/after GenAI)</h2>
<ul>
<li>
<p><strong>Before GenAI</strong></p>
<ul>
<li>Homework and take‑home exercises played a major role in both learning and grading.</li>
<li>The written thesis report was often the primary evidence of achievement.</li>
</ul>
</li>
<li>
<p><strong>Concerns now</strong></p>
<ul>
<li>Homework may no longer reliably show individual progress.</li>
<li>A thesis report could, in principle, be substantially AI‑assisted without clear visibility.</li>
</ul>
</li>
</ul>
<footer>The UvA Experience (2023–2026 and Beyond)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-paginate="true" data-header="Navigating GenAI in Higher Education" data-footer="The UvA Experience (2023–2026 and Beyond)" data-theme="default" lang="C" data-marpit-pagination="47" style="--paginate:true;--header:Navigating GenAI in Higher Education;--footer:The UvA Experience (2023–2026 and Beyond);--theme:default;" data-marpit-pagination-total="81">
<header>Navigating GenAI in Higher Education</header>
<h1 id="mathematics--sfm-grading-rules">Mathematics &amp; SFM grading rules</h1>
<ul>
<li>
<p>Distinguish:</p>
<ul>
<li><strong>Verifiably individual</strong> components: exams, in‑class tests, presentations, supervised group work.</li>
<li><strong>Non‑verifiably individual</strong> components: homework, take‑home exams, reports at home, online exams.</li>
</ul>
</li>
<li>
<p>Rules (illustrative):</p>
<ul>
<li>Students must pass the course on verifiable components alone (e.g. minimum grade threshold).</li>
<li>Non‑verifiably individual components may only contribute a relatively small fraction of the final grade.</li>
</ul>
</li>
</ul>
<footer>The UvA Experience (2023–2026 and Beyond)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-paginate="true" data-header="Navigating GenAI in Higher Education" data-footer="The UvA Experience (2023–2026 and Beyond)" data-theme="default" lang="C" data-marpit-pagination="48" style="--paginate:true;--header:Navigating GenAI in Higher Education;--footer:The UvA Experience (2023–2026 and Beyond);--theme:default;" data-marpit-pagination-total="81">
<header>Navigating GenAI in Higher Education</header>
<h1 id="mathematics--sfm-responses">Mathematics &amp; SFM: responses</h1>
<ul>
<li>
<p><strong>Ideas on the table</strong></p>
<ul>
<li>Make <strong>supervised exams and in‑class assessments</strong> more central in grading.</li>
<li>Combine theses and projects with:
<ul>
<li>Interim feedback moments</li>
<li>Presentations and short oral defenses</li>
</ul>
</li>
<li>Treat homework more as structured <strong>practice and feedback</strong>, with modest weight in the final grade.</li>
</ul>
</li>
<li>
<p>These are meant as <strong>possible responses</strong>, being discussed with lecturers and exam committees.</p>
</li>
</ul>
<footer>The UvA Experience (2023–2026 and Beyond)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-paginate="true" data-header="Navigating GenAI in Higher Education" data-footer="The UvA Experience (2023–2026 and Beyond)" data-theme="default" lang="C" data-marpit-pagination="49" style="--paginate:true;--header:Navigating GenAI in Higher Education;--footer:The UvA Experience (2023–2026 and Beyond);--theme:default;" data-marpit-pagination-total="81">
<header>Navigating GenAI in Higher Education</header>
<h1 id="mathematics--sfm-grading-rules-thesis">Mathematics &amp; SFM grading rules (thesis)</h1>
<ul>
<li>Thesis courses:
<ul>
<li>Introduce a <strong>mandatory defense</strong> (oral exam) focused on ownership and understanding.</li>
<li>Increase weight of verifiable components (attitude/execution, presentation, defense) compared to the written report.</li>
</ul>
</li>
</ul>
<footer>The UvA Experience (2023–2026 and Beyond)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-paginate="true" data-header="Navigating GenAI in Higher Education" data-footer="The UvA Experience (2023–2026 and Beyond)" data-theme="default" lang="C" data-marpit-pagination="50" style="--paginate:true;--header:Navigating GenAI in Higher Education;--footer:The UvA Experience (2023–2026 and Beyond);--theme:default;" data-marpit-pagination-total="81">
<header>Navigating GenAI in Higher Education</header>
<h1 id="se-sne-bsc-informatics--ai-thesis-assessment-work-in-progress">SE, SNE, BSc Informatics / AI: thesis assessment (work in progress)</h1>
<ul>
<li><strong>Thesis assessment concerns</strong>
<ul>
<li>GenAI can assist with writing, coding, and literature searches.</li>
<li>This makes it harder to see how much of the final thesis is the <strong>student’s own work</strong>.</li>
</ul>
</li>
</ul>
<footer>The UvA Experience (2023–2026 and Beyond)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-paginate="true" data-header="Navigating GenAI in Higher Education" data-footer="The UvA Experience (2023–2026 and Beyond)" data-theme="default" lang="C" data-marpit-pagination="51" style="--paginate:true;--header:Navigating GenAI in Higher Education;--footer:The UvA Experience (2023–2026 and Beyond);--theme:default;" data-marpit-pagination-total="81">
<header>Navigating GenAI in Higher Education</header>
<h1 id="se-sne-bsc-informatics--ai-thesis-assessment-work-in-progress-continue">SE, SNE, BSc Informatics / AI: thesis assessment (work in progress) (continue)</h1>
<ul>
<li><strong>Ideas being explored</strong>
<ul>
<li>Adjusting thesis <strong>grading rubrics</strong> to put more weight on:
<ul>
<li>Individual contribution and decision‑making</li>
<li>Process (how the work developed) rather than only the final text</li>
</ul>
</li>
<li>Bringing the second reader in <strong>earlier</strong> in the process, not only at the end.</li>
<li>Adding <strong>mid‑term evaluation points</strong> (formative, no grade impact) to check progress and methods.</li>
</ul>
</li>
</ul>
<footer>The UvA Experience (2023–2026 and Beyond)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="52" data-paginate="true" data-header="Navigating GenAI in Higher Education" data-footer="The UvA Experience (2023–2026 and Beyond)" data-theme="default" lang="C" data-marpit-pagination="52" style="--paginate:true;--header:Navigating GenAI in Higher Education;--footer:The UvA Experience (2023–2026 and Beyond);--theme:default;" data-marpit-pagination-total="81">
<header>Navigating GenAI in Higher Education</header>
<h1 id="se-sne-bsc-informatics--ai-thesis-assessment-work-in-progress-continue-1">SE, SNE, BSc Informatics / AI: thesis assessment (work in progress) (continue)</h1>
<ul>
<li>
<p><strong>Monitoring suggestions</strong></p>
<ul>
<li>Investigating whether a <strong>dashboard</strong> (e.g. from git or Overleaf history) could help supervisors see:
<ul>
<li>How the work evolves over time</li>
<li>Whether there is a plausible progression</li>
</ul>
</li>
</ul>
</li>
<li>
<p>These ideas are part of an ongoing conversation about <strong>making thesis processes more transparent and AI‑resilient</strong>.</p>
</li>
</ul>
<footer>The UvA Experience (2023–2026 and Beyond)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-paginate="true" data-header="Navigating GenAI in Higher Education" data-footer="The UvA Experience (2023–2026 and Beyond)" data-theme="default" lang="C" data-marpit-pagination="53" style="--paginate:true;--header:Navigating GenAI in Higher Education;--footer:The UvA Experience (2023–2026 and Beyond);--theme:default;" data-marpit-pagination-total="81">
<header>Navigating GenAI in Higher Education</header>
<h1 id="10-short%E2%80%91term-vs-long%E2%80%91term-agenda-at-uva">10. Short‑term vs long‑term agenda at UvA</h1>
<footer>The UvA Experience (2023–2026 and Beyond)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-paginate="true" data-header="Navigating GenAI in Higher Education" data-footer="The UvA Experience (2023–2026 and Beyond)" data-theme="default" lang="C" data-marpit-pagination="54" style="--paginate:true;--header:Navigating GenAI in Higher Education;--footer:The UvA Experience (2023–2026 and Beyond);--theme:default;" data-marpit-pagination-total="81">
<header>Navigating GenAI in Higher Education</header>
<h1 id="short%E2%80%91term-2023%E2%80%932026">Short‑term (2023–2026)</h1>
<ul>
<li>
<p>Stabilise policy:</p>
<ul>
<li>GenAI education framework</li>
<li>Assessment Policy Addendum on GenAI</li>
</ul>
</li>
<li>
<p>Build infrastructure:</p>
<ul>
<li>Pilot and scale <strong>UvA AI Chat</strong> for education.</li>
</ul>
</li>
</ul>
<footer>The UvA Experience (2023–2026 and Beyond)</footer>
</section>

<header>Navigating GenAI in Higher Education</header>
<h1 id="personal-perspective-ai-in-education-thomas-zijl">Personal perspective: AI in Education (Thomas Zijl)</h1>

<ul>
<li>MSc thesis (Computer Science, UvA, 2025):<br />
<strong>“Artificial Intelligence in Education: Adapting traditional practices for effective student learning”</strong>
<ul>
<li><a href="https://aied.basenthomas.com/">https://aied.basenthomas.com/</a></li>
</ul>
</li>
</ul>
<footer>The UvA Experience (2023–2026 and Beyond)</footer>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-header="Navigating GenAI in Higher Education" data-footer="The UvA Experience (2023–2026 and Beyond)" data-theme="default" lang="C" data-marpit-pagination="69" style="" data-marpit-pagination-total="81" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-header="Navigating GenAI in Higher Education" data-footer="The UvA Experience (2023–2026 and Beyond)" data-theme="default" lang="C" data-marpit-pagination="70" style="--paginate:true;--header:Navigating GenAI in Higher Education;--footer:The UvA Experience (2023–2026 and Beyond);--theme:default;--marpit-advanced-background-split:40%;" data-marpit-pagination-total="81" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;./images/Thomas-zijl.png&quot;);background-size:100%;"></figure></div></section></foreignObject><foreignObject width="60%" height="720"><section id="70" data-paginate="true" data-header="Navigating GenAI in Higher Education" data-footer="The UvA Experience (2023–2026 and Beyond)" data-theme="default" lang="C" data-marpit-pagination="70" style="--paginate:true;--header:Navigating GenAI in Higher Education;--footer:The UvA Experience (2023–2026 and Beyond);--theme:default;--marpit-advanced-background-split:40%;" data-marpit-pagination-total="81" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<header>Navigating GenAI in Higher Education</header>
<h1 id="personal-perspective-ai-in-education-thomas-zijl-%E2%80%93-themes">Personal perspective: AI in Education (Thomas Zijl) – themes</h1>

<ul>
<li>
<p>Core idea</p>
<ul>
<li>We cannot simply “add AI” on top of existing teaching practices.</li>
<li>We need to <strong>adapt traditional practices</strong> (lectures, exercises, feedback, assessment) to an AI‑rich reality.</li>
</ul>
</li>
<li>
<p>Themes explored</p>
<ul>
<li>How students actually use GenAI in their learning.</li>
<li>Which teaching approaches become less effective when AI is readily available.</li>
<li>How we can redesign teaching so that AI supports, rather than replaces, student thinking.</li>
</ul>
</li>
<li>
<p>My takeaway as supervisor</p>
<ul>
<li>Real student practices with AI often differ from our assumptions.</li>
<li>Understanding those practices is essential if we want AI‑resilient and AI‑enabled education.</li>
</ul>
</li>
</ul>
<footer>The UvA Experience (2023–2026 and Beyond)</footer>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-header="Navigating GenAI in Higher Education" data-footer="The UvA Experience (2023–2026 and Beyond)" data-theme="default" lang="C" data-marpit-pagination="70" style="" data-marpit-pagination-total="81" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="71" data-paginate="true" data-header="Navigating GenAI in Higher Education" data-footer="The UvA Experience (2023–2026 and Beyond)" data-theme="default" lang="C" data-marpit-pagination="71" style="--paginate:true;--header:Navigating GenAI in Higher Education;--footer:The UvA Experience (2023–2026 and Beyond);--theme:default;" data-marpit-pagination-total="81">
<header>Navigating GenAI in Higher Education</header>
<h1 id="data-storytelling-with-small-language-models-ye-yunming">Data storytelling with small language models (Ye Yunming)</h1>
<ul>
<li>
<p>MSc thesis (Computer Science, UvA, 2025):<br />
<strong>“Investigating the Application of Small Language Models for Educational Data Storytelling”</strong></p>
</li>
<li>
<p>Motivation</p>
<ul>
<li>Data storytelling can make student feedback and educational dashboards <strong>more engaging and understandable</strong>.</li>
<li>Large language models are powerful but often <strong>too expensive</strong> for regular, large‑scale educational use.</li>
</ul>
</li>
</ul>
<footer>The UvA Experience (2023–2026 and Beyond)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="72" data-paginate="true" data-header="Navigating GenAI in Higher Education" data-footer="The UvA Experience (2023–2026 and Beyond)" data-theme="default" lang="C" data-marpit-pagination="72" style="--paginate:true;--header:Navigating GenAI in Higher Education;--footer:The UvA Experience (2023–2026 and Beyond);--theme:default;" data-marpit-pagination-total="81">
<header>Navigating GenAI in Higher Education</header>
<h1 id="data-storytelling-with-small-language-models-ye-yunming-%E2%80%93-approach">Data storytelling with small language models (Ye Yunming) – approach</h1>
<ul>
<li>
<p>Key idea</p>
<ul>
<li>Use <strong>small language models (SLMs)</strong> and split the task into stages:
<ol>
<li>Knowledge extraction from educational data</li>
<li>Story generation (narratives for teachers/students)</li>
</ol>
</li>
</ul>
</li>
<li>
<p>Insight</p>
<ul>
<li>Different models are good at different parts of the task.</li>
<li>Carefully designed <strong>multi‑model pipelines</strong> can be both effective and affordable for education.</li>
</ul>
</li>
</ul>
<footer>The UvA Experience (2023–2026 and Beyond)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="73" data-paginate="true" data-header="Navigating GenAI in Higher Education" data-footer="The UvA Experience (2023–2026 and Beyond)" data-theme="default" lang="C" data-marpit-pagination="73" style="--paginate:true;--header:Navigating GenAI in Higher Education;--footer:The UvA Experience (2023–2026 and Beyond);--theme:default;" data-marpit-pagination-total="81">
<header>Navigating GenAI in Higher Education</header>
<h1 id="data-storytelling-with-small-language-models-ye-yunming-%E2%80%93-impact">Data storytelling with small language models (Ye Yunming) – impact</h1>
<ul>
<li>Educational impact
<ul>
<li>This kind of data storytelling can help especially <strong>young teachers</strong>:
<ul>
<li>Quickly understand class performance patterns</li>
<li>Turn data into stories that connect better with students.</li>
</ul>
</li>
</ul>
</li>
</ul>
<footer>The UvA Experience (2023–2026 and Beyond)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="74" data-paginate="true" data-header="Navigating GenAI in Higher Education" data-footer="The UvA Experience (2023–2026 and Beyond)" data-theme="default" lang="C" data-marpit-pagination="74" style="--paginate:true;--header:Navigating GenAI in Higher Education;--footer:The UvA Experience (2023–2026 and Beyond);--theme:default;" data-marpit-pagination-total="81">
<header>Navigating GenAI in Higher Education</header>
<h1 id="what-these-projects-taught-me-personal-lessons">What these projects taught me (personal lessons)</h1>
<ul>
<li>
<p><strong>AI in education is not abstract</strong></p>
<ul>
<li>Supervising Thomas’s thesis showed how <strong>real students and teachers</strong> interact with AI tools.</li>
<li>Policy must be grounded in these day‑to‑day practices, not only high‑level principles.</li>
</ul>
</li>
<li>
<p><strong>Cost and practicality matter</strong></p>
<ul>
<li>Ye’s work on small language models highlighted that <strong>affordable AI</strong> is crucial for sustainable educational use.</li>
<li>Multi‑model, staged approaches can make AI‑supported feedback and storytelling realistic for universities.</li>
</ul>
</li>
</ul>
<footer>The UvA Experience (2023–2026 and Beyond)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="75" data-paginate="true" data-header="Navigating GenAI in Higher Education" data-footer="The UvA Experience (2023–2026 and Beyond)" data-theme="default" lang="C" data-marpit-pagination="75" style="--paginate:true;--header:Navigating GenAI in Higher Education;--footer:The UvA Experience (2023–2026 and Beyond);--theme:default;" data-marpit-pagination-total="81">
<header>Navigating GenAI in Higher Education</header>
<h1 id="what-these-projects-taught-me-personal-lessons-%E2%80%93-design">What these projects taught me (personal lessons) – design</h1>
<ul>
<li>
<p><strong>Design over technology</strong></p>
<ul>
<li>The technology is powerful, but the <strong>design of workflows and assessments</strong> determines whether AI helps or harms learning.</li>
<li>Good AI‑in‑education systems:
<ul>
<li>Make teachers’ work easier, not heavier</li>
<li>Support student understanding, not shortcut it</li>
</ul>
</li>
</ul>
</li>
<li>
<p>These experiences reinforce the central message of this talk:</p>
<ul>
<li>We must rethink teaching and assessment <strong>with AI in mind</strong>, and do so in close dialogue with concrete practice.</li>
</ul>
</li>
</ul>
<footer>The UvA Experience (2023–2026 and Beyond)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="76" data-paginate="true" data-header="Navigating GenAI in Higher Education" data-footer="The UvA Experience (2023–2026 and Beyond)" data-theme="default" lang="C" data-marpit-pagination="76" style="--paginate:true;--header:Navigating GenAI in Higher Education;--footer:The UvA Experience (2023–2026 and Beyond);--theme:default;" data-marpit-pagination-total="81">
<header>Navigating GenAI in Higher Education</header>
<h1 id="13-lessons--open-questions">13. Lessons &amp; open questions</h1>
<footer>The UvA Experience (2023–2026 and Beyond)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="77" data-paginate="true" data-header="Navigating GenAI in Higher Education" data-footer="The UvA Experience (2023–2026 and Beyond)" data-theme="default" lang="C" data-marpit-pagination="77" style="--paginate:true;--header:Navigating GenAI in Higher Education;--footer:The UvA Experience (2023–2026 and Beyond);--theme:default;" data-marpit-pagination-total="81">
<header>Navigating GenAI in Higher Education</header>
<h1 id="what-seems-to-work-at-uva">What seems to work at UvA</h1>
<ul>
<li>Clear <strong>central principles</strong> with room for local experimentation.</li>
<li>Focus on <strong>constructive alignment</strong> and programme‑level assessment design, not only on AI detection.</li>
<li>Combination of:
<ul>
<li><strong>Defensive</strong> measures (fraud prevention, oral checks, format redesign).</li>
<li><strong>Offensive</strong> measures (AI literacy, “AI‑first” courses, pilots with UvA AI Chat).</li>
</ul>
</li>
</ul>
<footer>The UvA Experience (2023–2026 and Beyond)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="78" data-paginate="true" data-header="Navigating GenAI in Higher Education" data-footer="The UvA Experience (2023–2026 and Beyond)" data-theme="default" lang="C" data-marpit-pagination="78" style="--paginate:true;--header:Navigating GenAI in Higher Education;--footer:The UvA Experience (2023–2026 and Beyond);--theme:default;" data-marpit-pagination-total="81">
<header>Navigating GenAI in Higher Education</header>
<h1 id="open-questions-for-all-institutions">Open questions for all institutions</h1>
<ul>
<li>How far should we go in <strong>redesigning curricula and assessment</strong> for GenAI?</li>
<li>What proportion of assessment must be:
<ul>
<li><strong>Individually verifiable</strong> and supervised?</li>
<li>Allowed to use GenAI as a legitimate tool?</li>
</ul>
</li>
<li>How do we manage:
<ul>
<li>Workload and juridification in exam committees?</li>
<li>Fairness and transparency for students?</li>
</ul>
</li>
<li>How can institutions <strong>learn from each other’s practices</strong> rather than reinventing everything alone?</li>
</ul>
<footer>The UvA Experience (2023–2026 and Beyond)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="79" data-paginate="true" data-header="Navigating GenAI in Higher Education" data-footer="The UvA Experience (2023–2026 and Beyond)" data-theme="default" lang="C" data-marpit-pagination="79" style="--paginate:true;--header:Navigating GenAI in Higher Education;--footer:The UvA Experience (2023–2026 and Beyond);--theme:default;" data-marpit-pagination-total="81">
<header>Navigating GenAI in Higher Education</header>
<h1 id="closing">Closing</h1>
<p><strong>Navigating GenAI in Higher Education: The UvA Experience</strong></p>
<ul>
<li>
<p>UvA’s approach is:</p>
<ul>
<li>Ongoing and deliberately dynamic.</li>
<li>A mix of <strong>top‑down frameworks</strong> and <strong>bottom‑up initiatives</strong>.</li>
</ul>
</li>
<li>
<p>Key message:</p>
<ul>
<li>We must keep teaching and assessing <strong>human learning</strong> in an AI‑rich world.</li>
<li>GenAI is a powerful tool, but academic integrity, clarity of goals, and good governance remain central.</li>
</ul>
</li>
</ul>
<footer>The UvA Experience (2023–2026 and Beyond)</footer>
</section>
