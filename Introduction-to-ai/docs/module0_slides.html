<h1 id="a-brief-history-of-ai">A Brief History of AI</h1>
<h2 id="from-foundations-to-generative-ai">From Foundations to Generative AI</h2>
<ul>
<li>Presenter:</li>
<li>Core idea: to understand today’s AI, we must know its <strong>history and shifts</strong></li>
</ul>
<blockquote>
<p>“A generation which ignores history has no past – and no future.”<br />
— Robert A. Heinlein</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" lang="en-US">
<h1 id="the-elusive-definition-of-intelligence">The Elusive Definition of Intelligence</h1>
<ul>
<li>“As soon as it works, no one calls it AI anymore.” — John McCarthy</li>
<li>Intelligence is a <strong>moving target</strong> as technologies become routine.</li>
<li>Today: AI literacy is no longer only for computer scientists.</li>
<li>Students in <strong>all disciplines</strong> must:
<ul>
<li>Evaluate when AI is appropriate</li>
<li>Defend or challenge model choices for their domain</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" lang="en-US">
<h1 id="roadmap-of-this-talk">Roadmap of This Talk</h1>
<ul>
<li><strong>Foundations of Computing</strong>
<ul>
<li>Traditional programming vs. data‑centric learning</li>
</ul>
</li>
<li><strong>The Scaling Problem</strong>
<ul>
<li>Data, storage, and compute infrastructure</li>
</ul>
</li>
<li><strong>The AI Landscape</strong>
<ul>
<li>AI vs. Machine Learning vs. Deep Learning</li>
</ul>
</li>
<li><strong>Historical Milestones</strong>
<ul>
<li>From early neural nets to Transformers</li>
</ul>
</li>
<li><strong>Trust, Safety &amp; Boundaries</strong>
<ul>
<li>Adversarial risk, privacy, and ethics (high‑level preview)</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" lang="en-US">
<h1 id="section-i">SECTION I</h1>
<h2 id="historical-evolution-of-ai">Historical Evolution of AI</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section lang="en-US" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right" style="--marpit-advanced-background-split:40%;"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;./images/Picture10.png&quot;);background-size:70%;"></figure></div></section></foreignObject><foreignObject width="60%" height="720"><section id="5" lang="en-US" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right" style="--marpit-advanced-background-split:40%;">
<h1 id="ai-roots-1940s%E2%80%931950s">AI Roots (1940s–1950s)</h1>
<p>Foundational ideas:</p>
<ul>
<li>
<p><strong>1943 – McCulloch &amp; Pitts</strong></p>
<ul>
<li>First mathematical model of a <strong>neuron</strong></li>
<li>Basis for artificial neural networks</li>
</ul>
</li>
<li>
<p><strong>1950 – Alan Turing</strong></p>
<ul>
<li>Proposes the <strong>Turing Test</strong>:</li>
</ul>
</li>
<li>
<p><strong>1956 – Dartmouth Workshop</strong></p>
<ul>
<li>McCarthy, Minsky, Rochester, Shannon</li>
<li>Coins the term <strong>“Artificial Intelligence”</strong></li>
</ul>
</li>
</ul>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section lang="en-US" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right" style=""></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" lang="en-US">
<h1 id="mapping-the-ai-landscape">Mapping the AI Landscape</h1>
<p>Nested vocabulary (conceptual diagram):</p>
<ul>
<li><strong>Artificial Intelligence</strong>
<ul>
<li>Rule‑based systems, search, logic</li>
<li>⮡ <strong>Machine Learning</strong>
<ul>
<li>Linear/logistic regression, random forests, SVMs</li>
<li>⮡ <strong>Deep Learning</strong>
<ul>
<li>MLPs, CNNs, RNNs, LSTMs, autoencoders</li>
<li>⮡ <strong>Generative AI</strong>
<ul>
<li>GANs, Transformers, Large Language Models (LLMs)</li>
</ul>
</li>
</ul>
</li>
</ul>
</li>
</ul>
</li>
</ul>
<blockquote>
<p>Not all AI is ML; not all ML is deep learning; not all deep learning is generative.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" lang="en-US">
<h1 id="nested-vocabulary-conceptual-diagram">Nested vocabulary (conceptual diagram)</h1>
<p><img src="./images/Picture33.png" alt="center" style="height:450px;" /></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section lang="en-US" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right" style="--marpit-advanced-background-split:40%;"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;./images/Picture39.png&quot;);background-size:70%;"></figure></div></section></foreignObject><foreignObject width="60%" height="720"><section id="8" lang="en-US" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right" style="--marpit-advanced-background-split:40%;">
<h1 id="the-mcculloch-pitts-neuron-1943">The McCulloch-Pitts Neuron (1943)</h1>
<ul>
<li>Inspired by neuroscience:<br />
The brain is composed of neurons interacting via synapses, transmitting either excitatory or inhibitory signals</li>
<li>The neuron can be thought of as a binary classifier<br />
using binary input</li>
<li>A neuron
<ul>
<li>fires if: sum of inputs reaches threshold</li>
<li>unless inhibited by other inputs</li>
</ul>
</li>
</ul>
<h2 id=""></h2>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section lang="en-US" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right" style=""></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section lang="en-US" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right" style="--marpit-advanced-background-split:40%;"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;./images/Picture40.png&quot;);background-size:70%;"></figure></div></section></foreignObject><foreignObject width="60%" height="720"><section id="9" lang="en-US" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right" style="--marpit-advanced-background-split:40%;">
<h1 id="the-perceptron-1957">The Perceptron (1957)</h1>
<ul>
<li>Frank Rosenblatt's original work on the perceptron in the late 1950s laid the groundwork for subsequent research in neural network theory and applications.</li>
</ul>
<blockquote>
<p>The perceptron model demonstrated the potential of neural networks for pattern recognition tasks</p>
</blockquote>

<h1 id="the-perceptron-controversy---minsky-and-papert-1969">The Perceptron (controversy) - Minsky and Papert (1969)</h1>
<ul>
<li>A single perceptron is unable to compute the XOR function, as it’s not linearly separable</li>
</ul>
<blockquote>
<p>Minsky and Papert.  “Perceptron: An Introduction to Computational Geometry”, book 1969</p>
</blockquote>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section lang="en-US" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right" style=""></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" lang="en-US">
<h1 id="expert-systems-symbolic-ai-at-scale">Expert Systems: Symbolic AI at Scale</h1>
<ul>
<li><strong>Dendral (1960s)</strong>  : Helped chemists identify molecules from mass spectra.</li>
<li><strong>MYCIN (1970s)</strong>  : Diagnosed bacterial infections, recommended antibiotics.</li>
<li><strong>XCON (late 1970s–1980s)</strong>  : Configured VAX computers at DEC; saved tens of millions of dollars.</li>
<li><strong>Deep Blue (1990s)</strong>  : Defeated world chess champion Garry Kasparov using search + rule‑based evaluation.</li>
</ul>
<blockquote>
<p>These systems showed symbolic AI <strong>can work very well</strong> in <strong>narrow, structured domains</strong>.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" lang="en-US">
<h1 id="the-multi-layer-perceptron">The Multi-layer Perceptron</h1>
<p>Training before MLP was challenging and less systematic</p>
<ul>
<li>Perceptron Learning Rule</li>
<li>Heuristic Methods</li>
<li>Optimization Techniques</li>
<li>Evolutionary Algorithms</li>
</ul>
<p>Paul Werbos in 1974 laid the foundation</p>
<blockquote>
<p>for training neural networks with <strong>multiple layers of neurons</strong>, which became known as  the backpropagation algorithm</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" lang="en-US">
<h1 id="nettalk-by-sejnowski-and-rosenberg-1986">NetTalk by Sejnowski and Rosenberg 1986</h1>
<p>The NetTalk system consisted of</p>
<ul>
<li>a three-layer neural network</li>
<li>trained on a dataset of English words and their - corresponding phonetic representations</li>
<li>NetTalk learned to map input letters to output phonemes</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section lang="en-US" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right" style="--marpit-advanced-background-split:30%;"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;./images/Picture35.png&quot;);background-size:70%;"></figure></div></section></foreignObject><foreignObject width="70%" height="720"><section id="18" lang="en-US" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right" style="--marpit-advanced-background-split:30%;">
<h1 id="birth-of-deep-learning">Birth of  Deep Learning</h1>
<p>Deep learning models:</p>
<ul>
<li>
<p>Stack many <strong>hidden layers</strong> to learn complex features from raw data.</p>
</li>
<li>
<p><strong>Forward pass</strong></p>
<ul>
<li>Data flows through layers to produce an output</li>
<li>Compute loss vs. ground truth</li>
</ul>
</li>
<li>
<p><strong>Backward pass (backpropagation)</strong></p>
<ul>
<li><strong>chain rule</strong> to compute gradients layer by layer</li>
<li>Update weights to reduce loss</li>
</ul>
</li>
</ul>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section lang="en-US" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right" style=""></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" lang="en-US">

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" lang="en-US">
<h1 id="from-hand%E2%80%91crafted-to-learned-features">From Hand‑Crafted to Learned Features</h1>
<p>Evolution in <strong>computer vision</strong>:</p>
<ul>
<li>Early era:
<ul>
<li>Hand‑crafted features + probabilistic models (e.g. HMMs for sequences)</li>
</ul>
</li>
<li>Deep learning era:
<ul>
<li><strong>Convolutional Neural Networks (CNNs)</strong>:
<ul>
<li>Automatically learn spatial patterns (edges, textures, objects)</li>
<li>Dramatically outperform manual feature pipelines</li>
</ul>
</li>
</ul>
</li>
</ul>
<p>CNNs shifted vision from <strong>feature engineering</strong> to <strong>feature learning</strong>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section lang="en-US" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right" style="--marpit-advanced-background-split:40%;"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;./images/Picture13.png&quot;);background-size:90%;"></figure></div></section></foreignObject><foreignObject width="60%" height="720"><section id="22" lang="en-US" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right" style="--marpit-advanced-background-split:40%;">
<h1 id="convolution-neural-network-1998">Convolution Neural Network (1998)</h1>
<p><strong>LeNet‑5 (Yann LeCun)</strong></p>
<ul>
<li>Introduced:
<ul>
<li>Local receptive fields</li>
<li>Shared weights (convolutions)</li>
<li>Subsampling / pooling</li>
</ul>
</li>
<li>Achieved ≈ <strong>99% accuracy</strong> on digit recognition</li>
</ul>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section lang="en-US" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right" style=""></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" lang="en-US">

</p>

<ul>
<li>Handwritten digits 0–9</li>
<li>Became a standard benchmark for image recognition</li>
</ul>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section lang="en-US" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right" style=""></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section lang="en-US" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right" style="--marpit-advanced-background-split:40%;"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;./images/Picture12.png&quot;);background-size:80%;"></figure></div></section></foreignObject><foreignObject width="60%" height="720"><section id="27" lang="en-US" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right" style="--marpit-advanced-background-split:40%;">
<h1 id="beyond-digits-cifar-datasets">Beyond Digits: CIFAR Datasets</h1>
<p><strong>CIFAR‑10 / CIFAR‑100 (2009)</strong></p>
<ul>
<li>Small natural images across many classes:
<ul>
<li>Animals, vehicles, everyday objects</li>
</ul>
</li>
<li>Posed a harder challenge than MNIST:
<ul>
<li>Complex backgrounds</li>
<li>Varying lighting, viewpoints, clutter</li>
</ul>
</li>
</ul>
<blockquote>
<p>These datasets tested whether models could <strong>generalize</strong> to realistic, high‑variation images.</p>
</blockquote>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section lang="en-US" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right" style=""></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section lang="en-US" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right" style="--marpit-advanced-background-split:40%;"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;./images/Picture38.png&quot;);background-size:80%;"></figure></div></section></foreignObject><foreignObject width="60%" height="720"><section id="28" lang="en-US" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right" style="--marpit-advanced-background-split:40%;">
<h1 id="imagenet-the-deep-learning-breakthrough">ImageNet: The Deep Learning Breakthrough</h1>
<p><strong>ImageNet Large Scale Visual Recognition Challenge (ILSVRC)</strong></p>
<ul>
<li>Annual competition (2010–2017)</li>
<li>Millions of images, 1000+ categories</li>
</ul>
<p><strong>2012 Inflection Point</strong></p>
<ul>
<li><strong>AlexNet</strong> (Krizhevsky, Sutskever, Hinton):
<ul>
<li>Deep CNN, trained on GPUs</li>
</ul>
</li>
<li>Sparked the modern <strong>deep learning boom</strong> in vision and beyond.</li>
</ul>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section lang="en-US" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right" style=""></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" lang="en-US">
<h1 id="reinforcement-learning">Reinforcement Learning</h1>
<p>In reinforcement learning problem are broken down into a continuous loop involving five main components:</p>
<ul>
<li>Agent: The AI player or decision-maker (e.g., a self-driving car software, or a chess bot).</li>
<li>Environment: The world the agent interacts with (e.g., the city streets, or the chessboard).</li>

<li>Action (<mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="1.697ex" height="1.62ex" role="img" focusable="false" viewBox="0 -716 750 716"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D434" d="M208 74Q208 50 254 46Q272 46 272 35Q272 34 270 22Q267 8 264 4T251 0Q249 0 239 0T205 1T141 2Q70 2 50 0H42Q35 7 35 11Q37 38 48 46H62Q132 49 164 96Q170 102 345 401T523 704Q530 716 547 716H555H572Q578 707 578 706L606 383Q634 60 636 57Q641 46 701 46Q726 46 726 36Q726 34 723 22Q720 7 718 4T704 0Q701 0 690 0T651 1T578 2Q484 2 455 0H443Q437 6 437 9T439 27Q443 40 445 43L449 46H469Q523 49 533 63L521 213H283L249 155Q208 86 208 74ZM516 260Q516 271 504 416T490 562L463 519Q447 492 400 412L310 260L413 259Q516 259 516 260Z" /><path /></g></g></g></svg></mjx-container>): The moves or choices available to the agent.</li>
<li>Reward (<mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.048ex;" xmlns="http://www.w3.org/2000/svg" width="1.717ex" height="1.593ex" role="img" focusable="false" viewBox="0 -683 759 704"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D445" d="M230 637Q203 637 198 638T193 649Q193 676 204 682Q206 683 378 683Q550 682 564 680Q620 672 658 652T712 606T733 563T739 529Q739 484 710 445T643 385T576 351T538 338L545 333Q612 295 612 223Q612 212 607 162T602 80V71Q602 53 603 43T614 25T640 16Q668 16 686 38T712 85Q717 99 720 102T735 105Q755 105 755 93Q755 75 731 36Q693 -21 641 -21H632Q571 -21 531 4T487 82Q487 109 502 166T517 239Q517 290 474 313Q459 320 449 321T378 323H309L277 193Q244 61 244 59Q244 55 245 54T252 50T269 48T302 46H333Q339 38 339 37T336 19Q332 6 326 0H311Q275 2 180 2Q146 2 117 2T71 2T50 1Q33 1 33 10Q33 12 36 24Q41 43 46 45Q50 46 61 46H67Q94 46 127 49Q141 52 146 61Q149 65 218 339T287 628Q287 635 230 637ZM630 554Q630 586 609 608T523 636Q521 636 500 636T462 637H440Q393 637 386 627Q385 624 352 494T319 361Q319 360 388 360Q466 361 492 367Q556 377 592 426Q608 449 619 486T630 554Z" /><path /></g></g></g></svg></mjx-container>): The feedback from the environment telling the agent how well it did (can be positive or negative).</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" lang="en-US">

<p><strong>Deep Q‑Networks (DQN) – 2013</strong></p>

<li>Combined: Deep neural nets + Q‑learning Learned Atari games directly from <strong>pixels</strong> via trial and error.</li>

<p><strong>AlphaGo – 2016</strong></p>

<li>Showed deep RL can master extremely complex strategy spaces.</li>

<ul>
<li>MLPs or CNNs used for classification—the architecture was a direct, continuous mapping from input to output.
<ul>
<li>The Structure: Input <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.181ex" role="img" focusable="false" viewBox="0 -511 1000 522"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z" /><path /></g></g></g></svg></mjx-container> Hidden Layer 1 <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.181ex" role="img" focusable="false" viewBox="0 -511 1000 522"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z" /><path /></g></g></g></svg></mjx-container> Hidden Layer 2 <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.181ex" role="img" focusable="false" viewBox="0 -511 1000 522"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z" /><path /></g></g></g></svg></mjx-container> Output.</li>
</ul>
</li>
</ul>
<p>limits:</p>
<blockquote>
<p>good for classification but not for sequence-to-sequence tasks (like translating) or unsupervised representation learning</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" lang="en-US">
<h1 id="encoder%E2%80%93decoder-architectures">Encoder–Decoder Architectures</h1>
<p>Why encoder–decoder?</p>
<ul>
<li><strong>Encoder</strong>:
<ul>
<li>Compresses high‑dimensional input (image, audio, text)<br />
into a compact <strong>feature representation</strong>.</li>
</ul>
</li>
<li><strong>Decoder</strong>:
<ul>
<li>Expands that representation into a new output format:
<ul>
<li>Pixel‑wise segmentation map / Translated sentence / Synthesized audio</li>
</ul>
</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section lang="en-US" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right" style="--marpit-advanced-background-split:40%;"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;./images/Picture42.png&quot;);background-size:80%;"></figure></div></section></foreignObject><foreignObject width="60%" height="720"><section id="35" lang="en-US" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right" style="--marpit-advanced-background-split:40%;">
<p>Example:</p>
<ul>
<li><strong>U‑Net</strong> (2015): Encoder–decoder CNN for medical image segmentation
<ul>
<li>Produces <strong>pixel‑level</strong> output from image inputs.</li>
</ul>
</li>
</ul>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section lang="en-US" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right" style=""></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" lang="en-US">
<h1 id="section-ii">SECTION II</h1>
<h2 id="generative-ai--large-language-models">Generative AI &amp; Large Language Models</h2>
<ul>
<li>Generating <strong>new</strong> content, not just classifying data</li>
<li>Multi‑modal synthesis (text, image, audio, code)</li>
<li>GANs, Transformers, and the rise of <strong>LLMs</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" lang="en-US">
<h1 id="what-is-generative-ai">What Is Generative AI?</h1>
<p><strong>Definition</strong></p>
<ul>
<li>Subfield of AI focused on <strong>creating new data</strong>:
<ul>
<li>Natural language text</li>
<li>Images and video</li>
<li>Audio and music</li>
<li>Code and other artifacts</li>
</ul>
</li>
</ul>
<p><strong>High‑level flow</strong></p>
<ul>
<li>Massive training data → <strong>GenAI model</strong> → new synthetic outputs</li>
<li>Model learns <strong>patterns</strong>, not exact copies of training data.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" lang="en-US">
<h1 id="multi%E2%80%91modal-output-capabilities">Multi‑Modal Output Capabilities</h1>
<p>Modern generative models can produce:</p>
<ul>
<li><strong>Audio</strong>
<ul>
<li>Text‑to‑speech, music composition, voice cloning</li>
</ul>
</li>
<li><strong>Video</strong>
<ul>
<li>Short clips from text prompts, trailer generation, restoration</li>
</ul>
</li>
<li><strong>Images</strong>
<ul>
<li>Concept art, style transfer, in‑painting, design assets</li>
</ul>
</li>
<li><strong>Text</strong>
<ul>
<li>Creative writing, summarization, translation, code generation</li>
</ul>
</li>
</ul>
<blockquote>
<p>Same core idea: map a <strong>prompt</strong> → a <strong>new artifact</strong>.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section lang="en-US" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right" style="--marpit-advanced-background-split:40%;"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;./images/Picture43.png&quot;);background-size:80%;"></figure></div></section></foreignObject><foreignObject width="60%" height="720"><section id="39" lang="en-US" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right" style="--marpit-advanced-background-split:40%;">
<h1 id="generative-adversarial-networks-gans">Generative Adversarial Networks (GANs)</h1>
<p>Two‑network competitive setup:</p>
<ul>
<li><strong>Generator</strong>: Tries to create fake samples that look real.</li>
<li><strong>Discriminator</strong>:  Tries to distinguish <strong>real</strong> vs <strong>fake</strong> samples.</li>
</ul>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section lang="en-US" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right" style=""></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section lang="en-US" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right" style="--marpit-advanced-background-split:40%;"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;./images/Picture43.png&quot;);background-size:80%;"></figure></div></section></foreignObject><foreignObject width="60%" height="720"><section id="40" lang="en-US" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right" style="--marpit-advanced-background-split:40%;">
<h1 id="generative-adversarial-networks-gans-1">Generative Adversarial Networks (GANs)</h1>
<p>Training loop:</p>
<ol>
<li>Generator produces synthetic data.</li>
<li>Discriminator scores it.</li>
<li>Both networks update based on each other’s performance.</li>
</ol>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section lang="en-US" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right" style=""></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section lang="en-US" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right" style="--marpit-advanced-background-split:50%;"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;./images/Picture21.png&quot;);background-size:100%;"></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="41" lang="en-US" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right" style="--marpit-advanced-background-split:50%;">
<h1 id="language-models--embeddings">Language Models &amp; Embeddings</h1>
<p><strong>Language Models (LMs)</strong></p>
<ul>
<li>Neural networks trained on large text corpora.</li>
<li>Goal: model the <strong>probability</strong> of word sequences.</li>
</ul>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section lang="en-US" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right" style=""></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section lang="en-US" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right" style="--marpit-advanced-background-split:50%;"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;./images/Picture22.png&quot;);background-size:100%;"><figcaption>color:black</figcaption></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="42" lang="en-US" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right" style="--marpit-advanced-background-split:50%;">
<h1 id="language-models--embeddings-1">Language Models &amp; Embeddings</h1>
<p><strong>Embeddings</strong></p>
<ul>
<li>Map words/tokens → dense numeric vectors.</li>
<li>Words with similar meaning appear <strong>close</strong> in embedding space:
<ul>
<li>“Grandparent” near “elderly”, “adult”</li>
<li>“Infant” near “baby”, “child”</li>
</ul>
</li>
</ul>
<blockquote>
<p>Embeddings turn discrete language into <strong>continuous geometry</strong>.</p>
</blockquote>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section lang="en-US" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right" style=""></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section lang="en-US" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right" style="--marpit-advanced-background-split:50%;"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;./images/Picture15.png&quot;);background-size:100%;"></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="43" lang="en-US" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right" style="--marpit-advanced-background-split:50%;">
<h1 id="context-problems-in-static-embeddings">Context Problems in Static Embeddings</h1>
<p>Early embeddings gave <strong>one fixed vector per word</strong>:</p>
<ul>
<li>
<p>Word “mean” had a single representation, regardless of context:</p>
<ul>
<li>“What do you <strong>mean</strong>?” (verb)</li>
<li>“You are being <strong>mean</strong>.” (adjective)</li>
<li>“The <strong>mean</strong> absolute error.” (math term)</li>
</ul>
</li>
</ul>
<p>Limitation:</p>
<blockquote>
<p>Model loses <strong>context‑specific meaning</strong> → confusion and errors.<br />
</p>
</blockquote>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section lang="en-US" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right" style=""></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section lang="en-US" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right" style="--marpit-advanced-background-split:40%;"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;./images/Picture16.png&quot;);background-size:100%;"></figure></div></section></foreignObject><foreignObject width="60%" height="720"><section id="44" lang="en-US" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right" style="--marpit-advanced-background-split:40%;">
<h1 id="the-transformer-revolution">The Transformer Revolution</h1>
<p><strong>Transformers</strong> (Vaswani et al., 2017 – “Attention Is All You Need”):</p>
<ul>
<li>Replaced recurrence with <strong>attention mechanisms</strong>.</li>
<li>Key ideas:
<ul>
<li><strong>Self‑attention</strong>: each token can look at <strong>all other tokens</strong>.</li>
<li>Learn which parts of the input are most relevant for each position.</li>
</ul>
</li>
</ul>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section lang="en-US" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right" style=""></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" lang="en-US">
<h1 id="self%E2%80%91attention-disambiguating-bank">Self‑Attention: Disambiguating “Bank”</h1>
<p>Attention weights connect words to their <strong>context clues</strong>.</p>
<p>Example A (financial):</p>
<ul>
<li>
<p>“I put my <strong>money</strong> in the <strong>bank</strong>.”</p>
</li>
<li>
<p>Attention links “bank” strongly to “money” → financial institution.</p>
</li>
</ul>
<p>Example B (river):</p>
<ul>
<li>
<p>“The <strong>river</strong> overflowed its <strong>bank</strong>.”</p>
</li>
<li>
<p>Attention links “bank” to “river” → geographic feature.</p>
</li>
</ul>
<p>The same word gets <strong>different internal representations</strong> depending on context.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" lang="en-US">
<h1 id="large-language-models-llms">Large Language Models (LLMs)</h1>
<p>Characteristics:</p>
<ul>
<li><strong>Billions+</strong> of parameters</li>
<li>Trained on <strong>hundreds of GBs</strong> of text
<ul>
<li>Equivalent to tens of thousands of full book series</li>
</ul>
</li>
</ul>
<p>Emergence:</p>
<ul>
<li>Above certain scale, models show <strong>unexpected abilities</strong>:
<ul>
<li>Multi‑step reasoning</li>
<li>Few‑shot learning from just a handful of examples</li>
<li>Following complex natural language instructions</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" lang="en-US">
<h1 id="gpt-and-next%E2%80%91token-prediction">GPT and Next‑Token Prediction</h1>
<p><strong>GPT = Generative Pre‑trained Transformer</strong></p>
<p>Core mechanism:</p>
<ul>
<li>Given previous tokens, predict the <strong>next token</strong>.</li>
<li>Repeat many times → full paragraph, answer, or dialogue.</li>
</ul>
<p>Training phases:</p>
<ol>
<li><strong>Pre‑training</strong>
<ul>
<li>Learn general language statistics from massive unlabeled text.</li>
</ul>
</li>
<li><strong>Fine‑tuning / alignment</strong>
<ul>
<li>Specialize on tasks, instructions, or safety goals.</li>
</ul>
</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" lang="en-US">
<h1 id="from-base-model-to-assistant">From Base Model to Assistant</h1>
<ol>
<li><strong>Unsupervised pre‑training</strong>
<ul>
<li>Learn generic language patterns.</li>
</ul>
</li>
<li><strong>Supervised fine‑tuning</strong>
<ul>
<li>Train on curated Q&amp;A and instructions.</li>
</ul>
</li>
<li><strong>Reward modeling</strong>
<ul>
<li>Learn what humans prefer in responses.</li>
</ul>
</li>
<li><strong>RLHF (Reinforcement Learning from Human Feedback)</strong>
<ul>
<li>Optimize the model to be:
<ul>
<li>Helpfulm / Honest / Safer</li>
</ul>
</li>
</ul>
</li>
</ol>
<blockquote>
<p>This turns a raw LLM into a <strong>useful assistant</strong>.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section lang="en-US" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right" style="--marpit-advanced-background-split:40%;"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;./images/Picture56.png&quot;);background-size:100%;"></figure></div></section></foreignObject><foreignObject width="60%" height="720"><section id="49" lang="en-US" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right" style="--marpit-advanced-background-split:40%;">
<h1 id="from-base-model-to-assistant-1">From Base Model to Assistant</h1>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section lang="en-US" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right" style=""></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" lang="en-US">
<h1 id="timeline-of-llm-capabilities">Timeline of LLM Capabilities</h1>
<ul>
<li><strong>2018–2019</strong>
<ul>
<li>Early GPT models show promise of Transformers for text.</li>
<li>Assistive robots like CIMON support astronauts on the ISS.</li>
</ul>
</li>
<li><strong>2020</strong>
<ul>
<li>GPT‑3 (175B parameters) demonstrates strong few‑shot skills.</li>
<li>AlphaFold solves key protein‑folding benchmarks.</li>
</ul>
</li>
<li><strong>2023+</strong>
<ul>
<li>GPT‑4 and multimodal models (text + image + more) become widely available.</li>
<li>Millions of users access powerful AI tools daily.</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section lang="en-US" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right" style="--marpit-advanced-background-split:40%;"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;./images/Picture48.png&quot;);background-size:100%;"></figure></div></section></foreignObject><foreignObject width="60%" height="720"><section id="51" lang="en-US" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right" style="--marpit-advanced-background-split:40%;">
<h1 id="text%E2%80%91to%E2%80%91image-generation">Text‑to‑Image Generation</h1>
<p>Modern diffusion and transformer‑based image models:</p>
<ul>
<li>Turn detailed <strong>text prompts</strong> into images.</li>
<li>Control:
<ul>
<li>Style (photorealistic, sketch, anime, etc.)</li>
<li>Composition and layout</li>
<li>Lighting and atmosphere</li>
</ul>
</li>
</ul>
<p>Example:</p>
<blockquote>
<p>“A cinematic night‑time Tokyo street scene, neon lights, rainy reflections”<br />
→ model generates multiple matching images.</p>
</blockquote>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section lang="en-US" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right" style=""></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section lang="en-US" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right" style="--marpit-advanced-background-split:40%;"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;./images/Picture55.png&quot;);background-size:100%;"></figure></div></section></foreignObject><foreignObject width="60%" height="720"><section id="52" lang="en-US" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right" style="--marpit-advanced-background-split:40%;">
<h1 id="generative-video-capabilities">Generative Video Capabilities</h1>
<p>Recent video models can:</p>
<ul>
<li>Generate <strong>short clips</strong> directly from text prompts.</li>
<li>Maintain <strong>temporal coherence</strong>:
<ul>
<li>Objects persist across frames</li>
<li>Motion appears natural</li>
</ul>
</li>
<li>Approximate simple <strong>physics</strong>:
<ul>
<li>Lighting changes</li>
<li>Camera pans and zooms</li>
<li>Basic interactions</li>
</ul>
</li>
</ul>
<blockquote>
<p>Potential uses: pre‑visualization, VFX, education, rapid prototyping.</p>
</blockquote>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section lang="en-US" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right" style=""></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" lang="en-US">
<h1 id="changing-academic-workflows-expert-projections">Changing Academic Workflows (Expert projections):</h1>
<ul>
<li>By mid‑2020s, advanced AI assistants can:
<ul>
<li>Help explore conjectures</li>
<li>Sketch proofs and counterexamples</li>
<li>Generate code and experiments</li>
</ul>
</li>
</ul>
<p>Implications:</p>
<ul>
<li>Human researchers focus more on:
<ul>
<li>Problem formulation</li>
<li>Conceptual insight</li>
<li>Checking and interpreting AI‑generated work</li>
</ul>
</li>
</ul>
<blockquote>
<p>AI shifts from <strong>tool</strong> to <strong>collaborator</strong>.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" lang="en-US">
<h1 id="section-iii">SECTION III</h1>
<h2 id="system-safety-exploits--vulnerabilities">System Safety, Exploits &amp; Vulnerabilities</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="55" lang="en-US">
<h1 id="hallucinations-in-llms">Hallucinations in LLMs</h1>
<ul>
<li>LLM outputs that are:
<ul>
<li>Fluent and confident</li>
<li>But <strong>factually wrong or invented</strong></li>
</ul>
</li>
</ul>
<p>Why it happens:</p>
<ul>
<li>Models optimize for <strong>likely text</strong>, not for truth.</li>
<li>They do not have built‑in verified knowledge bases.</li>
</ul>
<p>Real‑world example:</p>
<ul>
<li>In <em>Mata v. Avianca</em>, a lawyer used ChatGPT to find cases.</li>
<li>The model fabricated legal citations → court sanctions.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="56" lang="en-US">
<h1 id="logic--reasoning-failure-modes">Logic &amp; Reasoning Failure Modes</h1>
<p>Pure language models can:</p>
<ul>
<li>Follow common text patterns</li>
<li>But sometimes fail at <strong>precise logical reasoning</strong></li>
</ul>
<p>Example: “A juggler juggles 16 balls. Half are golf balls, and half of the golf balls are blue. How many blue golf balls?”</p>
<ul>
<li>Incorrect shortcut: “Half of 16 → 8” (ignores the second “half”)</li>
<li>Correct reasoning:   16 balls → 8 golf balls → 4 blue golf balls.</li>
</ul>
<p>Modern reasoning‑tuned models do better, but the limitation is fundamental:</p>
<blockquote>
<p>models track <strong>token probabilities</strong>, not explicit symbolic logic.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="57" lang="en-US">
<h1 id="mitigating-hallucinations-in-practice">Mitigating Hallucinations in Practice</h1>
<p>Defensive strategies:</p>
<ul>
<li><strong>Contextual constraints</strong>
<ul>
<li>System prompts with explicit rules and boundaries.</li>
</ul>
</li>
<li><strong>Conversation framing</strong>
<ul>
<li>Keep the model within a known domain or document scope.</li>
</ul>
</li>
<li><strong>Sampling controls</strong>
<ul>
<li>Lower “temperature” or adjust decoding to reduce wild outputs.</li>
</ul>
</li>
<li><strong>Post‑processing</strong>
<ul>
<li>Sanity checks, format validation, or secondary verification tools.</li>
</ul>
</li>
</ul>
<blockquote>
<p>Goal: encourage <strong>grounded</strong>, not speculative, answers.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="58" lang="en-US">
<h1 id="static-knowledge-vs-dynamic-reality">Static Knowledge vs Dynamic Reality</h1>
<p>Limitations of static training: After training, an LLM’s internal knowledge is <strong>frozen</strong> at a <strong>cutoff date</strong>.</p>
<ul>
<li>It cannot:
<ul>
<li>Natively know post‑cutoff events</li>
<li>Provide sources or citations for its statements.</li>
</ul>
</li>
</ul>
<p>Trust issues:</p>
<ul>
<li>Without external grounding, users cannot easily:
<ul>
<li>Verify where an answer came from</li>
<li>Check if it is up to date</li>
</ul>
</li>
</ul>
<blockquote>
<p>This motivates hybrid architectures like <strong>RAG</strong>.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section lang="en-US" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right" style="--marpit-advanced-background-split:40%;"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;./images/Picture45.png&quot;);background-size:100%;"></figure></div></section></foreignObject><foreignObject width="60%" height="720"><section id="59" lang="en-US" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right" style="--marpit-advanced-background-split:40%;">
<h1 id="retrieval%E2%80%91augmented-generation-rag">Retrieval‑Augmented Generation (RAG)</h1>
<p>How RAG works:</p>
<ol>
<li><strong>User query</strong>: e.g., “Summarize the latest policy from document X.”</li>
<li><strong>Retrieval</strong>: Search external databases / documents for relevant passages.</li>
<li><strong>Augmented prompt</strong>: Combine user question + retrieved context.</li>
<li><strong>Generation</strong>: LLM answers <em>using that specific context</em>.</li>
<li><strong>Citations</strong>: System can point back to retrieved sources.</li>
</ol>
<p>Benefit:</p>
<blockquote>
<ul>
<li>Answers are <strong>grounded</strong> in actual documents, reducing hallucinations and updating knowledge without retraining.</li>
</ul>
</blockquote>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section lang="en-US" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right" style=""></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="60" lang="en-US">
<h1 id="adversarial-security-exploits-intro">Adversarial Security Exploits (Intro)</h1>
<p>LLM systems also face <strong>security threats</strong>:</p>
<ul>
<li><strong>Prompt injection</strong>: User tries to override system instructions.</li>
<li><strong>Jailbreak attempts</strong>: Crafted prompts to bypass safety filters.</li>
<li><strong>Data exfiltration</strong>: Extracting confidential information from integrated systems.</li>
</ul>
<p>Mitigation requires:</p>
<ul>
<li>Careful system prompts and guardrails</li>
<li>Input/output filtering</li>
<li>Separation of sensitive tools and data</li>
</ul>
<blockquote>
<p><em>(Deeper security patterns can be expanded in a dedicated session.)</em></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section lang="en-US" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right" style="--marpit-advanced-background-split:40%;"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;./images/Picture49.png&quot;);background-size:100%;"></figure></div></section></foreignObject><foreignObject width="60%" height="720"><section id="61" lang="en-US" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right" style="--marpit-advanced-background-split:40%;">
<h1 id="security-threats-prompt-injections--jailbreaking">Security Threats: Prompt Injections &amp; Jailbreaking</h1>
<p>As LLMs are wired into tools and workflows, new security risks appear:</p>
<ul>
<li><strong>Prompt injection attacks</strong>: Malicious text tries to override system instructions and safety rules.</li>
<li><strong>Indirect injection</strong>: Hidden instructions embedded in web pages / documents that the LLM reads.</li>
<li><strong>Common attack patterns</strong>
<ul>
<li>(1) Jailbreak prompts,  (2) Context manipulation (“ignore previous instructions…”), (3) Obfuscated code or data to exfiltrate secrets, (4) Attempts to extract credentials or internal configuration</li>
</ul>
</li>
</ul>
<blockquote>
<p>Defensive design is as important as model accuracy.</p>
</blockquote>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section lang="en-US" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right" style=""></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="62" lang="en-US">
<h1 id="section-iv">SECTION IV</h1>
<h2 id="privacy-trust--governance">Privacy, Trust &amp; Governance</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="63" lang="en-US">
<h1 id="the-myth-of-simple-anonymization">The Myth of Simple Anonymization</h1>
<p>Removing obvious identifiers (name, ID) is <strong>not enough</strong>:</p>
<ul>
<li><strong>Linkage attacks</strong>
<ul>
<li>Cross‑link “anonymous” data with public sources to re‑identify people<br />
(e.g., Netflix Prize dataset deanonymization).</li>
</ul>
</li>
<li><strong>A‑priori knowledge</strong>
<ul>
<li>Attacker uses a few known facts about someone to locate their record.</li>
</ul>
</li>
<li><strong>Composition attacks</strong>
<ul>
<li>Combine multiple releases over time to triangulate identities.</li>
</ul>
</li>
</ul>
<blockquote>
<p>Conclusion: privacy must be <strong>designed</strong>, not assumed.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="64" lang="en-US">
<h1 id="federated-learning-decentralized-training">Federated Learning: Decentralized Training</h1>
<p>Goal: train a <strong>shared model</strong> without centralizing sensitive data.</p>
<ul>
<li><strong>Local training</strong>
<ul>
<li>Each site (e.g. hospital, bank branch) keeps data on‑prem.</li>
<li>Trains a model update on its own data.</li>
</ul>
</li>
<li><strong>Central aggregation</strong>
<ul>
<li>Only <strong>model updates / weights</strong> are sent to a server.</li>
<li>Server aggregates into a global model.</li>
</ul>
</li>
</ul>
<blockquote>
<p>Federated learning improves privacy but does <strong>not</strong> solve it alone.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="65" lang="en-US">
<h1 id="differential-privacy-math%E2%80%91backed-protection">Differential Privacy: Math‑Backed Protection</h1>
<p>Differential Privacy (DP) gives <strong>formal guarantees</strong>:</p>
<ul>
<li><strong>Core idea</strong>
<ul>
<li>Whether or not any single person’s data is in the training set<br />
should barely change the model’s outputs.</li>
</ul>
</li>
<li><strong>Mechanism</strong>
<ul>
<li>Add carefully calibrated <strong>noise</strong> to: Data | Gradients | Query answers</li>
</ul>
</li>
</ul>
<p>Example:</p>
<ul>
<li><strong>Randomized response</strong>
<ul>
<li>Individuals sometimes flip answers according to a known probability.</li>
<li>Protects individuals while preserving accurate <strong>aggregate statistics</strong>.</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="66" lang="en-US">
<h1 id="model-inversion--reconstruction-risks">Model Inversion &amp; Reconstruction Risks</h1>
<p>Without privacy controls, models can <strong>memorize</strong> data:</p>
<ul>
<li><strong>Reconstruction attacks</strong>
<ul>
<li>Adversary probes a trained model to reconstruct training examples:
<ul>
<li>Faces, text snippets, health records, etc.</li>
</ul>
</li>
</ul>
</li>
<li><strong>Membership inference</strong>
<ul>
<li>Attacker infers whether a specific person’s data was in the training set.</li>
</ul>
</li>
</ul>
<p>Mitigation:</p>
<ul>
<li>Train with <strong>differential privacy</strong> and regularization.</li>
<li>Limit access to model internals and predictions.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="67" lang="en-US">
<h1 id="explainable-ai-xai">Explainable AI (XAI)</h1>
<p>Why we need explanations: (1) High‑stakes decisions (credit, hiring, medicine, justice) (2) require <strong>justification</strong>, not just accuracy.</p>
<p>Approaches:</p>
<ul>
<li><strong>Global explanations</strong>: Which features matter overall?</li>
<li><strong>Local explanations</strong>: Why this particular prediction?</li>
</ul>
<p>Example method:</p>
<ul>
<li><strong>Feature attribution</strong> (e.g. RISE–style masking)
<ul>
<li>Randomly mask parts of an input (pixels, words)</li>
<li>See how prediction changes</li>
<li>Highlight the regions that contribute most to the decision.</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="68" lang="en-US">
<h1 id="the-future-of-autonomous-agents">The Future of Autonomous Agents</h1>
<p>Beyond static chat:</p>
<ul>
<li><strong>Traditional LLMs</strong>
<ul>
<li>Reactive: answer questions, translate, summarize.</li>
</ul>
</li>
<li><strong>Agentic LLMs</strong>
<ul>
<li>Can:
<ul>
<li>Call tools and APIs</li>
<li>Browse the web</li>
<li>Write and run code</li>
<li>Plan and execute multi‑step tasks</li>
</ul>
</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="69" lang="en-US">
<h1 id="the-future-of-autonomous-agents-1">The Future of Autonomous Agents</h1>
<p>Research example:</p>
<ul>
<li><strong>Stanford small‑town simulation</strong>
<ul>
<li>Dozens of LLM‑powered agents lived in a sandbox world.</li>
<li>They independently:
<ul>
<li>Planned a party</li>
<li>Invited others</li>
<li>Coordinated schedules</li>
<li>Held the event</li>
</ul>
</li>
<li>Demonstrated emergent social behavior.</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="70" lang="en-US">
<h1 id="prompt-engineering-interacting-with-llms">Prompt Engineering: Interacting with LLMs</h1>
<p><strong>Prompt engineering</strong> = designing prompts to steer model behavior<br />
without changing model weights.</p>
<p>High‑level flow:</p>
<ul>
<li><strong>Target objective</strong> + <strong>system context</strong><br />
↓</li>
<li><strong>Optimized prompt</strong> (instructions, examples, format)<br />
↓</li>
<li><strong>High‑precision output</strong> (more reliable and on‑task)</li>
</ul>
<blockquote>
<p>Good prompts act as a <strong>user‑level programming language</strong> for LLMs.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="71" lang="en-US">
<h1 id="core-prompting-strategies">Core Prompting Strategies</h1>
<p>Common patterns:</p>
<ul>
<li><strong>Basic task prompts</strong>
<ul>
<li>Summarization, classification, translation, role‑playing.</li>
</ul>
</li>
<li><strong>Zero‑shot prompting</strong>
<ul>
<li>Ask directly, no examples.</li>
</ul>
</li>
<li><strong>Few‑shot prompting</strong>
<ul>
<li>Include a handful of input–output examples in the prompt.</li>
</ul>
</li>
<li><strong>Chain‑of‑Thought (CoT)</strong>
<ul>
<li>Tell the model: “Think step by step.”</li>
<li>Encourages explicit reasoning → often <strong>better accuracy</strong> on logic problems.</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="72" lang="en-US">
<h1 id="conclusion--core-takeaways">Conclusion &amp; Core Takeaways</h1>
<ul>
<li><strong>Paradigm shift</strong>:  From hand‑coded rules → data‑driven optimization and learning.</li>
<li><strong>Infrastructure realities</strong>: AI is bounded by data volume, network bandwidth, and compute hardware.</li>
<li><strong>Safety &amp; governance</strong>
<ul>
<li>Hallucinations, privacy leaks, and prompt injections require<br />
careful system design and monitoring.</li>
</ul>
</li>
<li><strong>Path forward</strong>
<ul>
<li>Combine <strong>scale and capability</strong> with:
<ul>
<li>Privacy and security</li>
<li>Explainability and governance</li>
<li>Thoughtful human oversight</li>
</ul>
</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="73" lang="en-US"></section>
