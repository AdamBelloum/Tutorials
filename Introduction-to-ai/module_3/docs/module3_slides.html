<h1 id="module-3">Module 3</h1>
<h2 id="introduction-to-deep-learning">Introduction to Deep Learning</h2>
<ul>
<li>From <strong>machine learning</strong> to <strong>deep learning</strong></li>
<li>How <strong>neural networks</strong> are built</li>
<li>How they <strong>learn</strong> (training &amp; backprop)</li>
<li><strong>Gradient issues</strong> in deep networks</li>
<li>Key <strong>architectures</strong> (CNN, RNN, Transformers)</li>
<li>Strengths, limits, and <strong>ethical questions</strong></li>
</ul>
<footer>Deep Learning – Introductory Course</footer>
</section>

<header>Module 3: Deep Learning</header>
<p>class: lead</p>
<h1 id="1-from-machine-learning-to-deep-learning">1. From Machine Learning to Deep Learning</h1>
<footer>Deep Learning – Introductory Course</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-header="Module 3: Deep Learning" data-footer="Deep Learning – Introductory Course" data-theme="default" lang="en-US" data-marpit-pagination="3" style="--paginate:true;--header:Module 3: Deep Learning;--footer:Deep Learning – Introductory Course;--theme:default;" data-marpit-pagination-total="54" data-size="16:9">
<header>Module 3: Deep Learning</header>
<h1 id="recap-from-module-2">Recap from Module 2</h1>
<p>You already know:</p>
<ul>
<li>A <strong>model</strong> maps input $$x$$ to output $$y$$.</li>
<li>We choose a <strong>loss function</strong> to measure error.</li>
<li>We use <strong>gradient descent</strong> to update weights.</li>
<li>We worry about <strong>overfitting</strong> and <strong>generalization</strong>.</li>
</ul>
<p>Deep learning = same ideas, but with <strong>many layers</strong> and <strong>larger models</strong>.</p>
<footer>Deep Learning – Introductory Course</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-header="Module 3: Deep Learning" data-footer="Deep Learning – Introductory Course" data-theme="default" lang="en-US" data-marpit-pagination="4" style="--paginate:true;--header:Module 3: Deep Learning;--footer:Deep Learning – Introductory Course;--theme:default;" data-marpit-pagination-total="54" data-size="16:9">
<header>Module 3: Deep Learning</header>
<h1 id="what-is-deep-learning">What is Deep Learning?</h1>
<p><strong>Deep Learning</strong> is a subfield of Machine Learning that uses:</p>
<ul>
<li><strong>Neural networks</strong> with <strong>many layers</strong> (deep)</li>
<li>Lots of data</li>
<li>Lots of compute</li>
</ul>
<p>Key idea:</p>
<blockquote>
<p>Let the model <strong>learn its own features</strong> from raw data,<br />
instead of manually designing features.</p>
</blockquote>
<footer>Deep Learning – Introductory Course</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-header="Module 3: Deep Learning" data-footer="Deep Learning – Introductory Course" data-theme="default" lang="en-US" data-marpit-pagination="5" style="--paginate:true;--header:Module 3: Deep Learning;--footer:Deep Learning – Introductory Course;--theme:default;" data-marpit-pagination-total="54" data-size="16:9">
<header>Module 3: Deep Learning</header>
<h1 id="why-deep-learning">Why Deep Learning?</h1>
<p>Deep learning has driven breakthroughs in:</p>
<ul>
<li><strong>Computer vision</strong> (image recognition, medical imaging)</li>
<li><strong>Natural language processing</strong> (translation, chatbots)</li>
<li><strong>Speech recognition</strong> (digital assistants)</li>
<li><strong>Game playing</strong> (Go, StarCraft)</li>
<li><strong>Recommendation &amp; personalization</strong></li>
</ul>
<footer>Deep Learning – Introductory Course</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-header="Module 3: Deep Learning" data-footer="Deep Learning – Introductory Course" data-theme="default" lang="en-US" data-marpit-pagination="6" style="--paginate:true;--header:Module 3: Deep Learning;--footer:Deep Learning – Introductory Course;--theme:default;" data-marpit-pagination-total="54" data-size="16:9">
<header>Module 3: Deep Learning</header>
<p>class: lead</p>
<h1 id="2-artificial-neural-networks">2. Artificial Neural Networks</h1>
<h2 id="neurons-and-layers">Neurons and Layers</h2>
<footer>Deep Learning – Introductory Course</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-header="Module 3: Deep Learning" data-footer="Deep Learning – Introductory Course" data-theme="default" lang="en-US" data-marpit-pagination="7" style="--paginate:true;--header:Module 3: Deep Learning;--footer:Deep Learning – Introductory Course;--theme:default;" data-marpit-pagination-total="54" data-size="16:9">
<header>Module 3: Deep Learning</header>
<h1 id="artificial-neural-networks-anns">Artificial Neural Networks (ANNs)</h1>
<p>An <strong>Artificial Neural Network</strong> is:</p>
<ul>
<li>A collection of simple units called <strong>neurons</strong></li>
<li>Organized into <strong>layers</strong></li>
<li>Connected by <strong>weights</strong></li>
</ul>
<p>Basic structure:</p>
<ul>
<li><strong>Input layer</strong>: receives features</li>
<li><strong>Hidden layers</strong>: transform representations</li>
<li><strong>Output layer</strong>: produces prediction</li>
</ul>
<footer>Deep Learning – Introductory Course</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-header="Module 3: Deep Learning" data-footer="Deep Learning – Introductory Course" data-theme="default" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--header:Module 3: Deep Learning;--footer:Deep Learning – Introductory Course;--theme:default;" data-marpit-pagination-total="54" data-size="16:9">

<header>Module 3: Deep Learning</header>
<h1 id="intuition-assembly-line">Intuition: Assembly Line</h1>
<p>Think of a neural network as a <strong>factory assembly line</strong>:</p>
<ul>
<li>Raw material = input data</li>
<li>Each station (layer) <strong>adds or transforms</strong> something</li>
<li>At the end, we get a <strong>finished product</strong> = prediction</li>
</ul>
<p>Early layers learn <strong>simple patterns</strong>, later layers learn <strong>more abstract concepts</strong>.</p>
<footer>Deep Learning – Introductory Course</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-header="Module 3: Deep Learning" data-footer="Deep Learning – Introductory Course" data-theme="default" lang="en-US" data-marpit-pagination="10" style="--paginate:true;--header:Module 3: Deep Learning;--footer:Deep Learning – Introductory Course;--theme:default;" data-marpit-pagination-total="54" data-size="16:9">
<header>Module 3: Deep Learning</header>
<h1 id="example-house-price-prediction">Example: House Price Prediction</h1>
<ul>
<li>Input features:
<ul>
<li>Size, number of rooms, location, etc.</li>
</ul>
</li>
<li>Hidden layers:
<ul>
<li>Combine features into abstract concepts (e.g. “overall house quality”)</li>
</ul>
</li>
<li>Output layer:
<ul>
<li>A single number = predicted price</li>
</ul>
</li>
</ul>
<p>Same pipeline works for many tasks (images, text, audio).</p>
<footer>Deep Learning – Introductory Course</footer>
</section>

<header>Module 3: Deep Learning</header>
<h1 id="intuition-dials-and-thresholds">Intuition: Dials and Thresholds</h1>
<ul>
<li><strong>Weights</strong>:
<ul>
<li>Like <strong>dials</strong> controlling how strongly each input influences the next neuron.</li>
</ul>
</li>
<li><strong>Biases</strong>:
<ul>
<li>Like a <strong>baseline</strong> or threshold.</li>
<li>Even if inputs are small, the neuron may still fire if bias is high.</li>
</ul>
</li>
</ul>
<p>Training = turning all these dials until the network works well.</p>
<footer>Deep Learning – Introductory Course</footer>
</section>

<ul>
<li><strong>ReLU</strong>: $$\text{ReLU}(z) = \max(0, z)$$</li>
<li><strong>Sigmoid</strong>: $$\sigma(z) = \frac{1}{1 + e^{-z}}$$</li>
<li><strong>Softmax</strong> (for multi-class outputs)</li>
</ul>
<p>Without non-linearity, many layers collapse into <strong>one big linear model</strong>.</p>

<header>Module 3: Deep Learning</header>
<h1 id="why-non-linearity">Why Non-linearity?</h1>
<p>Non-linear activations allow the network to learn:</p>
<ul>
<li><strong>Curved</strong> decision boundaries</li>
<li>Complex relationships like “if this AND that OR something else”</li>
</ul>
<p>Without them, the network can only draw <strong>straight lines / planes</strong> in feature space.</p>
<footer>Deep Learning – Introductory Course</footer>
</section>

<header>Module 3: Deep Learning</header>
<h1 id="example-relu">Example: ReLU</h1>
<p>ReLU:</p>
<ul>
<li>If $$z &lt; 0$$ → output = 0</li>
<li>If $$z &gt; 0$$ → output = $$z$$</li>
</ul>
<p>Intuition:</p>
<ul>
<li>Negative or irrelevant signals are <strong>shut off</strong></li>
<li>Positive signals pass through unchanged</li>
</ul>
<p>Benefits:</p>
<ul>
<li>Simple</li>
<li>Works well in practice</li>
<li>Helps training deep networks</li>
</ul>
<footer>Deep Learning – Introductory Course</footer>
</section>

<header>Module 3: Deep Learning</header>
<h1 id="loss-function-reminder-from-module-2">Loss Function (Reminder from Module 2)</h1>
<p>The <strong>loss function</strong> measures how wrong the prediction is.</p>
<p>Examples:</p>
<ul>
<li><strong>Regression</strong> (predicting numbers):
<ul>
<li>Mean Squared Error (MSE)</li>
</ul>
</li>
<li><strong>Binary classification</strong>:
<ul>
<li>Binary Cross-Entropy</li>
</ul>
</li>
<li><strong>Multi-class classification</strong>:
<ul>
<li>Cross-Entropy with softmax outputs</li>
</ul>
</li>
</ul>
<p>Training = adjust weights to <strong>reduce loss</strong> across many examples.</p>

<header>Module 3: Deep Learning</header>
<h1 id="intuition-hiking-in-the-fog">Intuition: Hiking in the Fog</h1>
<ul>
<li>Loss function = shape of the landscape (mountains and valleys)</li>
<li>Gradient = direction where the ground slopes upward most steeply</li>
<li>We want to go <strong>downhill</strong>, so we step in the opposite direction</li>
<li>Learning rate = how big our steps are</li>
</ul>
<p>Repeat many steps → (hopefully) reach a <strong>valley</strong> (low loss).</p>
<footer>Deep Learning – Introductory Course</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-header="Module 3: Deep Learning" data-footer="Deep Learning – Introductory Course" data-theme="default" lang="en-US" data-marpit-pagination="22" style="--paginate:true;--header:Module 3: Deep Learning;--footer:Deep Learning – Introductory Course;--theme:default;" data-marpit-pagination-total="54" data-size="16:9">
<header>Module 3: Deep Learning</header>
<p>class: lead</p>
<h1 id="5-backpropagation-and-gradient-issues">5. Backpropagation and Gradient Issues</h1>
<footer>Deep Learning – Introductory Course</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-header="Module 3: Deep Learning" data-footer="Deep Learning – Introductory Course" data-theme="default" lang="en-US" data-marpit-pagination="23" style="--paginate:true;--header:Module 3: Deep Learning;--footer:Deep Learning – Introductory Course;--theme:default;" data-marpit-pagination-total="54" data-size="16:9">
<header>Module 3: Deep Learning</header>
<h1 id="what-is-backpropagation">What is Backpropagation?</h1>
<p>Backpropagation = <strong>Backwards Propagation of Errors</strong>.</p>
<p>Purpose:</p>
<ul>
<li>Efficiently compute how <strong>every weight</strong> and <strong>bias</strong> affected the loss.</li>
<li>Provide gradients needed for <strong>gradient descent</strong>.</li>
</ul>
<p>High-level steps:</p>
<ol>
<li>Do a <strong>forward pass</strong>, compute loss.</li>
<li>Do a <strong>backward pass</strong>:
<ul>
<li>Propagate error signals from output back to earlier layers.</li>
<li>Compute gradients for all weights and biases.</li>
</ul>
</li>
</ol>
<footer>Deep Learning – Introductory Course</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-header="Module 3: Deep Learning" data-footer="Deep Learning – Introductory Course" data-theme="default" lang="en-US" data-marpit-pagination="24" style="--paginate:true;--header:Module 3: Deep Learning;--footer:Deep Learning – Introductory Course;--theme:default;" data-marpit-pagination-total="54" data-size="16:9">
<header>Module 3: Deep Learning</header>
<h1 id="intuition-passing-the-blame-backwards">Intuition: Passing the Blame Backwards</h1>
<p>When the network makes a wrong prediction:</p>
<ul>
<li>Output layer gets the <strong>first blame</strong>.</li>
<li>We ask: which neurons and weights contributed to this error?</li>
<li>Backpropagation <strong>distributes blame</strong> backward:
<ul>
<li>Adjust output layer weights</li>
<li>Then adjust previous layers, and so on</li>
</ul>
</li>
</ul>
<p>This uses the <strong>chain rule</strong> from calculus, but conceptually it’s just:</p>
<blockquote>
<p>“Who needs to change, and in which direction, to reduce error?”</p>
</blockquote>
<footer>Deep Learning – Introductory Course</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-header="Module 3: Deep Learning" data-footer="Deep Learning – Introductory Course" data-theme="default" lang="en-US" data-marpit-pagination="25" style="--paginate:true;--header:Module 3: Deep Learning;--footer:Deep Learning – Introductory Course;--theme:default;" data-marpit-pagination-total="54" data-size="16:9">
<header>Module 3: Deep Learning</header>
<h1 id="example-intuition">Example Intuition</h1>
<p>Image classifier mistakes a <strong>cat</strong> for a <strong>dog</strong>:</p>
<ul>
<li>Last layer: wrong category chosen → adjust these weights.</li>
<li>Previous layer:
<ul>
<li>Maybe a “dog ear” detector neuron fired too strongly:</li>
<li>Backprop reduces its weights for this pattern.</li>
</ul>
</li>
<li>Even earlier layers:
<ul>
<li>Adjust edge and texture detectors that contributed.</li>
</ul>
</li>
</ul>
<p>Over time, the network <strong>refines</strong> all layers to better separate cats and dogs.</p>
<footer>Deep Learning – Introductory Course</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-header="Module 3: Deep Learning" data-footer="Deep Learning – Introductory Course" data-theme="default" lang="en-US" data-marpit-pagination="26" style="--paginate:true;--header:Module 3: Deep Learning;--footer:Deep Learning – Introductory Course;--theme:default;" data-marpit-pagination-total="54" data-size="16:9">
<header>Module 3: Deep Learning</header>
<h1 id="you-dont-need-the-full-math-yet">You Don’t Need the Full Math (Yet)</h1>
<p>For this course we focus on:</p>
<ul>
<li>What backprop <strong>does</strong>, not the full derivation.</li>
<li>It gives us the gradient needed for <strong>gradient descent</strong>.</li>
<li>Modern frameworks (PyTorch, TensorFlow) compute it automatically.</li>
</ul>
<p>Key takeaway:</p>
<blockquote>
<p>Deep networks can be trained end-to-end because backprop efficiently tells us how to adjust every layer.</p>
</blockquote>
<footer>Deep Learning – Introductory Course</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-header="Module 3: Deep Learning" data-footer="Deep Learning – Introductory Course" data-theme="default" lang="en-US" data-marpit-pagination="27" style="--paginate:true;--header:Module 3: Deep Learning;--footer:Deep Learning – Introductory Course;--theme:default;" data-marpit-pagination-total="54" data-size="16:9">
<header>Module 3: Deep Learning</header>
<h1 id="vanishing-and-exploding-gradients">Vanishing and Exploding Gradients</h1>
<p>In <strong>very deep networks</strong>, gradients can:</p>
<ul>
<li>Become <strong>very small</strong> (vanish)</li>
<li>Become <strong>very large</strong> (explode)</li>
</ul>
<p>During backprop:</p>
<ul>
<li>Gradients are multiplied through many layers.</li>
<li>Small numbers multiplied repeatedly → almost <strong>zero</strong>.</li>
<li>Large numbers multiplied repeatedly → <strong>huge</strong> values.</li>
</ul>
<p>Result:</p>
<ul>
<li><strong>Vanishing gradient</strong>:
<ul>
<li>Early layers barely get updated → training stalls.</li>
</ul>
</li>
<li><strong>Exploding gradient</strong>:
<ul>
<li>Updates are unstable → loss oscillates or diverges.</li>
</ul>
</li>
</ul>
<footer>Deep Learning – Introductory Course</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-header="Module 3: Deep Learning" data-footer="Deep Learning – Introductory Course" data-theme="default" lang="en-US" data-marpit-pagination="28" style="--paginate:true;--header:Module 3: Deep Learning;--footer:Deep Learning – Introductory Course;--theme:default;" data-marpit-pagination-total="54" data-size="16:9">
<header>Module 3: Deep Learning</header>
<h1 id="intuition-whisper-chain-and-feedback-loop">Intuition: Whisper Chain and Feedback Loop</h1>
<p>Two analogies:</p>
<ul>
<li><strong>Vanishing gradient</strong>:
<ul>
<li>Like a message whispered through a long line of people.</li>
<li>By the time it reaches the start, it is <strong>almost lost</strong>.</li>
</ul>
</li>
<li><strong>Exploding gradient</strong>:
<ul>
<li>Like a microphone too close to a speaker.</li>
<li>The sound feeds back and becomes <strong>louder and louder</strong>.</li>
</ul>
</li>
</ul>
<p>Both make it hard to train very deep networks.</p>
<footer>Deep Learning – Introductory Course</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-header="Module 3: Deep Learning" data-footer="Deep Learning – Introductory Course" data-theme="default" lang="en-US" data-marpit-pagination="29" style="--paginate:true;--header:Module 3: Deep Learning;--footer:Deep Learning – Introductory Course;--theme:default;" data-marpit-pagination-total="54" data-size="16:9">
<header>Module 3: Deep Learning</header>
<h1 id="coping-with-gradient-problems-high-level">Coping with Gradient Problems (High-Level)</h1>
<p>Modern deep learning uses several tricks to reduce vanishing / exploding gradients:</p>
<ul>
<li><strong>Better activations</strong>:
<ul>
<li>ReLU and variants help keep gradients from shrinking too much.</li>
</ul>
</li>
<li><strong>Careful weight initialization</strong>:
<ul>
<li>Start with weights scaled to keep activations/gradients in a reasonable range.</li>
</ul>
</li>
<li><strong>Normalization layers</strong>:
<ul>
<li>Batch Normalization, Layer Normalization help stabilize training.</li>
</ul>
</li>
<li><strong>Residual connections</strong> (skip connections):
<ul>
<li>Allow gradients to flow more directly through deep networks (as in ResNets).</li>
</ul>
</li>
</ul>
<p>You don’t need the formulas now; just know these techniques exist to make deep networks trainable.</p>
<footer>Deep Learning – Introductory Course</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-header="Module 3: Deep Learning" data-footer="Deep Learning – Introductory Course" data-theme="default" lang="en-US" data-marpit-pagination="30" style="--paginate:true;--header:Module 3: Deep Learning;--footer:Deep Learning – Introductory Course;--theme:default;" data-marpit-pagination-total="54" data-size="16:9">
<header>Module 3: Deep Learning</header>
<p>class: lead</p>
<h1 id="6-training-overfitting-and-regularization">6. Training, Overfitting, and Regularization</h1>
<footer>Deep Learning – Introductory Course</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-header="Module 3: Deep Learning" data-footer="Deep Learning – Introductory Course" data-theme="default" lang="en-US" data-marpit-pagination="31" style="--paginate:true;--header:Module 3: Deep Learning;--footer:Deep Learning – Introductory Course;--theme:default;" data-marpit-pagination-total="54" data-size="16:9">
<header>Module 3: Deep Learning</header>
<h1 id="train--validation--test-recap">Train / Validation / Test (Recap)</h1>
<p>We split the dataset:</p>
<ul>
<li><strong>Training set</strong>: used to adjust weights</li>
<li><strong>Validation set</strong>: used to tune hyperparameters and monitor overfitting</li>
<li><strong>Test set</strong>: used once at the end to estimate final performance</li>
</ul>
<p>For deep learning, this split is even more important because:</p>
<ul>
<li>Models are <strong>very powerful</strong> and can easily <strong>overfit</strong>.</li>
</ul>
<footer>Deep Learning – Introductory Course</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-header="Module 3: Deep Learning" data-footer="Deep Learning – Introductory Course" data-theme="default" lang="en-US" data-marpit-pagination="32" style="--paginate:true;--header:Module 3: Deep Learning;--footer:Deep Learning – Introductory Course;--theme:default;" data-marpit-pagination-total="54" data-size="16:9">
<header>Module 3: Deep Learning</header>
<h1 id="overfitting-in-deep-networks">Overfitting in Deep Networks</h1>
<p>Overfitting = model performs:</p>
<ul>
<li>Very well on <strong>training data</strong></li>
<li>Poorly on <strong>validation / test data</strong></li>
</ul>
<p>Deep networks can:</p>
<ul>
<li>Memorize training examples</li>
<li>Learn patterns that don’t generalize</li>
</ul>
<p>Symptoms:</p>
<ul>
<li>Training loss ↓</li>
<li>Validation loss ↓ then ↑ (starts getting worse)</li>
</ul>
<footer>Deep Learning – Introductory Course</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-header="Module 3: Deep Learning" data-footer="Deep Learning – Introductory Course" data-theme="default" lang="en-US" data-marpit-pagination="33" style="--paginate:true;--header:Module 3: Deep Learning;--footer:Deep Learning – Introductory Course;--theme:default;" data-marpit-pagination-total="54" data-size="16:9">
<header>Module 3: Deep Learning</header>
<h1 id="regularization-keeping-models-in-check">Regularization: Keeping Models in Check</h1>
<p>Common regularization techniques in deep learning:</p>
<ul>
<li><strong>L2 regularization (weight decay)</strong>:
<ul>
<li>Penalize large weights, encourage simpler models</li>
</ul>
</li>
<li><strong>Dropout</strong>:
<ul>
<li>Randomly zero out some neurons during training</li>
</ul>
</li>
<li><strong>Early stopping</strong>:
<ul>
<li>Stop training when validation loss stops improving</li>
</ul>
</li>
<li><strong>Data augmentation</strong>:
<ul>
<li>Create more varied training examples (especially for images)</li>
</ul>
</li>
</ul>
<footer>Deep Learning – Introductory Course</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-header="Module 3: Deep Learning" data-footer="Deep Learning – Introductory Course" data-theme="default" lang="en-US" data-marpit-pagination="34" style="--paginate:true;--header:Module 3: Deep Learning;--footer:Deep Learning – Introductory Course;--theme:default;" data-marpit-pagination-total="54" data-size="16:9">
<header>Module 3: Deep Learning</header>
<h1 id="dropout-intuition">Dropout (Intuition)</h1>
<p>Dropout:</p>
<ul>
<li>During training, each neuron has a chance to be <strong>turned off</strong> for that batch.</li>
<li>The network cannot rely on any single neuron.</li>
<li>It must spread knowledge across many neurons.</li>
</ul>
<p>Result:</p>
<ul>
<li>Less memorization</li>
<li>More robust, <strong>general</strong> features</li>
</ul>
<footer>Deep Learning – Introductory Course</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-header="Module 3: Deep Learning" data-footer="Deep Learning – Introductory Course" data-theme="default" lang="en-US" data-marpit-pagination="35" style="--paginate:true;--header:Module 3: Deep Learning;--footer:Deep Learning – Introductory Course;--theme:default;" data-marpit-pagination-total="54" data-size="16:9">
<header>Module 3: Deep Learning</header>
<h1 id="data-augmentation-intuition">Data Augmentation (Intuition)</h1>
<p>Instead of collecting more data, we:</p>
<ul>
<li>Modify existing data in realistic ways:</li>
</ul>
<p>For images:</p>
<ul>
<li>Rotate, flip, crop, change brightness, add noise</li>
</ul>
<p>Benefits:</p>
<ul>
<li>Model sees more <strong>varied examples</strong></li>
<li>Learns features that are robust to small changes</li>
<li>Helps reduce overfitting</li>
</ul>
<footer>Deep Learning – Introductory Course</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-header="Module 3: Deep Learning" data-footer="Deep Learning – Introductory Course" data-theme="default" lang="en-US" data-marpit-pagination="36" style="--paginate:true;--header:Module 3: Deep Learning;--footer:Deep Learning – Introductory Course;--theme:default;" data-marpit-pagination-total="54" data-size="16:9">
<header>Module 3: Deep Learning</header>
<p>class: lead</p>
<h1 id="7-deep-learning-architectures">7. Deep Learning Architectures</h1>
<footer>Deep Learning – Introductory Course</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-header="Module 3: Deep Learning" data-footer="Deep Learning – Introductory Course" data-theme="default" lang="en-US" data-marpit-pagination="37" style="--paginate:true;--header:Module 3: Deep Learning;--footer:Deep Learning – Introductory Course;--theme:default;" data-marpit-pagination-total="54" data-size="16:9">
<header>Module 3: Deep Learning</header>
<h1 id="why-different-architectures">Why Different Architectures?</h1>
<p>Basic (fully-connected) networks treat all inputs the same way.</p>
<p>But:</p>
<ul>
<li>Images have <strong>spatial structure</strong> (nearby pixels matter together).</li>
<li>Text and speech have <strong>temporal / sequential structure</strong> (order matters).</li>
</ul>
<p>Specialized architectures exploit these structures:</p>
<ul>
<li><strong>Convolutional Neural Networks (CNNs)</strong></li>
<li><strong>Recurrent Neural Networks (RNNs)</strong></li>
<li><strong>Transformers</strong></li>
</ul>
<footer>Deep Learning – Introductory Course</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-header="Module 3: Deep Learning" data-footer="Deep Learning – Introductory Course" data-theme="default" lang="en-US" data-marpit-pagination="38" style="--paginate:true;--header:Module 3: Deep Learning;--footer:Deep Learning – Introductory Course;--theme:default;" data-marpit-pagination-total="54" data-size="16:9">
<header>Module 3: Deep Learning</header>
<h1 id="convolutional-neural-networks-cnns">Convolutional Neural Networks (CNNs)</h1>
<p>Designed for data on a <strong>grid</strong>, like images.</p>
<p>Key ideas:</p>
<ul>
<li>Use <strong>small filters</strong> (kernels) that slide over the image</li>
<li>Filters detect local patterns:
<ul>
<li>Edges, corners, textures</li>
</ul>
</li>
<li><strong>Weight sharing</strong>:
<ul>
<li>Same filter applied everywhere → fewer parameters</li>
</ul>
</li>
</ul>
<p>Result:</p>
<ul>
<li>Very good at recognizing <strong>objects</strong> in images.</li>
</ul>
<footer>Deep Learning – Introductory Course</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-header="Module 3: Deep Learning" data-footer="Deep Learning – Introductory Course" data-theme="default" lang="en-US" data-marpit-pagination="39" style="--paginate:true;--header:Module 3: Deep Learning;--footer:Deep Learning – Introductory Course;--theme:default;" data-marpit-pagination-total="54" data-size="16:9">
<header>Module 3: Deep Learning</header>
<h1 id="cnn-intuition-feature-hierarchy">CNN Intuition: Feature Hierarchy</h1>
<p>In an image classifier:</p>
<ul>
<li>Early layers:
<ul>
<li>Detect simple features (edges, corners)</li>
</ul>
</li>
<li>Middle layers:
<ul>
<li>Detect parts (eyes, noses, wheels)</li>
</ul>
</li>
<li>Deeper layers:
<ul>
<li>Detect whole objects (faces, cars, animals)</li>
</ul>
</li>
</ul>
<p>This <strong>hierarchical feature learning</strong> is a core strength of deep learning.</p>
<footer>Deep Learning – Introductory Course</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-header="Module 3: Deep Learning" data-footer="Deep Learning – Introductory Course" data-theme="default" lang="en-US" data-marpit-pagination="40" style="--paginate:true;--header:Module 3: Deep Learning;--footer:Deep Learning – Introductory Course;--theme:default;" data-marpit-pagination-total="54" data-size="16:9">
<header>Module 3: Deep Learning</header>
<h1 id="recurrent-neural-networks-rnns">Recurrent Neural Networks (RNNs)</h1>
<p>Designed for <strong>sequences</strong>:</p>
<ul>
<li>Text (sentences, documents)</li>
<li>Speech (audio frames)</li>
<li>Time series (stock prices, sensor data)</li>
</ul>
<p>Key idea:</p>
<ul>
<li>Maintain a <strong>hidden state</strong> $$h_t$$ that carries information from previous time steps.</li>
</ul>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-header="Module 3: Deep Learning" data-footer="Deep Learning – Introductory Course" data-theme="default" lang="en-US" data-marpit-pagination="41" style="--paginate:true;--header:Module 3: Deep Learning;--footer:Deep Learning – Introductory Course;--theme:default;" data-marpit-pagination-total="54" data-size="16:9">
<header>Module 3: Deep Learning</header>
<h1 id="rnn-intuition">RNN Intuition</h1>
<p>Imagine reading a sentence word by word:</p>
<ul>
<li>At each new word, you <strong>update your understanding</strong>.</li>
<li>You retain some memory of previous words.</li>
</ul>
<p>RNNs try to mimic this by:</p>
<ul>
<li>Updating a hidden state step by step</li>
<li>Using that state to make predictions (e.g., next word, sentiment)</li>
</ul>
<footer>Deep Learning – Introductory Course</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-header="Module 3: Deep Learning" data-footer="Deep Learning – Introductory Course" data-theme="default" lang="en-US" data-marpit-pagination="42" style="--paginate:true;--header:Module 3: Deep Learning;--footer:Deep Learning – Introductory Course;--theme:default;" data-marpit-pagination-total="54" data-size="16:9">
<header>Module 3: Deep Learning</header>
<h1 id="limitations-of-simple-rnns">Limitations of Simple RNNs</h1>
<p>Simple RNNs struggle with:</p>
<ul>
<li>Very long sequences</li>
<li>Remembering information from far in the past</li>
<li><strong>Vanishing gradients</strong> across many time steps</li>
</ul>
<p>Improvements:</p>
<ul>
<li>LSTMs (Long Short-Term Memory)</li>
<li>GRUs (Gated Recurrent Units)</li>
<li>Transformers (which avoid recurrence completely)</li>
</ul>
<footer>Deep Learning – Introductory Course</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-header="Module 3: Deep Learning" data-footer="Deep Learning – Introductory Course" data-theme="default" lang="en-US" data-marpit-pagination="43" style="--paginate:true;--header:Module 3: Deep Learning;--footer:Deep Learning – Introductory Course;--theme:default;" data-marpit-pagination-total="54" data-size="16:9">
<header>Module 3: Deep Learning</header>
<h1 id="transformers">Transformers</h1>
<p>Transformers are the current <strong>state-of-the-art</strong> for many sequence tasks.</p>
<p>Key idea:</p>
<ul>
<li>Use <strong>self-attention</strong> to let each position in the sequence:
<ul>
<li>Look at <strong>all other positions</strong></li>
<li>Decide which are most important</li>
</ul>
</li>
</ul>
<p>No recurrence, full parallelism → very efficient on modern hardware.</p>
<footer>Deep Learning – Introductory Course</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-header="Module 3: Deep Learning" data-footer="Deep Learning – Introductory Course" data-theme="default" lang="en-US" data-marpit-pagination="44" style="--paginate:true;--header:Module 3: Deep Learning;--footer:Deep Learning – Introductory Course;--theme:default;" data-marpit-pagination-total="54" data-size="16:9">
<header>Module 3: Deep Learning</header>
<h1 id="self-attention-intuition">Self-Attention (Intuition)</h1>
<p>For a sentence:</p>
<blockquote>
<p>“The cat that sat on the mat was tired.”</p>
</blockquote>
<p>To understand “was tired”, the model needs to focus on <strong>“cat”</strong>, not “mat”.</p>
<p>Self-attention:</p>
<ul>
<li>Computes <strong>weights</strong> that tell the model:
<ul>
<li>How much each word should attend to every other word</li>
</ul>
</li>
<li>Learns dependencies regardless of distance in the sentence.</li>
</ul>
<footer>Deep Learning – Introductory Course</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-header="Module 3: Deep Learning" data-footer="Deep Learning – Introductory Course" data-theme="default" lang="en-US" data-marpit-pagination="45" style="--paginate:true;--header:Module 3: Deep Learning;--footer:Deep Learning – Introductory Course;--theme:default;" data-marpit-pagination-total="54" data-size="16:9">
<header>Module 3: Deep Learning</header>
<h1 id="transformers-in-practice">Transformers in Practice</h1>
<p>Transformers power:</p>
<ul>
<li>Machine translation</li>
<li>Large language models (chatbots, code assistants)</li>
<li>Text summarization</li>
<li>Many vision tasks (Vision Transformers)</li>
</ul>
<p>Deep learning today is largely driven by <strong>Transformer-based architectures</strong>.</p>
<footer>Deep Learning – Introductory Course</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-header="Module 3: Deep Learning" data-footer="Deep Learning – Introductory Course" data-theme="default" lang="en-US" data-marpit-pagination="46" style="--paginate:true;--header:Module 3: Deep Learning;--footer:Deep Learning – Introductory Course;--theme:default;" data-marpit-pagination-total="54" data-size="16:9">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-paginate="true" data-header="Module 3: Deep Learning" data-footer="Deep Learning – Introductory Course" data-theme="default" lang="en-US" data-marpit-pagination="47" style="--paginate:true;--header:Module 3: Deep Learning;--footer:Deep Learning – Introductory Course;--theme:default;" data-marpit-pagination-total="54" data-size="16:9">
<header>Module 3: Deep Learning</header>
<h1 id="some-deep-learning-applications">Some Deep Learning Applications</h1>
<ul>
<li><strong>Vision</strong>:
<ul>
<li>Face recognition, autonomous driving, medical imaging</li>
</ul>
</li>
<li><strong>Language</strong>:
<ul>
<li>Translation, question answering, chatbots</li>
</ul>
</li>
<li><strong>Audio</strong>:
<ul>
<li>Speech recognition, music generation</li>
</ul>
</li>
<li><strong>Recommendation</strong>:
<ul>
<li>Streaming services, online shops</li>
</ul>
</li>
</ul>
<p>Deep learning is embedded in many everyday technologies.</p>
<footer>Deep Learning – Introductory Course</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-paginate="true" data-header="Module 3: Deep Learning" data-footer="Deep Learning – Introductory Course" data-theme="default" lang="en-US" data-marpit-pagination="48" style="--paginate:true;--header:Module 3: Deep Learning;--footer:Deep Learning – Introductory Course;--theme:default;" data-marpit-pagination-total="54" data-size="16:9">
<header>Module 3: Deep Learning</header>
<h1 id="strengths-of-deep-learning">Strengths of Deep Learning</h1>
<ul>
<li>Handles <strong>raw, high-dimensional data</strong> (images, audio, text)</li>
<li>Learns rich <strong>representations</strong> automatically</li>
<li>Scales well with <strong>more data</strong> and <strong>compute</strong></li>
<li>Flexible: same basic ideas reused across domains</li>
</ul>
<footer>Deep Learning – Introductory Course</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-paginate="true" data-header="Module 3: Deep Learning" data-footer="Deep Learning – Introductory Course" data-theme="default" lang="en-US" data-marpit-pagination="49" style="--paginate:true;--header:Module 3: Deep Learning;--footer:Deep Learning – Introductory Course;--theme:default;" data-marpit-pagination-total="54" data-size="16:9">
<header>Module 3: Deep Learning</header>
<h1 id="limitations-and-risks">Limitations and Risks</h1>
<p>Technical challenges:</p>
<ul>
<li><strong>Vanishing / exploding gradients</strong> in very deep or recurrent networks</li>
<li>Needs <strong>lots of data</strong> and compute</li>
<li>Can be <strong>hard to interpret</strong> (“black box”)</li>
<li>Vulnerable to <strong>adversarial examples</strong></li>
</ul>
<p>Societal concerns:</p>
<ul>
<li>Can encode and amplify <strong>biases</strong> in data</li>
<li>Environmental cost (energy use) for very large models</li>
</ul>
<footer>Deep Learning – Introductory Course</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-paginate="true" data-header="Module 3: Deep Learning" data-footer="Deep Learning – Introductory Course" data-theme="default" lang="en-US" data-marpit-pagination="50" style="--paginate:true;--header:Module 3: Deep Learning;--footer:Deep Learning – Introductory Course;--theme:default;" data-marpit-pagination-total="54" data-size="16:9">
<header>Module 3: Deep Learning</header>
<h1 id="ethics-and-responsibility">Ethics and Responsibility</h1>
<p>Important questions:</p>
<ul>
<li>Who is responsible when a deep learning system fails?</li>
<li>How do we <strong>audit</strong> and <strong>explain</strong> model decisions?</li>
<li>How do we ensure systems are <strong>fair</strong> across different groups?</li>
<li>Should there be limits on certain applications?</li>
</ul>
<p>As future practitioners, you will need to think about <strong>both</strong>:</p>
<ul>
<li>Technical performance, <strong>and</strong></li>
<li>Social impact</li>
</ul>
<footer>Deep Learning – Introductory Course</footer>
</section>

<header>Module 3: Deep Learning</header>
<h1 id="module-3-%E2%80%93-key-takeaways">Module 3 – Key Takeaways</h1>
<p>You should now be able to:</p>
<ul>
<li>Explain what <strong>deep learning</strong> is and how it relates to ML</li>
<li>Describe the structure of an <strong>ANN</strong> (neurons, layers, activations)</li>
<li>Understand the roles of <strong>weights</strong>, <strong>biases</strong>, <strong>loss</strong>, <strong>backprop</strong>, and <strong>gradients</strong></li>
<li>Recognize <strong>vanishing / exploding gradients</strong> and why they matter</li>
<li>Recognize <strong>overfitting</strong> and basic <strong>regularization</strong> techniques</li>
<li>Distinguish between <strong>CNNs</strong>, <strong>RNNs</strong>, and <strong>Transformers</strong> at a high level</li>
<li>Appreciate some <strong>applications</strong>, limitations, and <strong>ethical issues</strong></li>
</ul>
<footer>Deep Learning – Introductory Course</footer>
</section>

<ol>
<li>One deep learning concept you feel you <strong>understand well</strong>.</li>
<li>One concept you are still <strong>uncertain</strong> about.</li>
<li>One application of deep learning you find <strong>exciting</strong> or <strong>concerning</strong>, and why.</li>
</ol>
<p>We will discuss some of your answers in the next session.</p>
